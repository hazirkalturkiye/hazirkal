/* ================= Gebelik: tehlike işaretleri ve ilk yardımda farklar =================
   Doğum yaptırma adımları bilerek yok (Utku kararı, 3 Kasım 2026): doğum başlarsa 112 görevlisi telefonda yönlendirir. */
H.yeniSayfa({id:"gebelik",cat:"ilk",ic:"heart",t:"Gebelik: tehlike işaretleri",d:"Kanama, su gelmesi, baş ağrısı · ilk yardımda farklar",h:
 "<p>Gebe bir kadında şunlardan biri varsa onu hemen sağlık kuruluşuna götür; kanama çoksa, havale geçiriyorsa, ağrısı şiddetliyse ya da bayılıyorsa <b>112'yi ara</b>:</p><ul><li>Vajinadan kanama</li><li>Vajinadan su gelmesi</li><li>Şiddetli baş ağrısıyla birlikte görme bulanıklığı, yüzde ve ellerde ani şişme (gebelik zehirlenmesi belirtisi)</li><li>Havale (kasılma nöbeti)</li><li>Bebeğin hareketlerinin azalması ya da hiç hissedilmemesi</li><li>Ateş</li><li>Şiddetli karın ağrısı</li><li>Nefes darlığı, göğüs ağrısı ya da bir bacakta ağrılı şişlik (→ <a href='#/g/tehlike'>Bacakta pıhtı</a>)</li></ul>"+
 cd("warn","<b>Dış gebelik:</b> Gebeliğin ilk haftalarındaki ya da adeti gecikmiş bir kadında tek taraflı karın ağrısıyla birlikte kanama, baş dönmesi ya da bayılma varsa bu dış gebelik olabilir: karın içine kanama olur. Hemen <b>112'yi ara</b>, kişiyi yatır, <u>ağızdan bir şey verme</u>.")+
 cd("info","<b>Doğum başlarsa</b> (kasılmalar sık ve düzenli geliyorsa ya da su geldiyse) <b>112'yi ara</b>. Telefonu hoparlöre al; görevli ne yapacağını adım adım söyler.")+
 "<h2>İlk yardımda gebeye özel</h2><ul>"+
 "<li><b>Yatırırken:</b> Gebeliğin 20. haftasından sonra kadını sırtüstü değil, <b>sol yanına</b> yatır: sırtüstü yatınca bebeğin ağırlığı büyük damara bastırır ve tansiyon düşer (→ <a href='#/g/nobet'>Bayılma</a>, <a href='#/g/bilincsiz'>Derlenme pozisyonu</a>).</li>"+
 "<li><b>Boğulmada:</b> 20. haftadan sonra karından değil, <b>göğüsten</b> bas (→ <a href='#/g/bogulma'>Boğulma</a>).</li>"+
 "<li><b>Karnına darbe aldıysa</b> (düşme, trafik kazası, enkaz): dışarıdan bir şey görünmese ve kendini iyi hissetse bile onu sağlık kuruluşuna götür; bebek zarar görmüş ya da plasenta (eş) yerinden ayrılmaya başlamış olabilir.</li>"+
 "<li><b>Su arıtırken:</b> Gebenin içeceği suyu <u>iyotla arıtma</u>; kaynat ya da klorla (→ <a href='#/g/suaritma'>Su arıtma</a>).</li>"+
 "<li><b>Sıcakta ve ishalde:</b> Gebe kadın sıvı kaybından daha çabuk etkilenir; sık sık su içsin (→ <a href='#/g/susuzluk'>İshal ve sıvı kaybı</a>).</li></ul>",
 src:"Hacettepe Üniversitesi Halk Sağlığı AD, Afetlerde üreme sağlığı bilgi notu (gebelikte tehlike işaretleri; IAWG Inter-agency Field Manual 2010); T.C. Sağlık Bakanlığı hastane bilgi sayfaları (gebelikte tehlike belirtileri); Dünya Sağlık Örgütü (DSÖ): Pregnancy, Childbirth, Postpartum and Newborn Care; ERC 2021 ilk yardım (gebede sol yan, boğulmada göğüs basısı)"},"anafilaksi");

/* ================= Hasta bakımı ve tehlike işaretleri ================= */
H.yeniSayfa({id:"tehlike",cat:"ilk",ic:"thermo",t:"Hasta bakımı ve tehlike işaretleri",d:"Doktora ulaşamazken: ne zaman acil?",h:
 "<p>Sağlık kuruluşuna ulaşmak zorsa hastayı yakından izle. Aşağıdaki tehlike işaretlerinden birini görürsen <u>bekleme</u>: 112'yi ara ya da kişiyi sağlık kuruluşuna götür.</p>"+
 "<h2>Yaşam bulguları nasıl ölçülür?</h2><ul>"+
 "<li><b>Nabız:</b> İşaret ve orta parmağını bileğin başparmak tarafına ya da boynun yan tarafına koy. 30 saniye say, ikiyle çarp. Yetişkinde dinlenirken dakikada yaklaşık 60–100 olur.</li>"+
 "<li><b>Solunum:</b> Göğsün kalkışını 30 saniye say, ikiyle çarp. Yetişkinde dakikada 12–20 olur. <u>Kişiye saydığını söyleme</u>: fark ederse nefesini değiştirir.</li>"+
 "<li><b>Ateş:</b> 38 °C ve üstü ateştir. 35 °C'nin altı vücudun aşırı soğuduğunu gösterir (→ <a href='#/g/hipotermi'>Hipotermi</a>).</li>"+
 "<li><b>Kılcal dolum:</b> Tırnağa 5 saniye bastır, bırak. Pembe renk 2 saniye içinde geri gelmeli; gelmiyorsa dolaşım bozulmuş olabilir. Soğukta bu test yanıltır.</li>"+
 "<li>Ölçtüğün değerleri saatiyle birlikte bir kâğıda yaz ve sağlık ekibine ver. Değerlerin nasıl değiştiği, tek bir ölçümden çok daha fazla şey söyler.</li></ul>"+
 "<h2>Tehlike işaretleri</h2>"+
 "<h3>Zatürre</h3><p>Ateş, öksürük, hızlı ya da zor nefes alma ve nefes alırken artan göğüs ağrısı zatürreyi düşündürür. Kişiyi sağlık kuruluşuna götür. Kişi 60 yaşın üstündeyse, kronik bir hastalığı varsa ya da küçük bir çocuksa beklemeden, hemen götür. Dudakları morarırsa, cümle kuramıyorsa ya da bilinci bulanıklaşırsa 112'yi ara.</p>"+
 "<h3>Menenjit (beyin zarı iltihabı)</h3><p>Ateşle birlikte şiddetli baş ağrısı, ense sertliği (çenesini göğsüne değdiremez), ışıktan rahatsız olma, kusma, uyuşukluk ya da bastırınca solmayan döküntü varsa <b>112'yi ara</b>. <b>Bardak testi:</b> Şeffaf bir bardağın yan yüzünü döküntüye bastır; lekeler bardağın altında solmuyorsa durum çok acildir. Döküntü olmadan da menenjit olabilir; <u>döküntüyü bekleme</u>. Hastayı başkalarından ayır; hastaya maske tak, kendin de maske tak.</p>"+
 "<h3>Sepsis (kana yayılan enfeksiyon)</h3><p>Yarası, zatürresi ya da idrar yolu enfeksiyonu olan birinde bilinç bulanıklığı, çok hızlı nefes, çok hızlı nabız, titreme, soğuk ve alacalı (lekeli) deri ya da idrarın çok azalması görülürse <b>112'yi ara</b>. Sepsis saatler içinde öldürebilir (→ <a href='#/g/sok'>Şok</a>).</p>"+
 "<h3>Apandisit</h3><p>Göbek çevresinde başlayıp birkaç saat içinde sağ alt karına kayan, yürüyünce ve öksürünce artan ağrı; ateş, iştahsızlık ve kusma apandisiti düşündürür. Kişiyi hemen sağlık kuruluşuna götür ya da 112'yi ara. <u>Ağrıyı ağrı kesiciyle geçiştirme. Lavman yapma; müshil, yiyecek ya da içecek verme.</u></p>"+
 "<h3>Dış gebelik</h3><p>Adeti gecikmiş ya da gebeliğinin başındaki bir kadında tek taraflı karın ağrısıyla birlikte kanama, baş dönmesi ya da bayılma varsa 112'yi ara (→ <a href='#/g/gebelik'>Gebelik: tehlike işaretleri</a>).</p>"+
 "<h3>İdrar yolu enfeksiyonu</h3><p>İdrar yaparken yanma ve sık sık idrara çıkma idrar yolu enfeksiyonunu düşündürür: kişi bol su içsin, <u>idrarını tutmasın</u>. Ateş, titreme ve böğür (belin yan tarafı) ağrısı başlarsa enfeksiyon böbreğe çıkmış olabilir; sağlık kuruluşuna git. Yaşlı birinde aniden başlayan zihin bulanıklığı da bu enfeksiyonun belirtisi olabilir.</p>"+
 "<h3>Sarılık</h3><p>Gözün beyazı ve deri sararır, idrar koyulaşır, dışkının rengi açılır. Bu, kirli su ve yiyecekle bulaşan hepatit A ya da E olabilir; başka nedenleri de vardır. Kişiyi sağlık kuruluşuna götür. Gebe bir kadında sarılık başlarsa onu hemen götür: hepatit E gebelikte ağır geçer. <u>Hasta kişi yemek hazırlamasın.</u> Herkes tuvaletten sonra ve yemekten önce ellerini sabunla yıkasın; içme suyunu arıt (→ <a href='#/g/sanitasyon'>Tuvalet ve hijyen</a>, <a href='#/g/suaritma'>Su arıtma</a>).</p>"+
 "<h3>Tetanoz</h3><p>Bir yaralanmadan günler sonra (çoğu zaman 3–21 gün) çenede kasılma (ağzını açamama), yutma güçlüğü, boyunda ve sırtta kas sertliği başlarsa <b>112'yi ara</b>. Yaraları iyi temizle (→ <a href='#/g/yara'>Yara bakımı</a>).</p>"+
 "<h3>Bacakta pıhtı ve akciğer pıhtısı</h3><p>Bir baldırda şişlik, ağrı, sıcaklık ve kızarıklık bacak toplardamarında pıhtı olduğunu gösterebilir: sağlık kuruluşuna git, <u>bacağı ovma</u>. Ani nefes darlığı, göğüs ağrısı, hızlı nabız ya da kanlı balgam başlarsa pıhtı akciğere gitmiş olabilir: <b>112'yi ara</b>.</p>"+
 cd("tip","<b>Pıhtıyı önlemek için:</b> Araçta ya da çadırda yatan herkes saatte bir bacaklarını oynatsın (ayak bileklerini çevirsin, parmak ucunda yükselsin), ara ara kalkıp yürüsün ve bol su içsin. Tuvalete gitmemek için su içmeyi kısmak pıhtı riskini artırır. 2004 ve 2016 Japonya depremlerinden sonra araçta uyuyanlar arasında akciğer pıhtısından ölümler oldu.")+
 "<h2>Yatağa bağımlı hasta</h2><ul><li>Bası yarası olmaması için hastanın duruşunu <b>2 saatte bir</b> değiştir (sırtüstü, sağ yan, sol yan). Kuyruk sokumu, kalça ve topuk gibi kemik çıkıntılarının altına yumuşak bir şey koy.</li><li>Derisini her gün kontrol et: geçmeyen kızarıklık bası yarasının başlangıcıdır.</li><li>Bilinci tam açıksa ve yutabiliyorsa ona sık sık, yudum yudum sıvı ver; içirirken başını ve sırtını kaldır. Hastayı temiz ve kuru tut.</li><li>Bilinci açıksa kollarını ve bacaklarını yatakta da oynatsın.</li></ul>"+
 "<h2>Hastaya bakarken</h2><ul><li>Hastaya dokunmadan önce ve sonra ellerini sabunla yıka. Öksürüğü ya da ateşi varsa hastaya maske tak; mümkünse ona tek kişi baksın (→ <a href='#/g/salgin'>Salgın</a>).</li><li>Hasta kendi ateş düşürücüsünü ya da ağrı kesicisini kullanacaksa kutusundaki talimata uymasına yardım et; emin değilsen eczacıya ya da hekime danış. <u>Aynı etken maddeyi içeren iki ilacı birlikte kullandırma</u> (ör. parasetamol içeren bir grip ilacının yanında ayrıca parasetamol). <u>Çocuğa aspirin verme.</u> Kene ısırığından sonra ateşlenen birine <u>aspirin ya da ibuprofen gibi ağrı kesiciler verme</u>: Kırım-Kongo kanamalı ateşinde (KKKA) kanamayı artırabilir. Kişiyi hemen sağlık kuruluşuna götür.</li><li>Ateşi olan hastaya bol sıvı ver, fazla giysisini çıkar.</li></ul>",
 src:SB+" (yaşam bulguları); NHS, Meningitis symptoms (bardak testi); NHS ve UK Sepsis Trust, sepsis belirtileri; Dünya Sağlık Örgütü (DSÖ), hepatit A; Ukai T., New Type of Preventable Death, Prehospital and Disaster Medicine 2005 (2004 Niigata-Chuetsu depremi); Japan Times, 14.04.2017 (2016 Kumamoto depremi, araçta barınma); Alton, The Survival Medicine Handbook (2013)"},"suda");

/* ================= Başkasına psikolojik ilk yardım ================= */
H.yeniSayfa({id:"psikoilk",cat:"temel",ic:"users",t:"Başkasına psikolojik ilk yardım",d:"İzle · dinle · bağ kur; çocuk, panik atak, intihar riski",h:
 "<p>Afetten sonra sarsılmış birine yardım etmek için uzman olman gerekmez. Psikolojik ilk yardım tedavi değildir: kişinin güvende hissetmesine, sakinleşmesine ve ihtiyacı olan yardıma ulaşmasına destek olur. Kendini sakinleştirmek ve ekibi yönetmek için → <a href='#/g/psiko'>Hayatta kalma psikolojisi</a>.</p>"+
 "<h2>İzle, dinle, bağ kur</h2>"+
 st(["<b>İzle:</b> Önce ortam güvenli mi, bak. Kimin yarası ya da acil ihtiyacı (su, yiyecek, sıcaklık, ilaç) var? Yalnız kalmış çocukları, yaşlıları, engelli kişileri ve donup kalmış ya da çok ağır tepki veren kişileri fark et. Yaralıya önce <a href='#/g/ilkadim'>ilk yardım</a> yap.",
 "<b>Dinle:</b> Kişiye sakin yaklaş, kendini tanıt, neye ihtiyacı olduğunu sor. Sakin ve yargılamadan dinle. <u>Kişiyi olanları anlatmaya zorlama</u>; susmak isterse yanında sessizce otur. <u>Tutamayacağın söz verme.</u>",
 "<b>Bağ kur:</b> Su, yiyecek, sıcak bir yer ve battaniye bulmasına yardım et. Yakınlarına ulaşmasını sağla. Onu yardım kurumlarına (AFAD, Kızılay, sağlık ekibi, sosyal hizmet ekipleri) yönlendir. Doğru bilgiyi ilet, <u>söylentileri yayma</u>."])+
 "<h2>Çocuklar</h2><ul><li>Çocuğun yanında kal. <u>Onu ailesinden ve tanıdığı kişilerden ayırma.</u></li><li>Yemek, uyku ve oyun saatlerini olabildiğince eskisi gibi sürdür.</li><li>Olanları yaşına uygun, basit ve dürüst sözlerle anlat; sorularını yanıtla.</li><li>Oyun oynamasına ve resim çizmesine izin ver: çocuk duygularını böyle anlatır.</li><li>Çocuğu afet görüntülerinden ve haberlerden uzak tut.</li><li>Çocuk yeniden altını ıslatabilir, parmağını emebilir, yanından hiç ayrılmak istemeyebilir ya da korkulu rüyalar görebilir. Bunlar ilk haftalarda normaldir. <u>Çocuğu bunlar için azarlama.</u></li></ul>"+
 "<h2>Panik atak</h2><p>Ani başlayan yoğun korku, çarpıntı, hızlı nefes, göğüste sıkışma, titreme ve \"öleceğim\" duygusu panik atağı düşündürür. Belirtiler genellikle <b>10 dakika</b> içinde en üst düzeye çıkar, sonra azalır.</p>"+
 st(["Kişiyi sakin bir yere al, yanında kal, yavaş konuş: \"Bu bir panik atak, geçecek. Buradayım.\"",
 "Birlikte yavaş nefes alın: <b>4 saniye</b> burundan al, <b>6 saniye</b> ağızdan ver. <u>Kâğıt torbaya nefes aldırma.</u>",
 "Ayaklarını yere bastırmasını ve çevrede gördüğü beş şeyi saymasını söyle: bu, dikkatini şu ana getirir."])+
 cd("warn","Kişi daha önce panik atak geçirmediyse, göğüs ağrısı kola, çeneye ya da sırta yayılıyorsa, belirtiler azalmak yerine artıyorsa ya da emin değilsen bunu kalp krizi kabul et ve <b>112'yi ara</b> (→ <a href='#/g/kalp'>Göğüs ağrısı</a>).")+
 "<h2>Kendine zarar verme riski</h2>"+
 cd("warn","Umutsuzluktan ya da ölmek istemekten söz eden birine bunu <b>doğrudan sor</b>: \"Kendine zarar vermeyi düşünüyor musun?\" Bunu sormak kişinin aklına fikir sokmaz; çoğu zaman onu rahatlatır. Yanıt evetse ya da emin değilsen <u><b>kişiyi yalnız bırakma</b></u>; ilaç, ip, kesici alet, silah gibi araçları ortadan kaldır ve <b>112'yi ara</b>.")+
 "<h2>Normal tepkiler</h2><p>İlk günlerde ve haftalarda uykusuzluk, irkilme, olayı yeniden yaşıyor gibi olma, öfke ve suçluluk normaldir; çoğu zamanla azalır. Bu tepkiler bir aydan uzun sürerse ya da kişinin yemesini, uyumasını, gündelik işlerini engellerse uzman yardımı al (aile hekimi, sağlık kuruluşu, psikososyal destek ekipleri).</p>"+
 cd("tip","Yardım eden sen de etkilenirsin. Düzenli dinlen, ye ve yaşadıklarını güvendiğin biriyle konuş."),
 src:"Dünya Sağlık Örgütü (DSÖ), War Trauma Foundation, World Vision International: Psychological First Aid: Guide for Field Workers (2011); Türk Kızılay, Psikolojik İlk Yardım El Kitabı (2026; İzle, Dinle, Bağ Kur); Hacettepe Üniversitesi Halk Sağlığı AD, Dünya Ruh Sağlığı Günü bilgi notu (2016; Bak, Dinle, İletişime geç); MEB Özel Eğitim ve Rehberlik Hizmetleri Genel Müdürlüğü, Afet ve Acil Durumlarda Psikososyal Destek Kılavuzu (2025; çocuklarda gerileme); Alton, The Survival Medicine Handbook (2013)"},"psiko");

/* g/psiko: uyku çelişkisi ("en az ~4,5–5,5 saat" ile "herkes en az 6 saat") ve yeni sayfaya bağlantı */
H.degis("psiko","Zor koşullarda bile günde en az ~4,5–5,5 saat uyu; normal ihtiyaç 7–8 saattir.","Günde en az 6 saat uyumaya çalış; normal ihtiyaç 7–8 saattir. Çok zor koşullarda bile uykun 4–5 saatin altına düşmesin.");
H.ekle("psiko",cd("info","Sarsılmış birine, çocuğa, panik atak geçirene ya da kendine zarar vermekten söz edene nasıl yardım edeceğin için → <a href='#/g/psikoilk'>Başkasına psikolojik ilk yardım</a>."));
})();

/* ek2.js: mevcut ilk yardım sayfalarına ekler (kitap karşılaştırması sonrası). Araçlar ek0.js'de. */
(function(){var H=window.HK,cd=H.cd,st=H.st;
function sayfaVar(id){return H.guide.some(function(x){return x.id===id})}

/* ---- Kafa ve omurga ---- */
H.degis("kafa","burnundan veya kulağından berrak sıvı geliyorsa, ","burnundan veya kulağından berrak sıvı geliyorsa, darbe almayan yerde iki gözünün çevresinde (rakun gözü) ya da kulağının arkasında morluk varsa (kafa tabanı kırılmış olabilir), ");
H.degis("kafa","Gece 2 saatte bir uyandır.","Gece 2 saatte bir uyandır (aşağıdaki 48 saat izlemine bak).");
H.ekle("kafa","<h2>Hastaneye ulaşamıyorsan: 48 saat izle</h2>"+
"<p>Kişi bilincini kısa bir süre kaybettiyse ve onu hastaneye ulaştıramıyorsan <b>48 saat</b> yakından izle. Yanında hep biri olsun; o gün dinlensin.</p><ul>"+
"<li>Uyumasına izin ver; onu uyutmamaya çalışman gerekmez. Ama gece 2 saatte bir uyandır ve konuştur: seni tanıyor mu, nerede olduğunu biliyor mu?</li>"+
"<li>Her uyandırdığında iki kolunu ve iki bacağını normal güçle oynatabiliyor mu, kontrol et.</li>"+
"<li>Göz çevresindeki ve kulak arkasındaki morluk saatler, hatta 1–2 gün sonra çıkabilir: her kontrolde bu bölgelere de bak.</li>"+
"<li>Kusarsa, baş ağrısı artarsa, kolunda ya da bacağında güçsüzlük başlarsa, kafası karışırsa, uyandırılamıyorsa ya da yukarıdaki tehlike işaretlerinden biri çıkarsa <b>112'yi ara</b>.</li></ul>"+
"<h2>Diş yaralanması</h2><ul>"+
"<li>Yerinden çıkan kalıcı dişi <b>taç kısmından</b> (ağızda görünen beyaz kısmından) tut; <u>kök kısmına dokunma</u>. <u>Dişin kurumasına izin verme.</u></li>"+
"<li>Dişi temiz bir kapta <b>sade süt</b> içine koy. Süt yoksa kişi bir kaba tükürsün, dişi bu tükürüğe koy; ya da serum fizyolojik kullan. <u>Dişi suda saklama, fırçalama ya da ovma.</u></li>"+
"<li>Kişiyi ve dişi en geç <b>60 dakika</b> içinde diş hekimine ulaştır.</li>"+
"<li>Diş kırıldıysa kırık parçayı bul, onu da sütte sakla ve 60 dakika içinde diş hekimine götür. Parçayı bulamasan da diş hekimine git.</li>"+
"<li>Çocuğun <b>süt dişi</b> çıktıysa <u>dişi yerine takma</u>; çocuğu yine de diş hekimine götür.</li></ul>");
H.kaynakEkle("kafa","Diş: T.C. Sağlık Bakanlığı Dental Travma Rehberi; ERC 2021 ilk yardım (diş yaralanması). Geç belirtiler ve 48 saat izlem: The Survival Medicine Handbook (Alton, 2013)");

/* ---- Kanama ---- */
H.ekle("kanama",cd("tip","<b>Kan durdurucu (hemostatik) gazlı bez varsa</b> 2. adımda normal bez yerine onu kullan: yaranın içine sıkıca doldur, üstünden en az <b>3 dakika</b> kesintisiz bastır. Ürünün paketindeki talimata uy; bazı ürünler daha uzun bası ister. Bu bez yoksa 2. adımdaki gibi temiz gazlı bezle doldur ve bastır."),{sonra:"<u>boynu çepeçevre sıkıca sarma</u>.</div></div>"});
H.kaynakEkle("kanama","hemostatik gazlı bez: TCCC (en az 3 dk bası), ürün talimatları");

/* ---- Göğüs ---- */
H.ekle("gogus","<h2>Göğse darbe: kaburga kırığı</h2>"+st([
"Göğsüne darbe alan kişide nefes alırken, öksürürken ya da hareket ederken artan, bir noktada yoğunlaşan ağrı varsa <b>kaburga kırılmış</b> olabilir. Kişiyi sağlık kuruluşuna götür.",
"Kişiyi <b>yarı oturt</b>. Ağrıyan tarafa bir yastık ya da katlanmış mont bastırsın; böyle destekleyerek sık sık derin nefes alsın ve gerektiğinde öksürsün. Ağrı yüzünden yüzeysel nefes alırsa zatürre gelişebilir.",
"<u>Kaburgayı sıkıca sarma ya da bantlama</u>: nefesi kısıtlar, zatürre riskini artırır.",
"Nefes darlığı artarsa, dudakları morarırsa, boyun damarları şişerse ya da şok belirtileri başlarsa (soluk, soğuk, terli cilt, hızlı nabız) akciğer sönmüş olabilir: <b>112'yi ara</b>, kişiyi yarı oturur hâlde tut (→ <a href='#/g/sok'>Şok</a>)."
]),{once:"<h2>Batan cisim</h2>"});
H.degis("gogus","<u><b>Batan cismi çıkarma.</b></u>","Yardım günlerce gelmeyecek olsa bile <u><b>batan cismi çıkarma</b></u> (yüzeysel olta iğnesi için aşağıya bak): cisim kanayan damarı tıkıyor olabilir, çekersen kanama başlar.");
H.kaynakEkle("gogus","Kaburga kırığı: ERC 2021; NHS (göğsü sıkıca sarmama). Batan cisim: T.C. Sağlık Bakanlığı İlk Yardım Uygulamaları Beceri Rehberi (MEB İSG 2025)");

/* ---- Yara ---- */
H.degis("yara","<u>Yaranın içine alkol ya da tentürdiyot dökme</u>","<u>Yaranın içine alkol, oksijenli su (hidrojen peroksit) ya da tentürdiyot dökme, sürme</u>");
H.degis("yara","<u><b>Kirli yaranın kenarlarını birleştirme</b></u>","<u><b>Kirli yaranın, ısırığın ve 8 saatten eski yaranın kenarlarını bantla birleştirme</b></u>");
H.ekle("yara"," Pansuman ıslanır ya da kirlenirse hemen değiştir.",{sonra:"Yarayı her gün kontrol et."});
H.ekle("yara"," Enfeksiyon yayılırken titreme, çok hızlı nefes, çok hızlı nabız ya da bilinç bulanıklığı da başlarsa enfeksiyon kana yayılmış (sepsis) olabilir: <b>112'yi ara</b> (→ <a href='#/g/tehlike'>Hasta bakımı ve tehlike işaretleri</a>).",{sonra:"Kırmızı çizgi görürsen ya da ateş çıkarsa hemen tıbbi yardım al."});
H.ekle("yara",cd("info","<b>Kirli yarada tetanoz:</b> Yara kirliyse ya da derinse (çivi, enkaz, toprak), ısırık, yanık ya da ezilme yarasıysa ve son tetanoz aşının üstünden <b>5 yıldan fazla</b> geçtiyse en kısa sürede aşı için sağlık kuruluşuna git. Temiz, küçük yarada bu süre <b>10 yıldır</b>. Hiç aşı olmadıysan, aşılarını tamamlamadıysan ya da bilmiyorsan her yarada git. Tetanoz belirtileri için → <a href='#/g/tehlike'>Hasta bakımı ve tehlike işaretleri</a>.")+
"<h2>Kıymık</h2><ul>"+
"<li>Ellerini ve kıymığın çevresini sabunla yıka.</li>"+
"<li>Kıymığı temiz bir cımbızla deriye en yakın yerinden tut, girdiği açıyla geri çekerek çıkar. Ucu deri altında kaldıysa bir iğneyi alevden geçir ya da alkolle sil; iğneyle ucu açığa çıkar, sonra cımbızla çek.</li>"+
"<li>Çıkardıktan sonra yeri sabunlu suyla yıka, ört ve enfeksiyon belirtilerini izle.</li>"+
"<li>Kıymık derinse, büyükse ya da gözdeyse <u>çıkarmaya uğraşma</u>; kişiyi sağlık kuruluşuna götür (→ <a href='#/g/goz'>Göz</a>).</li></ul>");
H.kaynakEkle("yara","Tetanoz: EKMUD Erişkin Bağışıklama Rehberi 2019 (yaralanmada tetanoz profilaksisi); TİTCK tetanoz aşısı kısa ürün bilgisi. Bantla kapatılmayacak yaralar, kıymık: The Survival Medicine Handbook (Alton, 2013)");

/* ---- Yanık ---- */
H.ekle("yanik"," Derin yanık beyaz, kahverengi ya da kömürleşmiş (siyah) görünür ve ağrısız olabilir: <u>ağrısı yok diye bekleme</u>, kişiyi mutlaka sağlık kuruluşuna götür.",{sonra:"ya da derinse kişiyi hastaneye götür."});
H.ekle("yanik","<h2>Yardım günlerce gelemiyorsa</h2><ul>"+
"<li>Sıvı vermeye devam et: kişinin bilinci tam açıksa ve kusmuyorsa ORS'yi yudum yudum içir (→ <a href='#/g/susuzluk'>İshal ve sıvı kaybı</a>). İdrarı açık renkte kalsın.</li>"+
"<li>Örtüyü temiz tut. Ellerini yıka, ıslanan ya da kirlenen örtüyü temiz bir streç film ya da poşetle değiştir.</li>"+
"<li>Yanığın çevresinde kızarıklık yayılırsa, ateş çıkarsa, yaradan kötü koku ya da irin gelirse enfeksiyon başlamış olabilir: kişiyi en kısa sürede sağlık kuruluşuna ulaştır. Titreme ya da bilinç bulanıklığı da varsa <b>112'yi ara</b>.</li></ul>"+
"<h2>Çocukta yanığı önle</h2><ul>"+
"<li>Tencerenin ve tavanın sapını ocağın içine doğru çevir.</li>"+
"<li><u>Çocuk kucağındayken ya da yanındayken sıcak içecek taşıma, içme.</u></li>"+
"<li>Sobanın ve ocağın çevresine çit ya da koruma teli koy; <u>çocuğu sobanın yanında yalnız bırakma</u>.</li>"+
"<li>Çocuğu banyoya sokmadan önce suyu dirseğinle dene: su ılık olmalı.</li></ul>");
H.kaynakEkle("yanik","Derin yanık, uzun süreli yanık bakımı ve çocukta yanık önleme: The Survival Medicine Handbook (Alton, 2013)");

/* ---- Kırık ---- */
H.ekle("kirik",cd("info","<b>Kırık mı, burkulma mı?</b> Şekil bozukluğu varsa, kişi o uzva hiç yük veremiyorsa, eklem olmayan bir yerde oynama varsa, kemiğin üstüne bastırınca keskin bir ağrı oluyorsa ya da üstünde yara varsa kırık var kabul et. Emin değilsen de kırık var kabul et."),{once:"<div class=\"step\"><div class=\"n\">1</div><div class=\"f\"><b>112'yi ara.</b>"});
H.ekle("kirik"," <u>Kırık uzuvdaki giysiyi çıkarmaya çalışma</u>; gerekirse giysiyi makasla kes.",{sonra:"yarayı temiz bezle ört."});
H.degis("kirik","parmak uçlarının rengine, ısısına ve hissine bak. Parmaklar morarmışsa, soğumuşsa ya da uyuşmuşsa bağı gevşet.","parmak uçlarının rengine, ısısına ve hissine bak; tırnağına bastırıp bırak, pembe renk 2 saniye içinde geri gelmeli. Parmaklar morarmışsa, soğumuşsa, uyuşmuşsa ya da renk geç geliyorsa bağı gevşet.");
H.ekle("kirik","<h2>Ayak bileği ve parmak kırığı</h2><ul>"+
"<li><b>Ayak bileği:</b> Bir yastığı ya da katlanmış battaniyeyi ayak bileğinin ve ayağın çevresine U biçiminde sar, üstünden 3–4 yerden bağla.</li>"+
"<li><b>Parmak:</b> Kırık parmakla yanındaki sağlam parmağın arasına ince bir bez koy, iki parmağı birlikte bantla.</li>"+
"<li>Bağladıktan sonra parmak uçlarının rengine ve hissine bak (4. adım).</li></ul>",{once:"<h2>Burkulma</h2>"});
H.kaynakEkle("kirik","Kırık mı burkulma mı, doğaçlama atel: The Survival Medicine Handbook (Alton, 2013)");

/* ---- Nöbet: şeker yükselmesi ---- */
H.ekle("nobet","<h2>Şeker yükselmesi (diyabetik ketoasidoz)</h2>"+
cd("info","Şeker hastasının insülini biterse, bozulursa ya da kişi hastalanırsa kan şekeri günler içinde tehlikeli biçimde yükselebilir.")+st([

"En önemli iş kişinin <b>insülinine</b> ulaşmasıdır: insülinini getir ya da kişiyi sağlık kuruluşuna ulaştır. Dozu kişi kendisi ya da sağlık ekibi ayarlasın; <u>sen insülin iğnesi yapma</u>.",
"Bilinci açıksa ve kusmuyorsa küçük yudumlarla su içir.",
"Bilinci bulanıklaşırsa <a href='#/g/bilincsiz'>derlenme pozisyonuna</a> al; normal nefes almıyorsa <a href='#/g/kpr'>KPR</a>'ye başla."
],true)+
cd("warn","<u><b>Şeker düşmesiyle karıştırma:</b></u> Şekerin düşük mü yüksek mi olduğunu bilmiyorsan ve kişi bilinçli, yutabiliyorsa önce <b>şeker ver</b> (yukarıdaki uyarı). Şeker düşmesi çok daha hızlı öldürür.")+
cd("tip","<b>İnsülini saklama:</b> Açılmamış insülin buzdolabında durur. Elektrik yoksa insülini serin ve gölge bir yerde tut: pişmiş toprak bir testinin içinde ya da ıslak bir bezle sarılı bir kapta saklayabilirsin. <u>İnsülini doğrudan buzun üstüne koyma, dondurma; donmuş insülini kullanma.</u> <u>Güneşte ya da arabada bırakma.</u>"));
H.kaynakEkle("nobet","Şeker yükselmesi: The Survival Medicine Handbook (Alton, 2013). İnsülin saklama: Cochrane 2023 (insan insülininin sıcaklığa dayanıklılığı, toprak kapta serinletme)");

/* ---- Astım ---- */
H.ekle("astim",cd("warn","<b>Sessiz göğüs:</b> Çok ağır krizde hırıltı kaybolabilir, çünkü akciğere giren hava azalmıştır. Kişi yorulmuşsa, konuşamıyorsa ya da uyuşuklaşıyorsa hırıltının azalması iyiye işaret değildir: <b>112'yi ara</b>."),{sonra:"veya kriz ilk kez oluyorsa <b>112'yi ara</b>.</div></div>"});
H.ekle("astim","bacakta oluşup akciğere giden pıhtı (<a href='#/g/tehlike'>akciğer pıhtısı</a>), ",{once:"duman veya gaz (<a href='#/g/zehir'>karbonmonoksit</a>)"});

/* ---- Hipotermi ---- */
H.ekle("hipotermi",cd("info","<b>Termometre:</b> Ev termometrelerinin çoğu 34 °C'nin altını ölçemez. Termometre ölçmüyorsa ya da çok düşük gösteriyorsa <u>ölçüme güvenme</u>: hipotermi var kabul et ve ne yapacağını tablodaki belirtilere göre seç."),{sonra:"</table></div>"});
H.ekle("hipotermi"," <b>Başka ısı kaynağı yoksa</b> ten tene ısıt: kişinin ve onu ısıtacak sağlıklı kişinin üst giysilerini çıkar, ikisini göğüs göğse aynı uyku tulumuna ya da battaniyenin altına koy.",{sonra:"yalnızca yüzü açık kalsın."});
H.kaynakEkle("hipotermi","Termometre ve ten tene ısıtma: The Survival Medicine Handbook (Alton, 2013)");

/* ---- Ayak ---- */
H.ekle("ayak","<h2>Siper ayağı (ıslak ve soğuk kalan ayak)</h2>"+
"<p>Ayaklar günlerce ıslak ve soğuk kalırsa donma olmadan da hasar görür. Önce uyuşma, şişme ve solukluk olur; ayak ısınınca kızarır, ağrır, karıncalanır.</p><ul>"+

H.ekle("tasima",cd("info","<b>Omurga şüphesinde sert sedye:</b> Battaniyeli ya da montlu sedye ortadan bel verir. Omurga yaralanması şüphesi varsa kapı kanadı ya da sert bir tahta kullan. Yaralıyı kütük gibi (baş, boyun ve gövde birlikte) çevirerek al, başının ve gövdesinin iki yanını rulo yapılmış battaniyeyle destekle, sedyeye bağla."),{sonra:"Yaralıyı koymadan önce sedyeyi sağlam bir kişiyle dene.</div></div>"});

"<p>Bulduklarını saatiyle birlikte not et; 112'ye ve sağlık ekibine söyle.</p>",{once:"<div class=\"card warn\"><b>Yapma:</b>"});

H.degis("yilan","Kişinin adrenalin kalemi varsa <b>emniyet kapağını çıkar</b>, iğne ucunu <b>uyluğun dış yüzüne</b> daya (giysinin üstünden de olur), <u>başparmağını kalemin ucuna koyma</u>; sertçe bastır ve kalemin üstünde yazan süre kadar tut (çoğunda 3–10 saniye). Düzelme olmazsa <b>5 dakika sonra</b> ikinci kalemi uygula. Nefes almakta zorlanıyorsa oturt; bayılacak gibiyse yatırıp bacaklarını kaldır.","Kişinin adrenalin kalemi varsa onu <b>hemen</b> uyluğunun dış yüzüne uygula (giysinin üstünden de olur). Kalemin nasıl kullanılacağı, ikinci kalem, duruş ve bayılmadan farkı için → <a href='#/g/anafilaksi'>Ağır alerji (anafilaksi)</a>.");
H.ekle("yilan","<h2>İnsan ısırığı</h2>"+

 "<p><b>Şunları görür ya da duyarsan</b> hemen uzaklaş, çevrendekileri uyar ve 112'yi ara:</p><ul>"+

 "<li>Yağmur dinmediği hâlde dere suyunun birden azalması ya da kesilmesi, suyun bulanıklaşması (yukarıda toprak kayıp dereyi tıkamış olabilir)</li>"+
 "<li>Yamaçtan gelen uğultu, ağaç çatırtısı ya da taş sesi</li></ul>"+
 st(["Açıktaysan kaymanın ve çamur akıntısının yolundan <b>yana doğru</b> çık, sonra yükseğe uzaklaş. <u>Akıntının önünden aşağı doğru kaçma</u>; <u>dere yatağına ve vadiye inme</u>.",

/* ---------- g/kayip: dağda ---------- */
H.degis("kayip","Daha uzağı görmek için güvenle çıkabileceğin bir tepe ya da yükselti varsa çık;",
 "Daha uzağı görmek için güvenle çıkabileceğin ve <b>geri inebileceğinden emin olduğun</b> bir tepe ya da yükselti varsa çık;");
H.ekle("kayip",
 "<h2>Dağda</h2><ul>"+
 "<li>Biri rotanı biliyorsa ve seni arayacaksa olduğun yerde kal, işaret ver (→ <a href='#/g/isaret'>İşaret verme</a>). Kimse seni aramayacaksa gündüz vadiye doğru in: aşağıda su, yol ve köy bulunur. Gece, sisli ve tipili havada barınakta bekle.</li>"+
 "<li><u>İnemeyeceğin yere tırmanma</u>. Engelin üstünden aşmak yerine çevresinden dolaş.</li>"+
 "<li>Dik yerde her an <b>üç dayanak noktan</b> olsun: iki el ve bir ayak ya da iki ayak ve bir el. Bir elini ya da ayağını oynatmadan önce öbür üçünün sağlam durduğundan emin ol.</li>"+
 "<li>Dik yamacı zikzak çizerek geç. Basacağın yeri önce yokla; <u>gevşek taşa ve çürük kütüğe basma</u>. Taş düşürürsen alttakilere \"TAŞ!\" diye bağır.</li>"+
 "<li>Gevşek taşlı (kayşat) yamaç ve aşağı doğru dikleşen yamaç, altındaki uçurumu gizler: inmeden önce yandan ya da karşı yamaçtan bakıp altını gör. <u>Dik kar yamacından kayarak inme.</u></li>"+
 "<li><b>Telefon sinyali</b> sırtta ve açık yükseltide daha iyidir, dar vadide ve vadi tabanında zayıftır (→ <a href='#/g/telefon'>Telefon ve SMS</a>).</li></ul>"+
 cd("warn","<b>Yaralı varsa ve telefon çekmiyorsa:</b> İlk yardım bilen kişi yaralının yanında kalsın. Yardım çağırmaya en dinç iki kişi gitsin; <u>kimseyi tek başına gönderme</u>. Gidenler yanlarına yazılı bir not alsın: konum (Araç › <a href='#/tools/gps'>Konumum</a> ekranındaki enlem-boylam ya da yol tarifi), yaralının durumu ve yapılan ilk yardım, saat, geride kalanların sayısı ve ihtiyaçları. Yolda telefon çekerse hemen 112'yi arasınlar."));

/* ---------- g/grupyuruyus: dağılmamak, sis ve tipi ---------- */
H.ekle("grupyuruyus",
 "<li><b>Grubu dağıtmamak:</b> Grubu çoğunlukla öndeki kişi kaybeder. Öndeki kişi her engelden (dere, kaya, dik iniş) sonra durup herkes gelene kadar beklesin. Dere geçişinden ve zor bir geçitten sonra sayım yapın. Rotadaki belirgin noktaları (köprü, çeşme, sırt) yola çıkmadan toplanma yeri olarak herkese söyle.</li>"+
 "<li><b>Sis ve tipide:</b> Aralıklı tek sıra yürüyün; herkes öndekini görebilsin. Pusulayı tutan kişi sıranın arkasında yürüsün ve en öndekini \"sağa, sola\" diye yönlendirsin ya da öndeki sık sık arkaya bakıp sırayı düz bir çizgide tutsun. Yalnızsan arkanda bıraktığın çubuk ya da taş yığınlarına bakarak doğrultunu kontrol et. Görüş çok düşerse dur ve bekle (→ <a href='#/g/hava'>Hava belirtileri</a>).</li>",
 {sonra:"Yanında yoksa ilk yapacağın alet budur.</li>"});

 cd("warn","<b>İp güvenliği:</b> <u>Kimsenin beline, göğsüne ya da boynuna kayan (sıkışan) ilmek bağlama</u>: yük gelince ilmek daralır, nefesi keser ve öldürebilir. İnsana yalnızca kazık düğümü gibi kaymayan bir ilmek bağla. Her düğüm ipi zayıflatır; bazı düğümler ipin dayanıklılığını yarıya indirir. Naylon ip başka bir ipe sürtününce ısınıp erir, keskin kaya kenarında kopar: kenarın altına bez ya da giysi koy. <u>Akan suda kimseyi ipe bağlama</u> (→ <a href='#/g/dere'>Dere geçişi</a>)."));

/* ek6.js: SAS Survival Handbook (Wiseman, 2009) karşılaştırması sonrası afet ekleri:

(function(){var H=window.HK;

/* ---------- g/yangin ---------- */
/* (1) Başlangıç yangınını söndürmek: bölümün başına */
H.ekle("yangin",
 "<h3>Yangın yeni başladıysa</h3>"+
 "<p>Yangın küçükse (çöp kovası, tava ya da tek bir eşya kadar), oda dumanla dolmadıysa ve çıkış kapısı arkanda kalıyorsa söndürmeyi dene; önce birine 112'yi arat. Öyle değilse <u>söndürmeye uğraşma</u>: herkesi çıkar, 112'yi ara.</p><ul>"+
 "<li><b>Yangın söndürücü:</b> Pimi çek. Hortumu alevlere değil, alevin dibine, yanan şeye tut. Tetiği sık ve hortumu sağa sola süpürür gibi gezdir. Söndürücü kısa sürede boşalır: yangın sönmezse hemen çık.</li>"+
 "<li><b>Tava ya da yağ yangını:</b> <u>Su dökme</u>: su değince yanan yağ her yere sıçrar, yangın büyür. Ocağı kapat. Tavanın kapağını kapat ya da üstüne ıslak bir havlu veya yangın battaniyesi ört. <u>Tavayı taşıma</u>, soğuyana kadar <u>kapağı ya da örtüyü kaldırma</u>.</li>"+
 "<li><b>Elektrikli cihaz:</b> Önce elektriği sigortadan ya da şalterden kes, sonra söndürücüyü kullan. <u>Su dökme.</u></li>"+
 "<li><b>Tüp:</b> Vanayı kapatabiliyorsan kapat. Kapatamıyorsan herkesi dışarı çıkar, uzaklaş ve 112'yi ara.</li></ul>"+
 "<h3>Binadan çıkarken</h3>",
 {sonra:"<h2>Bina yangını</h2>"});
H.degis("yangin",
 "ağzını ıslak bezle kapat.",
 "ağzını ıslak bezle kapat. Geçtiğin kapıları arkandan kapat ama <u>kapıları kilitleme</u>: kapalı kapı ateşi ve dumanı yavaşlatır. Dışarı çıkınca <u>binaya geri girme</u>; içeride kalan biri varsa itfaiyeye söyle.");
/* (3) Pencereden inmek: mahsur kalma adımının ardına */
H.ekle("yangin",
 "<h3>Pencereden inmek</h3>"+
 "<p>Yalnızca zemin kattaysan ya da 1. kattaysan ve kapıdan çıkamıyorsan pencereden in. Önce aşağıya yatak ya da minder at. Yüzün duvara dönük olarak pervaza tutun, kollarını uzatarak sark, sonra bırak; yere değerken dizlerini bük. 2. katta ya da daha yüksekteysen <u>pencereden atlama</u>: 3. adımdaki gibi kapıyı kapalı tut, camdan işaret ver ve itfaiyeyi bekle.</p>",
 {sonra:"yere yakın, alçakta kal.</div></div>"});
/* (2) Orman yangınında araçtaysan */
H.ekle("yangin",
 "<h3>Araçtaysan</h3><ul>"+
 "<li>Yol açıksa farlarını yak, yavaş sür ve yangından uzaklaş.</li>"+
 "<li>Yangın yolu kestiyse aracı bitkisi az, açık bir yere (çakıllık, sürülmüş tarla, yanmış alan) çek. Ağaçlardan ve çalılardan uzak dur.</li>"+
 "<li>Farları ve dörtlüleri yak, motoru durdur. Camları, kapıları ve havalandırmayı kapat.</li>"+
 "<li>Cam hizasının altına eğil, ayak boşluğuna çömel. Herkesi yün battaniyeyle ört; yün yoksa pamuklu bir örtü kullan. Su iç.</li>"+
 "<li><u><b>Araçtan çıkıp koşma.</b></u> Araç sallanabilir, içeri duman ve kıvılcım girebilir, içerisi ısınır: yine de araçta kal. Dışarıda ateşin yaydığı sıcaklık öldürür; araç seni bundan korur. Yakıt deposu nadiren patlar.</li>"+
 "<li>Alevler geçip sıcaklık düşünce dikkatle in ve yanmış alana geç; aracın metal yerleri sıcak olabilir. 112'yi ara.</li></ul>",
 {sonra:"yangının uğultusunu görmezden gelme</u>; erkenden uzaklaş.</div></div>"});
H.kaynakEkle("yangin","Wiseman, SAS Survival Handbook (2009); Ankara İtfaiyesi, alev alan yağa su dökülmez; CFA (Victoria İtfaiyesi, Avustralya) ve NSW RFS, orman yangınında araçta kalmak");

/* ---------- g/sel ---------- */
/* (5) Batan araç: sıra */
H.degis("sel",
 "Araç suda kaldıysa emniyet kemerini çöz, camı aç ya da kır, araçtan çık ve aracın tavanına çık.",
 "Araç suda kaldıysa vakit kaybetmeden şu sırayla davran: emniyet kemerini çöz, camı aç ya da kır, çocukları senden önce camdan çıkar, sonra sen çık ve aracın tavanına çık. <u>Kapıyı zorlamakla vakit kaybetme</u>: suyun basıncı kapıyı açtırmaz. <u>Eşya almak ya da 112'yi aramak için durma</u>; önce çık. Bazı yeni araçların yan camı lamine camdır (kırılınca dağılmayan, iki katlı cam) ve cam kırıcıyla kırılmaz: o zaman arka camı kır.");
/* (4) Binada mahsur kalmak */
H.ekle("sel",
 "<h2>Selde binada mahsur kalırsan</h2><ul>"+
 "<li>Su hızla yükseliyorsa sağlam binada kal. <u>Yürüyerek ya da araçla çıkmaya çalışma.</u></li>"+

/* İle göre metin: tüm içerik yüklendikten sonra bir kez çalışır.

(function(){

 :{SAPMA:"6",OGLE:"12.00–13.30 arası (doğuda erken, batıda geç)",KIBLE:"güneydoğu ile güney arasına",CANAK:"güneye ya da güney-güneydoğuya"};

 return s.replace(/\{IL\}/g,I?I.ad:"İlin").replace(/\{BOLGE\}/g,I?I.bolgeAd:"").replace(/\{(SAPMA|OGLE|KIBLE|CANAK)\}/g,function(m,k){return EK[k]})}

/* ---------- Coğrafya yardımcıları ---------- */
function rad(d){return d*Math.PI/180}
function dist(a,b){var R=6371,dLa=rad(b.lat-a.lat),dLo=rad(b.lon-a.lon);var h=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)*Math.sin(dLo/2);return 2*R*Math.asin(Math.sqrt(h))}
function brg(a,b){var y=Math.sin(rad(b.lon-a.lon))*Math.cos(rad(b.lat));var x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lon-a.lon));return (Math.atan2(y,x)*180/Math.PI+360)%360}
var DIRS=["K","KKD","KD","DKD","D","DGD","GD","GGD","G","GGB","GB","BGB","B","BKB","KB","KKB"];
function dir(b){return DIRS[Math.round(b/22.5)%16]}
function days(km){var walk=km*1.3; /* yol kıvrımı payı */ return walk<20?"<1 gün":(walk/22).toFixed(1).replace(".",",")+" gün"}
function omMap(ps){return "om://map?v=1"+ps.map(function(p){return "&ll="+p.lat+","+p.lon+"&n="+encodeURIComponent(p.n)}).join("")}

function fix(cb){
  if(!navigator.geolocation){cb(null,"Bu cihazda konum özelliği yok.");return}
  navigator.geolocation.getCurrentPosition(function(p){
    var f={lat:+p.coords.latitude.toFixed(5),lon:+p.coords.longitude.toFixed(5),acc:Math.round(p.coords.accuracy),alt:p.coords.altitude==null?null:Math.round(p.coords.altitude),t:Date.now()};
    store.set("lastfix",f);cb(f);
  },function(e){cb(null,e.code===1?"Konum izni verilmedi.":"Konum alınamadı. Açık alana çık, 1–2 dakika bekle ve yeniden dene.")},{enableHighAccuracy:true,timeout:90000,maximumAge:60000});
}

/* ---------- Güneş doğuş / batış (NOAA basit algoritma) ---------- */
function sunTimes(date,lat,lon){
  var start=new Date(date.getFullYear(),0,0),N=Math.floor((date-start)/864e5);
  function calc(rise){
    var lngHour=lon/15,t=N+((rise?6:18)-lngHour)/24;
    var M=0.9856*t-3.289;
    var L=(M+1.916*Math.sin(rad(M))+0.020*Math.sin(rad(2*M))+282.634)%360; if(L<0)L+=360;
    var RA=Math.atan(0.91764*Math.tan(rad(L)))*180/Math.PI; RA=(RA+360)%360;
    RA=RA+(Math.floor(L/90)*90-Math.floor(RA/90)*90); RA/=15;
    var sinDec=0.39782*Math.sin(rad(L)),cosDec=Math.cos(Math.asin(sinDec));
    var cosH=(Math.cos(rad(90.833))-sinDec*Math.sin(rad(lat)))/(cosDec*Math.cos(rad(lat)));
    if(cosH>1||cosH<-1)return null;
    var H=rise?360-Math.acos(cosH)*180/Math.PI:Math.acos(cosH)*180/Math.PI; H/=15;
    var T=H+RA-0.06571*t-6.622, UT=((T-lngHour)%24+24)%24;
    var d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate(),0,0,0));
    return new Date(d.getTime()+UT*36e5);
  }
  return {rise:calc(true),set:calc(false)};
}

function flash(msg,loop){
  var fl=$("#flash"),U=220,seq=[],tm=null;
  var code=msg.toLocaleUpperCase("tr").split("").map(function(c){return c===" "?"/":(MORSE[c]||"")});
  code.forEach(function(c,ci){if(c==="/"){seq.push([0,U*4]);return}c.split("").forEach(function(s,i){seq.push([1,s==="."?U:U*3]);seq.push([0,U])});seq.push([0,U*2])});
  seq.push([0,U*7]);
  var i=0;fl.classList.add("on");
  function step(){if(i>=seq.length){if(loop)i=0;else return stop()}var s=seq[i++];fl.style.background=s[0]?"#fff":"#000";tm=setTimeout(step,s[1])}
  function stop(){clearTimeout(tm);fl.classList.remove("on");fl.style.background="#000"}
  $("#flash button").onclick=stop;stops.push(stop);step();
}
