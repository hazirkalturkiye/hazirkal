{id:"tasima",cat:"ilk",ic:"users",t:"Yaralı taşıma & sedye",d:"Doğaçlama sedye, taşıma yolları",h:
 S("stretcher","Doğaçlama sedye — adım adım")+
 "<ul><li>Sırıklar hastadan ~1 m uzun olsun; iki ucuna kısa çapraz çubuk bağla ki sırıklar açılmasın (~50–60 cm).</li><li>Kurtarıcılar soğukta kendi montlarını feda etmesin: önce yedek giysi ve branda kullan. Branda/panço tüp sedye de olur.</li><li><b>Kütük gibi çevirme:</b> Biri başı tutar ve komut verir, biri gövde, biri bacaklar. Sağlam yana çevir, sedyeyi altına kaydır, geri çevir, bağla.</li><li><b>Bilinçsiz, bacak kırığı veya omurga şüphesi = sadece sedye.</b></li><li>Kısa mesafe, bilinci açık hasta: iki kişilik el koltuğu (dört el kenetli) veya sırtta taşıma.</li><li>Kaldırırken sırt dik, bacaklardan güç al, tek komutla.</li></ul>",src:"DK Survival Handbook; Türk Kızılay"},
{id:"kafa",cat:"ilk",sos:1,ic:"brain",t:"Kafa & omurga yaralanması",d:"Tehlike işaretleri, baş sabitleme",h:
 cd("warn","<b>Hemen tahliye gerektirenler:</b> herhangi bir bilinç kaybı, tekrarlayan kusma, kötüleşen baş ağrısı, konfüzyon veya tuhaf davranış, göz bebeklerinin eşit olmaması, burun/kulaktan berrak sıvı, nöbet, vücudun bir yanında güçsüzlük.")+
 st(["Saçlı deri çok kanar ve kafatası kırığını gizleyebilir: oturt, deri kapağını yerine koy, pedle bastır, sar.","Yüksekten düşme, sırt üstü düşme, enkaz, trafik: <b>omurga yaralanması var kabul et</b>.","Başın arkasına diz çök veya yat, dirseklerini uyluklarına daya, iki elinle başı iki yandan tut, boyun düz kalsın. <b>Kulakları kapatma</b>: seni duysun. Rahat bir pozisyon bul; uzun sürebilir.","Sadece hayati tehlikede (yangın, çökme) kütük gibi çevir/taşı.","Bilinci 15 dk'da bir kontrol et: <b>U</b>yanık mı, <b>S</b>ese mi, <b>A</b>ğrıya mı yanıt veriyor, yoksa yanıtsız mı? Gece en az 2 saatte bir uyandırıp kontrol et. Alkol, uyku ilacı verme."],true),src:"DK Survival Handbook; standart ilk yardım"},
{id:"gogus",cat:"ilk",sos:1,ic:"lung",t:"Göğüs yarası & batan cisim",d:"Delici yara, batan nesne, olta iğnesi",h:
 "<h2>Göğüste delici yara</h2>"+st(["Göğüste ya da sırtın üst kısmında bir yara varsa, yara köpürüyor ya da hava çekerken ses çıkarıyorsa ve kişinin nefesi daralıyorsa akciğer zarar görmüş olabilir. 112'yi ara.","Kanamayı bastırarak durdur. <u>Yarayı <b>tamamen kapatma</b>.</u> Yaradan emme sesi geliyorsa üstüne bir plastik parçası ya da poşet koy, <b>üç kenarını</b> bantla, bir kenarını açık bırak (hava dışarı çıkabilsin). Varsa havalandırmalı (valfli) göğüs yaması kullan. Emme sesi yoksa yarayı açık bırak ya da hava geçiren temiz bir bezle ört.","Yamanın dört kenarı da yapışmışsa ve nefes kötüleşirse bir kenarını kaldırıp havayı boşalt.","Kişiyi yarı oturur hâlde, yaralı tarafına doğru eğik tut. En kısa sürede sağlık kuruluşuna ulaştır."],true)+cd("warn","<b>Karın yarası:</b> <u>Dışarı çıkan organı <b>içeri itme</b>.</u> Üstüne nemli, temiz bir bez ya da streç film koy. Kişiyi sırtüstü, dizleri bükük yatır. <u>Ağızdan bir şey verme.</u> 112'yi ara.")+
 "<h2>Batan cisim</h2>"+st(["<u><b>Batan cismi çıkarma.</b></u> Cismin iki yanından bastır; yara kenarlarını cisme bastırmadan birbirine yaklaştır.","Cismin iki yanına rulo bandaj ya da bez yığarak cismi sabitle, üstünden sar.","10 dakikada bir, cismin ötesinde kalan bölgede (el, ayak) dolaşımı kontrol et."])+
 "<h2>Olta iğnesi</h2><ul><li>İğne derine batmışsa, göze yakınsa ya da bir eklemdeyse misinayı kes, iğnenin çevresini bezle doldur, sar ve kişiyi sağlık kuruluşuna götür.</li><li>Sağlık kuruluşuna ulaşamıyorsan ve iğnenin kancalı ucu deriden dışarı çıkmışsa ucu penseyle kes, iğneyi geri çek. Uç görünmüyorsa iğneyi kararlı bir hareketle ileri it, ucunu deriden çıkar, ucu kes ve gövdeyi geri çek. Sonra yarayı temizle, ört ve enfeksiyon belirtilerini izle.</li></ul>",src:"DK Survival Handbook; ERC 2021"},
{id:"goz",cat:"ilk",ic:"sun",t:"Göz yaralanması & kar körlüğü",d:"Toz, batan cisim, kar/su parlaması",h:
 st(["<u>Gözünü <b>ovma</b>.</u> Yaralının başını dizlerinin üstüne yatır. Yaralı gözü steril bir pedle ört ve <b>iki gözünü de oynatmamasını</b> iste: gözler birlikte hareket eder.","Göze bir cisim batmışsa <u>asla çıkarma</u>; cismin çevresini bezle destekle. İki gözü de kapat ve kişiyi sağlık kuruluşuna götür.","Gözün yüzeyindeki toz ya da sineği temiz bir bezin ucuyla al ya da temiz suyu <b>sağlam gözden uzağa</b> doğru akıtarak yıka. <u>Göze yapışmış cismi almaya çalışma.</u>","Göze kimyasal madde kaçtıysa en az 10–20 dakika bol suyla yıka."])+
 cd("info","<b>Kar körlüğü:</b> Karda, suda ve açık bozkırda yansıyan UV ışınları (güneşin yakıcı ışınları) gözü yakar. Belirtiler saatler sonra başlar: gözde kum varmış gibi batma, sulanma, ışığa bakamama. Korunmak için güneş gözlüğü tak. Gözlük yoksa kartondan ya da ağaç kabuğundan <b>dar yarıklı bir gözlük</b> yap, iple başına bağla. Kar körlüğü olursa iki gözü de pedle kapat, kişiyi karanlıkta dinlendir; genelde 1–3 günde geçer."),src:"DK Survival Handbook"},
{id:"zehir",cat:"ilk",ic:"bio",t:"Zehirlenme",d:"Yutma, temas, gaz",h:
 cd("warn","<b>Önce kendini koru</b> (eldiven, maske). <u>Kusturma. Ağızdan hiçbir şey verme: süt, yoğurt, su da verme.</u> Ağzında kalan varsa tükürsün. Ne yuttuğunu, ne zaman ve ne kadar yuttuğunu not et, ambalajı sakla. <b>Zehir Danışma (UZEM): 114</b> (24 saat) · Acil: 112.")+
 "<h2>Yutma</h2><ul><li>Bilinci kapalı ama nefes alıyorsa derlenme pozisyonuna al; nefes yoksa KPR'ye başla (ağızdan ağıza koruyucu kullan).</li><li>Aktif kömürü yalnızca 114 önerirse ver.</li></ul><h2>Temas</h2><ul><li>Bulaşmış giysiyi eldivenle çıkar. Deriyi 20 dakika bol suyla, gözü 10–20 dakika yıka.</li><li><u>Ellerini yıkamadan gözüne, ağzına, cinsel bölgene dokunma.</u></li></ul><h2>Gaz</h2><ul><li>Hemen temiz havaya çık (aşağıda: Karbonmonoksit).</li></ul>",src:"T.C. Sağlık Bakanlığı UZEM"},

/* ---------- SU ---------- */
{id:"sutopla",cat:"su",ic:"drop",t:"Su toplama yöntemleri",d:"Çiy, terleme torbası, sızma kuyusu, kar",h:
 "<h2>Çiy</h2><p>Açık ve rüzgârsız bir gecenin sabahında (ilkbaharda ve sonbaharda bozkırda) güneş doğmadan önce ayak bileklerine emici bir bez sar ve uzun otların arasında yürü. Bez ıslandıkça sık sık sıkıp suyu bir kaba al. Araba tavanı, branda gibi su geçirmeyen yüzeylerdeki çiyi de bezle silip sıkabilirsin.</p>"+
 "<h2>Terleme torbası</h2><p>Güneş alan, yapraklı bir dalı (söğüt, kavak; <u><b>zehirli bitkiyi asla kullanma</b></u>) şeffaf bir poşetin içine al. Poşetin en alçak köşesine küçük bir çakıl koy, ağzını dalın çevresine sıkıca bağla. Gün boyunca bu köşede su birikir. Poşete bir hortum taktıysan poşeti açmadan içebilirsin. Kesilmiş yeşil yaprakla doldurulmuş bir poşet de güneşte su verir.</p>"+
 "<h2>Sızma kuyusu</h2><p>Durgun bir göletten ya da bataklıktan 1–2 m uzakta bir çukur kaz; ıslak toprağa ulaşınca 30 cm daha in. Çukura dolan suyu birkaç kez boşalt; su berraklaşınca al ve yine de arıt.</p>"+
 "<h2>Kar ve buz</h2><ul><li>Mümkünse <b>buz</b> erit: kardan daha yoğundur, daha çabuk su verir.</li><li>Kabın dibine <b>önce biraz su</b> koy, yoksa kap yanar. <u>Karı kaba bastırarak sıkıştırma.</u></li><li>Ateşin üstüne eğik bir düz taş yerleştir, taşa kar yığ: eriyen su kaba akar. Ya da karla doldurduğun bir çorabı veya tişörtü ateşin yanına as, altına kap koy.</li><li>Şişeleri <b>ters</b> (kapağı aşağıda) sakla: buz önce şişenin dibinde oluşur, kapak donmaz. Şişeleri en az 30 cm karın altına gömersen donmazlar.</li><li>Dinlenirken <u>kar yeme, karı vücudunun ısısıyla eritmeye çalışma</u>: bu, hipotermiyi (vücut ısısının tehlikeli düşüşünü) hızlandırır.</li></ul>"+
 cd("warn","<b>Güneş damıtıcısı (solar still) çoğu zaman işe yaramaz:</b> Lundin'in derslerinde öğrenciler damıtıcıyı kazarken, damıtıcının verdiğinden daha fazla suyu terle kaybetti. Ancak gölgede, serin saatte ve başka yol yoksa dene. Kuru dere yatağını da yalnızca serin saatlerde kaz; 30 cm derinlikte nem yoksa kazmayı bırak.")+
 cd("tip","Arıtılmış su, arıtılmamış su ve yakıt şişelerini renkli bantla açıkça işaretle: gece karışır. İki şişe kullan: birindeki su arıtılırken diğerinden iç."),src:"DK Survival Handbook; Lundin, 98.6 Degrees"},

/* ---------- BARINAK ---------- */
{id:"kar",cat:"bar",ic:"snow",t:"Kar barınakları",d:"Kar siperi, kar höyüğü, havalandırma",h:
 "<p>Taze karın %90–95'i içinde hapsolmuş havadır; bu yüzden çok iyi yalıtır. Dışarısı −20 °C iken kar barınağının içi 0 °C civarında kalabilir.</p>"+
 "<h2>Kar siperi (en hızlısı)</h2>"+st(["Yürüyüş sopasıyla (batonla) karın derinliğini ölç. Uzanınca sen ve eşyan sığacak uzunlukta, içinde dönebileceğin kadar derin (yaklaşık 60–90 cm) bir hendek kaz.","Tabana en az <b>25 cm</b> kalınlıkta çam dalı ser.","Hendeğin üstüne dallar diz, dalların üstüne branda ser, brandanın üstüne en az 30 cm kar yığ.","Bir ucuna giriş çukuru kaz. Biri alçak, biri yüksek noktada olmak üzere 7–10 cm'lik havalandırma delikleri aç."])+
 "<h2>Kar höyüğü (quinzee)</h2>"+st(["Yere bir daire çiz, içindeki karı ayakla sıkıştır. Ortaya çantaları ve bir dal yığını koy, üstünü brandayla ört.","Üstüne kürekle gevşek kar yığ; duvar her yerde en az <b>25 cm</b> kalınlıkta olsun.","Karın sertleşmesi için <b>1–3 saat bekle</b>. Sonra höyüğün her yerine 30–45 cm'lik çubuklar sapla.","Girişi rüzgâr yönüne dik (90°) olacak biçimde kaz. İçerideki çantaları ve dalları çıkar, çubukların uçlarını görene kadar içeriyi oy.","Yatacağın yeri giriş seviyesinden yüksek yap (soğuk hava aşağıda toplanır). Tepede yumruk büyüklüğünde bir delik aç."])+
 cd("warn","Havalandırma deliklerini 1–2 saatte bir kontrol et. <u>Gece boyunca mum, ocak ya da ateş yanık bırakma</u> (karbonmonoksit zehirlenmesi). Tek mum içeriyi yaklaşık 4 °C ısıtır; daha fazlası duvarları eritir, eriyen kar sonra donar ve yalıtım bozulur. Küreği içeride tut, girişi işaretle; içeri girmeden üstündeki karı silkele."),src:"DK Survival Handbook"},
{id:"dogalbar",cat:"bar",ic:"leaf",t:"Doğal barınaklar & yer seçimi",d:"Devrik ağaç, çukur, mağara; kural listesi",h:
 "<ul><li>Girişi rüzgâra <b>dik açıyla</b> yap. Barınağı bugünkü havaya göre değil, en kötü havaya göre kur.</li><li>Kayın, dişbudak gibi ağaçlar uyarı vermeden dal düşürür; ayakta duran kuru ağaç rüzgârda ve kar yükü altında devrilir. <u>Bunların altına barınak kurma.</u></li><li><u>Barınağı gürültülü akan suyun yanına kurma</u>: su sesi helikopter ve düdük sesini bastırır.</li><li>Yağış bekleniyorsa barınağın çevresine suyun akıp gideceği bir hendek aç.</li><li>Yatak yerden en az 10 cm yüksek olsun. 15 cm'lik yaprak yığını ezilince 5 cm'ye iner: yeter sandığının <b>2 katı</b> yaprak topla ve kütüklerle sabitle. Eğimli yerde başın yukarıda olacak biçimde yat.</li><li>Çalışırken terlememek için üstündeki giysi katlarını çıkar. Barınağı kararmadan bitir.</li></ul>"+
 "<h2>Devrik ağaç ve kökleri</h2><p>Kırılıp asılı kalmış bir dal barınağın sırığı olur; devrik gövde de bir duvar işi görür. Ağacın sağlam durduğunu kontrol et, dibinde hayvan yuvası var mı bak. <u>Ölü ağacın altında ateş yakma.</u></p>"+
 "<h2>Mağara</h2><ul><li><u>Göremediğin derinliğe girme; eski maden ocaklarına hiçbir zaman girme.</u></li><li>Sersemlik hissedersen, nabzın hızlanırsa ya da alev sönükleşir veya mavi yanarsa oksijen azalmış, karbondioksit (CO₂) artmış demektir: <b>hemen dışarı çık</b>.</li><li>Ateşi yalnızca hava akımı varsa yak, mağaranın dibinde yak. Girişe yığacağın taşlar ısıyı içeri yansıtır.</li></ul>",src:"DK Survival Handbook"},

/* ---------- ATEŞ ---------- */
{id:"surtunme",cat:"ates",ic:"fire",t:"Yay matkabı (sürtünmeyle ateş)",d:"Kibrit ve çakmak yokken",h:
 cd("info","Bu yöntemi krizden önce en az 5–10 kez başarıyla dene. <b>Odun seçimi:</b> Tırnağın odunda kolayca iz bırakıyorsa odun yumuşaktır ve uygundur. Sürtünmeden çıkan yanık toz ince ve koyu renkliyse doğru odunu seçmişsin demektir. Dere kenarında <b>söğüt ve kavak</b>, ormanda <b>ıhlamur</b> bulursun.")+
 S("bowdrill","Yay matkabı — adım adım")+
 "<ul><li>Yayın ipini mile bir kez sar; mil ipin dış tarafında kalsın. İp fazla gergin olursa kayar, gevşekse mili döndürmez.</li><li>Üstteki yatağın çukuruna yeşil yaprak koy: sürtünmeyi azaltır.</li><li>Önce yayı yavaş ve tam boyunca çek. Duman çıkınca hızlan ve daha çok bastır, sonra <b>10 sert tur</b> daha çevir.</li></ul>",src:"DK Survival Handbook"},
{id:"atesalt",cat:"ates",ic:"flash",t:"Alternatif ateş yolları",d:"Pil ve çelik yünü, mercek, permanganat",h:
 "<ul><li><b>Pil ve çelik yünü (bulaşık teli):</b> İnce çelik yününü 9 V pilin iki kutbuna birlikte sür; ya da 1,5 V pilin iki ucu arasına ince bir tel ger. Tel kızarır ve kavı tutuşturur. Pili çabuk boşaltır, kısa tut.</li><li><b>Mercek:</b> Büyüteç, okuma gözlüğü ya da kredi kartı boyutunda düz mercek (Fresnel). Güneş ışığını kavın üstünde en küçük ve en parlak noktada sabit tut. Kış güneşinde zayıftır.</li><li><b>İçecek kutusunun tabanı:</b> Diş macunu ya da kömür tozuyla ayna gibi parlatırsan güneşi bir noktada toplar.</li><li><b>Potasyum permanganat ve şeker:</b> Eşit miktarda ezip karıştır, bıçak sırtıyla bastırarak sürt: kısa bir parlama olur. Kavı önceden hazırla.</li></ul>"+
 "<h2>Kavı güçlendir</h2><ul><li><b>Vazelinli pamuk:</b> Ceviz kadar vazelini pamuğa yedir, ortası kuru kalsın. Düz pamuktan ~10 kat uzun yanar; dudak kremi olarak da işe yarar.</li><li><b>Kömürleşmiş bez:</b> %100 pamuklu bez parçalarını kapağında çivi deliği olan kapalı bir kutuya koy, kutuyu korların üstüne bırak; delikten duman çıkması bitince hazırdır. Tek bir kıvılcımı bile yakalar.</li><li><b>Mumlu karton kutu:</b> Ayakkabı boyası kutusuna sıkıca sarılmış oluklu karton koy, üstüne erimiş mum dök: saatlerce yanan, az dumanlı bir ısıtıcı olur.</li></ul>"+
 cd("warn","<u>Merceği ve cam su sürahisini güneşte, araç ya da çadır içinde bırakma</u>: yangın çıkarabilir."),src:"DK Survival Handbook; Lundin, 98.6 Degrees"},

/* ---------- NAVİGASYON ---------- */
{id:"pusulasiz",cat:"nav",ic:"compass",t:"Pusulasız kuzeyi bulma",d:"Telefon, güneş, çanak anten, cami, yıldız",h:
 "<p>Aşağıdaki yollar en kolaydan zora doğru sıralı. İkisini birlikte kullan: biri diğerini doğrular.</p>"+
 st(["<b>Telefon:</b> Telefonun pusulası ve Organic Maps internet olmadan çalışır; konumu GPS uydusundan alır. Araç › <a href='#/tools/compass'>Pusula</a>. Pusulayı metal eşyadan ve arabadan uzakta kullan.",
 "<b>Güneş:</b> Sabah doğuda, akşam batıda, öğlen güneydedir. Güneş tam güneydeyken gölgen kuzeyi gösterir⟦il:; {IL} için bu saat yaklaşık {OGLE}⟧⟦!il: (saat ile göre değişir; ilini seçersen burada görürsün)⟧. Daha kesin yön için 15 dakikalık <a href='#/g/gunes'>gölge çubuğu</a> yöntemini kullan.",
 "<b>Uydu çanakları:</b> Türkiye'deki çanak antenlerin çoğu Türksat uydusuna, yani <b>{CANAK}</b> bakar. Kentte ve köyde en hızlı yoldur: birkaç çanağın aynı yöne baktığını gör.",
 "<b>Cami:</b> Mihrap kıbleye bakar. ⟦il:{IL} için kıble {KIBLE} düşer⟧⟦!il:Türkiye'de kıble {KIBLE} düşer⟧. Caminin ana kapısı çoğunlukla mihrabın karşısında, yani kuzey tarafındadır.",
 "<b>Gece:</b> Kutup Yıldızı her zaman kuzeydedir. Büyükayı'nın kepçesinden bul: <a href='#/g/gunes'>Güneş, saat ve yıldızla yön</a>."])+
 cd("warn","<u>Yosuna, ağaç halkalarına, karınca yuvasına güvenme</u>: bu \"doğa işaretleri\" yanıltır. En kolay yol, cebinde küçük bir düğme pusula taşımaktır.")},
{id:"dere",cat:"nav",ic:"wave",t:"Dere & nehir geçişi",d:"Nereden, nasıl, düşersen",h:
 cd("warn","<u>Köpüklü, taşkın ya da bulanık, hızlı akan suya girme.</u> Önce akıntının yukarısında ve aşağısında köprü ara. Soğuk suya birden girmek ilk dakikada nefesini keser: boğulmaların yaklaşık üçte ikisi kıyıya 3 m mesafede olur.")+
 "<h2>Yer seçimi</h2><ul><li>Genelde akıntının yukarısı daha sığdır. <u>Kıvrımların dış tarafından geçme</u>: su orada hızlı ve derindir.</li><li>Dal ve kütük yığınlarının <b>aşağısından</b> geç: suyun içindeki dal yığını insanı sıkıştırıp su altında tutar.</li><li>Girdiğin ve çıkacağın kıyı alçak olsun. Sakin görünen yüzeyin altında hızlı akıntı olabilir.</li><li>Soğukta karşı kıyıda giyeceğin kuru giysiyi ve <b>kuru ateş malzemesini</b> hazır tut.</li></ul>"+
 "<h2>Geçiş</h2>"+st(["<u>Ayakkabını çıkarma</u> (kaygan taş, cam kırığı). Pantolonunu çıkar: suda daha az sürüklenirsin, pantolon da kuru kalır.","Çantanın bel kemerini aç ve çantayı <b>tek omuz askısıyla</b> taşı: gerekirse hemen bırakabilirsin.","Tek başınaysan yüzünü akıntının geldiği yöne dön, çapraz ilerle, sopayı üçüncü bacak olarak kullan; her an iki dayanak noktan yerde olsun.","Grupsanız kollarınızı kenetleyip halka ya da sıra olun; en güçlü kişi akıntının yukarı tarafında dursun; kısa adımlarla ilerleyin.","İpi yalnızca son çare olarak kullan: dolanır ve insanı suyun altına çeker. Kullanacaksan ipi iki kıyıdaki ağaçlara sabit bir emniyet ipi olarak ger."],true)+
 "<h2>Akıntıya kapılırsan</h2><p>Sırtüstü dön; <b>ayakların önde ve su yüzeyinde</b> olsun. Ellerinle yön ver, kıyıya çapraz yüz. Yalnızca sığ ve yavaş suda ayağa kalk: hızlı suda ayağın taşlara sıkışabilir. Paçalarını bağlayıp içine hava doldurduğun pantolon şamandıra olur.</p>"+
 cd("info","Su yutan herkesi 24–72 saat izle. Öksürük, nefes darlığı ya da köpüklü balgam başlarsa ikincil boğulma (sudan çıktıktan sonra gelişen akciğer sorunu) riski vardır: kişiyi hemen hastaneye götür."),src:"DK Survival Handbook"},

/* ---------- AFET ---------- */
{id:"yildirim",cat:"afet",ic:"flash",t:"Yıldırım",d:"Fırtına belirtileri, nereye sığınılır",h:
 "<h2>Fırtına yaklaşıyor: belirtiler</h2><ul><li>Öğleden sonra hızla kabarıp kuleleşen bulutlar; tepesi örs gibi yayılan koyu, dev bulut (kümülonimbüs, fotoğrafta).</li><li>Gökyüzü birden kararır, hava serinler, ani ve sert rüzgâr başlar.</li><li><b>Gök gürültüsü duyuyorsan yıldırımın erişebileceği yerdesin</b> (~15 km). Yağmuru beklemeden sığın.</li><li>Pilli radyoda (özellikle AM/OD bantta) çatırtı artar.</li></ul>"+
 cd("warn","<b>Yıldırım düşmek üzere:</b> saçların diken diken oluyor, tenin karıncalanıyor, metal eşyadan ya da kayalardan vızıltı, çıtırtı sesi geliyorsa hemen aşağıdaki çömelme duruşuna geç.")+
 "<h2>Ne yap</h2>"+st(["Şimşekle gök gürültüsü arasındaki saniyeyi say: <b>30 saniyeden azsa</b> hemen sığın.","En iyi sığınak sağlam bir bina, sonra kapıları ve camları kapalı bir arabadır (metale dokunma). Çadır, kulübe, ağaç altı korumaz.","Tepe, sırt ve açık düzlükten in. Sudan çık (göl, deniz, baraj). <u>Tek başına duran ağacın altına girme</u>: akım ağacın dibinden toprağa yayılır.","Metal yürüyüş sopasını, şemsiyeyi, oltayı bırak; tel çit ve direklerden uzaklaş.","Açıkta kaldıysan son çare olarak <b>çömel: ayaklar bitişik, topuklar kalkık, eller dizlerde, baş eğik</b>. <u>Yere uzanma, ayakta durma.</u>","Grup 5–10 m arayla dağılsın: biri çarpılırsa diğerleri yardım eder.","Son gök gürültüsünden sonra <b>30 dakika</b> bekle, sonra sığınaktan çık."],true)+
 cd("info","Fırtına sürüyorsa önce kendini koru. Yıldırım çarpan kişiye dokunmak güvenlidir: nefes almıyorsa hemen <a href='#/g/kpr'>KPR</a>'ye başla."),src:"DK Survival Handbook; ABD Ulusal Hava Servisi (NWS) yıldırım güvenliği"},

{id:"hava",cat:"doga",ic:"sun",t:"Hava belirtileri",d:"Bulut, rüzgâr, doğa işaretleri",h:
 '<div class="tw"><table><tr><th>Gördüğün</th><th>Anlamı</th></tr>'+
 [["Şeklini koruyan pamuk bulutlar","İyi hava"],["Yüksekte inceden kalınlaşan bulut örtüsü","Sıcak cephe: birkaç saat içinde yağmur"],["Kale burcu gibi orta bulutlar","Gök gürültülü fırtına olası"],["Örs başlı dev bulut","Fırtına, sağanak, dolu, yıldırım"],["Alçak gri tabaka","Uzun çisenti veya kar"],["Sabah kızıl gökyüzü","Nem, olası fırtına"],["Akşam kızıl gökyüzü","Genelde açık hava"],["Kuru sabit rüzgâr yön değiştirir veya durur","Yağmur yaklaşıyor"],["Çam kozalakları kapanıyor","Nem artıyor"],["Hayvanlar alçaklara iniyor, inekler yatıyor","Fırtına öncesi"]].map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'}).join("")+'</table></div>'+
 "<ul><li>Hava her 300 m yükseklikte ~2 °C soğur: yüksekteki yaylalar ve dağ köyleri kentten soğuktur⟦06: (Ankara'da Çamlıdere ilçesi gibi)⟧.</li><li>Açık, rüzgârsız gecelerde soğuk hava yamaçtan vadiye akar: vadi tabanı gecenin en soğuk yeridir.</li><li>Sis: önünü göremiyorsan dur.</li></ul>",src:"DK Survival Handbook"},

/* ---------- ALET, KAMP, HAREKET ---------- */
{id:"bicak",cat:"alet",ic:"tool",t:"Bıçak & alet güvenliği",d:"Kesme, bileme, odun yarma",h:
 "<ul><li><u><b>Düşen bıçağı asla tutmaya çalışma.</b></u> Bıçağı birine verirken kabzası önde, ağzı yukarıda uzat.</li><li>Keserken bıçağın ağzı senden uzağa baksın; kestiğin şey seninle bıçak arasında olsun. Bıçağın kabzaya yakın kısmıyla çalış.</li><li><b>Seçim:</b> Çeliği sapın sonuna kadar uzanan (tam saplı), yaklaşık 4 mm kalınlıkta, 10–20 cm ağızlı, tırtıksız, karbon çelik bir bıçak seç: sahada bilenir, çakmaktaşından kıvılcım çıkarır. <u>Katlanır bıçakla odun yarma.</u></li><li><b>Bileme:</b> Bıçağın ağzını taşa yatır, sırtını hafifçe kaldır, ağzın tamamını yay çizerek taşın üstünden geçir; her yüze 6–8 kez sür.</li><li><b>Bıçakla odun yarma:</b> Bıçağı kütüğün ucuna koy, yaklaşık 45 cm'lik bir sopayla bıçağın sırtına vurarak kütüğü yar, sonra parçaları dörde böl.</li><li><b>Aletsiz dal kırma:</b> Kuru dalı birbirine yakın iki ağacın arasına sok ve <b>kendine doğru çekerek</b> kır. <u>Dalı ayağınla kırma</u>: ayağın yaralanırsa yürüyemezsin.</li><li><b>Kesim alanı:</b> Altlık olarak bir kütük kullan. Çevren, kimsenin geçmediği ve aleti rahatça sallayabileceğin kadar açık olsun. Bıçağı kullandıktan sonra temizle, kurula, kınına koy.</li></ul>"+
 cd("info","<b>Yasal not:</b> 6136 sayılı Ateşli Silahlar ve Bıçaklar ile Diğer Aletler Hakkında Kanun, bazı bıçakların kamuya açık yerlerde taşınmasını kısıtlar. Kentte sabit ağızlı (katlanmayan) bıçağı belinde değil, çantanda taşı."),src:"DK Survival Handbook; Lundin"},
{id:"kamp",cat:"alet",ic:"tent",t:"Kamp düzeni & karanlığa geri sayım",d:"Kararmadan 3 saat önce",h:
 "<h2>Karanlığa 3 saat kala</h2>"+st(["Su iç, ıslak giysini değiştir (her zaman bir kuru takım sakla).","Yeri incele: akıntının yukarısında ölü hayvan, başının üstünde kuru dal var mı, bak.","Barınağı ve yatağı hazırla.","Kav, çıra ve yakıt topla; ateş yerini ve ısıyı yansıtacak duvarı hazırla.","Su topla ve arıt.","Açık alanda işaret araçlarını ve üç işaret ateşini hazırla."])+
 "<h2>Karanlığa 1 saat kala</h2>"+st(["Yıkan, tuvaletini yap.","Ekipmanı kontrol et: herkes acil çantanın, fenerin, düdüğün yerini bilsin; kimin işaret ateşini yakacağı belli.","Nöbet sırasını belirle."])+
 "<h2>Alanlar</h2><ul><li>Eşya, odun (dik ve kuru istiflenmiş), mutfak, uyku ve kesim için ayrı alanlar ayır.</li><li>Yiyeceği <b>yerden 3 m yükseğe, ağaç gövdesinden 1 m</b> uzağa as.</li><li>Birkaç gün kalacaksanız tuvalet hendeğini rüzgâr altında, eğimin ve akıntının aşağısında kaz; ayrılırken hendeği kapat ve üstünü çapraz dallarla işaretle.</li></ul>",src:"DK Survival Handbook"},
{id:"cikis",cat:"kent",ic:"doc",t:"Çıkış planı (5-K)",d:"Her yürüyüş ve tatbikat öncesi",h:
 "<p>Ekip yürüyüşlerinde ve tatbikatlarda en olası acil durum, birinin dönmemesidir. Aramaların çoğu ilk 12 saatte sonuçlanır; 72 saatten sonra bulma şansı çok düşer. Nereye gittiğini kimse bilmiyorsa seni kimse aramaz. Yola çıkmadan önce şu beş sorunun yanıtını yazıp bırak:</p>"+
 st(["<b>Nereye:</b> Rotayı işaretlediğin bir harita kopyası ve yazılı bir liste bırak: günlük duraklar ve buluşma noktaları.","<b>Ne zaman:</b> Dönüş saatini yaz, üstüne 3–6 saat pay ekle. Bu süre dolunca irtibat kişisi <b>hemen</b> 112'yi arasın.","<b>Ne ile:</b> Aracın markasını, rengini, plakasını ve nereye park edildiğini yaz.","<b>Kim:</b> Herkesin tam adını, deneyimini, giysi renklerini, sağlık durumunu ve kullandığı ilaçları yaz.","<b>Neden:</b> Etkinliğin türünü yaz (yürüyüş, kamp, tatbikat)."])+
 cd("tip","Planı <b>iki</b> güvenilir kişiye ver; dönünce onlara haber ver. <u>Dönüş saatini araçta görünür bir yerde bırakma.</u> Herkes yumuşak zemine serilmiş kalın bir folyonun üstüne basarak ayakkabısının izini çıkarsın ve folyoya adını yazsın; folyoları gösterge paneline bırakın: arayanlar izleri tanır."),src:"Lundin, 98.6 Degrees; DK Survival Handbook"}
]);

{id:"kisa",ic:"sos",t:"Kısa süreli plan: 0–72 saat",d:"Deprem, sel, kesinti ya da kargaşada ilk 3 gün",h:
 '<h2>İlk 10 dakika</h2>'+st(["Kendini koru: içerideysen Çök-Kapan-Tutun yap, dışarıdaysan açık alana geç.","Yaralı var mı, bak. Önce hayati kanamayı ve nefesi kontrol et.","Hasar varsa doğalgaz ve su ana vanasını kapat, elektrik şalterini indir.","Ayakkabı giy (yerde cam olabilir), kafa lambanı ve çantanı al."],true)+
 '<h2>İlk 1 saat</h2>'+st(["Ekibe SMS at: \"İYİYİM\" ya da \"YARDIM\" yaz, konumunu ekle (Ekip ekranındaki hazır mesajlar). <u>Sesli arama yapma</u>: hatları tıkar.","Bina hasarlıysa toplanma alanına (RP1: mahalledeki ilk buluşma noktası) git. Sağlamsa içeride kal ve hasarı kontrol et.","Radyoyu aç (TRT ya da yerel radyo), resmî duyuruları dinle.","Telefonu Maksimum güç tasarrufuna al."])+
 '<h2>İlk 24 saat</h2>'+st(["Su: musluk akıyorsa her kabı doldur. Akmıyorsa evdeki gizli suyu topla (termosifon, klozet rezervuarı).","Durumu öğren: kim nerede, kimin neyi eksik? Ekip listesinden tek tek yoklama yap.","Komşularınla, özellikle yaşlı, engelli ve çocuklu ailelerle görüş. Ateşi, suyu ve nöbeti birlikte düzenleyin.","Kararını ver: evde kal, RP2'ye (mahalle dışındaki ortak buluşma noktası) git ya da şehirden çıkıp RP3'e git (bkz. Kal mı, git mi?)."])+
 '<h2>24–72 saat</h2>'+st(["Günlük bir düzen kur: yoklama ve yemek saatleri, nöbet, temizlik belli olsun.","Resmî yardım noktalarını (AFAD ve Kızılay çadırları) öğren; bilgiyi ve suyu oradan al.","Stoğu say: kaç gün yeter? Önceden yazdığınız tetikleyicilere (harekete geçme kurallarına) bak.","Uyku düzeni kur: nöbeti ikişer kişi tutsun, diğerleri uyusun."])},
{id:"orta",ic:"home",t:"Orta süreli plan: 3–14 gün",d:"Evde barınma, kaynak yönetimi",h:
 "<ul><li><b>Su:</b> Her gün ne kadar su kullandığınızı ölç ve yaz. Kişi başı günde 4 L hedefle: 3 L içmek, 1 L temizlik için. Yağmur suyu toplamak için bir düzenek kur.</li>"+
 "<li><b>Gıda:</b> Elektrik yoksa ilk 1–2 gün buzdolabındaki bozulacak yiyecekleri ye, sonra dondurucudakileri, en son kuru stoğu. Günde 2 sıcak öğün morali yükseltir.</li>"+
 "<li><b>Tuvalet ve hijyen:</b> Sifon çalışmıyorsa klozete poşet geçir, içine kedi kumu ya da talaş koy. Poşetin ağzını bağla, dışarıda kapalı bir varilde biriktir. El yıkamak ishal salgınını önler: su kıt olsa bile en son kısacağın şey el yıkamak olsun.</li>"+
 "<li><b>Enerji:</b> Telefonları sırayla açın: aynı anda yalnızca 1–2 telefon açık kalsın, diğerleri uçak modunda dursun. Güneş panelini gündüz sürekli şarjda tut.</li>"+
 "<li><b>Güvenlik:</b> Geceleri ışık dışarıdan görünmesin diye perdeleri kapat. <u>Stoğunu kimseye gösterme.</u> Kapıda nöbet tutun; komşularla birlikte mahallede düzen kurun.</li>"+
 "<li><b>Bilgi:</b> Radyoyu günde 2 kez, sabah ve akşam dinle. Ekiple günde 1 kez telsizle ya da SMS ile yoklama yapın.</li></ul>"+
 cd("tip","Sağlıklı rutin: sabah 20 dk hafif hareket (esneme, yürüyüş), akşam nefes çalışması. Bedeni sıcak tutar, moral ve uykuyu düzeltir.")},
{id:"uzun",ic:"leaf",t:"Uzun süreli plan: 2 haftadan uzun",d:"Aylar sürebilecek düzensizlik",h:
 "<p>Uzun krizlerde (savaş, ağır ekonomik çöküş, altyapının uzun süre çökmesi) kişisel stok biter. Saraybosna (1992–96), Lübnan ve Venezuela'da yaşananlar şunu gösteriyor: uzun dönemde hayatta kalmayı <b>topluluk, beceri ve takas</b> belirler.</p>"+
 "<h2>1. Topluluk</h2><ul><li>Ekibinle (en fazla 10 kişi) birlikte, güvendiğin komşulardan oluşan bir ağ kur. Tek başına kalan bir aile çok savunmasızdır.</li><li>Kimin hangi beceriyi bildiğini listele: sağlıkçı, tamirci, elektrikçi, aşçı, bahçıvan, öğretmen.</li><li>Su taşıma, odun, nöbet, çocuk bakımı ve ders gibi işleri ortak yapın.</li></ul>"+
 "<h2>2. Kaynak</h2><ul><li>Su: kalıcı bir kaynak (kuyu, pınar, yağmur suyu) ve kalıcı bir arıtma yolu bul (su kendi ağırlığıyla süzülen asma filtre, kaynatmak için yakıt).</li><li>Gıda: kuru bakliyat ve tohum (yerel, ata tohumu) biriktir; saksıda ya da balkonda sebze yetiştir; takas için bir köyle bağlantı kur.</li><li>Isınma: soba ve odun ya da kömür bul; tek odada yaşayın.</li><li>Sağlık: doktorunla konuşup kronik ilaçlardan 3 aylık stok yap; diş bakımına ve temizliğe dikkat et.</li></ul>"+
 "<h2>3. Takas ve değer</h2><ul><li>En çok aranan şeyler: ilaç, pil, çakmak, tuz, şeker, kahve, çay, sigara, alkol, tohum ve beceri (tamir, dikiş, sağlık).</li><li><u>Gücünü belli etme</u>; takası az ve sessizce yap.</li></ul>"+
 "<h2>4. Köye/kırsala geçiş</h2><ul><li>Şehir dışında bir tanıdığının ya da akrabanın köyünü önceden belirle; bu köy RP3 (şehir dışı buluşma noktası) ya da daha ötesi olabilir. <u>Eli boş gitme</u>; işe yarar bir beceri ve malzeme götür.</li><li>Köyde iş çoktur: su, odun, tarla, hayvan. Saygı göster ve katkı sağla: misafir gibi değil, çalışan biri gibi davran.</li></ul>",
 src:"Saraybosna kuşatması tanıklıkları; FEMA; Wiseman"},

 '<tr><td><b>E</b><br><small>Son çare</small></td><td>Buluşma noktası ve not bırakma</td><td>Hiçbir şey çalışmazsa olaydan sonra <b>RP1</b>\'e (mahalledeki toplanma alanı) git, 2 saat bekle, not bırak, <b>RP2</b>\'ye (mahalle dışındaki ortak nokta) geç. Olaydan sonraki <b>6. ve 24. saatte</b> herkes RP2\'de hazır bulunur.</td></tr></table></div>'+

 "⟦06:"+"<ul><li>Kent merkezinin altından aktif fay geçmez; ama 60–100 km uzakta büyük fay zonları vardır: kuzeyde <b>Kuzey Anadolu Fayı</b> (7,5 ve üstü büyüklükte deprem üretebilir), güneyde Tuz Gölü, doğuda Kırıkkale–Erbaa, batıda Eskişehir fay zonu.</li><li>İl içindeki yerel aktif faylar: Elmadağ, Sarıoba–Ayaş, Kazan, Bala, Çeltikçi.</li><li>2019 deprem tehlike haritasında Ankara için beklenen yer ivmesi, 1996 haritasına göre ~%50 arttı. Kent merkezinin yarıdan fazlası, sarsıntıyı büyüten zayıf zemin üzerindedir.</li><li>Son depremler: Bala (2005, 2007; büyüklük 5,5–5,7), Akyurt (2020), Kalecik (2021).</li></ul>"+"⟧"+

{id:"analiz",cat:"temel",ic:"brain",t:"Plan eleştirisi: uzmanlar ne diyor?",d:"Bu planın zayıf noktaları ve düzeltmeler",h:
 cd("warn","<b>Kısa hüküm:</b> Bu büyüklükte bir grubun ilk planı <b>evde kalmak</b> olmalı: stoklu bir ev, örgütlü bir komşuluk ve gerektiğinde önceden anlaşılmış bir ev sahibine <b>araçla</b> tahliye. Alanda en güvenilir uygulayıcılar ve gerçek afet kayıtları \"ormana yürüme\" planına karşı çıkıyor.")+
 "<h2>Gerçek olaylar ne gösteriyor?</h2><ul>"+
 "<li><b>Bosna (Selco):</b> Kuşatılmış bir şehirde bir yıl yaşayan Selco'ya göre insanları kurtaran şey güçlü bir topluluktu; sessizce öldürenler ise hijyen eksikliği, ilaçsızlık, kötü beslenme ve stresti.</li>"+
 "<li><b>Arjantin 2001 (FerFAL):</b> Tek başına, yalıtılmış yaşayanlar en kolay hedef oldu. FerFAL'ın kendisi sonunda yürüyerek değil, planlı biçimde ülke değiştirdi.</li>"+
 "<li><b>Ukrayna 2022:</b> Erken gidenler arkadaşlarının ve akrabalarının yanına gitti; kimse ormanı hedef seçmedi. Yakıt kuyrukları ve yol tıkanıklığı ilk günlerde başladı.</li>"+
 "<li><b>Rita Kasırgası 2005:</b> Tahliye trafiği fırtınanın kendisinden daha çok insan öldürdü: herkesle aynı anda yola çıkmak başlı başına bir afettir.</li>"+
 "<li><b>6 Şubat 2023:</b> Baz istasyonlarının çoğu günlerce çalışmadı; ATM ve kartla ödeme sistemleri çöktü; yakıt, tuvalet ve ısınma büyük sorun oldu; ilk 72 saatte insanlar kendi başınaydı. 2025 İstanbul ve Balıkesir depremlerinde de şebekeler yine kilitlendi.</li></ul>"+
 "⟦06:<h2>Ankara'nın gerçek risk sırası</h2>⟧⟦!06:<h2>Büyük bir kentte gerçek risk sırası (Ankara örneği)</h2>⟧<ol><li><b>Uzun su kesintisi</b>: 2007'de ve 2025–26 kuraklığında yaşandı (barajların doluluğu Ocak 2026'da %1 civarına indi).</li><li><b>Kışın doğalgaz ya da elektrik kesintisi</b>.</li><li><b>Binana zarar veren orta büyüklükte bir deprem</b> ve başka şehirlerden gelecek göç.</li><li>Ani sel (alt geçit, bodrum).</li><li>Çatışma ya da siyasi şiddet: olasılığı düşük, etkisi yüksek. Tahliyenin gerçekten gerektiği senaryo budur.</li></ol><p>Bunların neredeyse hiçbiri ormana yürümeyi gerektirmez.</p>"+
 "<h2>Ormana yürüme planının sayıları</h2><ul><li>Kuş uçuşu 60–70 km uzaktaki bir hedef, yol üzerinden 85–100 km eder. İçinde çocuk ve yaşlı olan bir aile grubu günde <b>5–8 km</b> yürüyebilir: yol <b>5 gün değil, 11–20 gün</b> sürer.</li><li>3 kişilik bir aile için bile günde yaklaşık 10 kg içme suyu gerekir; bu kadar suyu günlerce taşıyamazsın. Rotadaki su kaynaklarını önceden gidip yerinde görmüş olmalısın.</li><li>Birçok ilde valilikler yazın ormana girmeyi ve orman kenarında ateş yakmayı <b>yasaklar</b>⟦06: (Ankara 2026: 22 Mayıs–15 Ekim)⟧; ilinin valilik duyurusuna bak.⟦06: Kışın Kızılcahamam'da ocak ayı ortalaması −4,5 °C'dir.⟧</li>⟦06:<li>Kuzeybatı rotası Akıncı (Mürted) üssünün ve TUSAŞ'ın (Türk Havacılık ve Uzay Sanayii) yakınından geçer, Kuzey Anadolu Fayı'na doğru gider.</li>⟧</ul>"+
 "<h2>Bu derslerden uygulamaya girenler</h2><ul><li>Tahliye planına <b>Plan 0: araçla, önceden anlaşılmış ev sahibine</b> eklendi; yürüyüş planları yedek oldu ve süreleri düzeltildi.</li><li><b>Erken ayrılma tetikleyicileri</b>, su kesintisi senaryosu ve yasal notlar eklendi.</li><li>İletişim planı, şebekenin günlerce çalışmayabileceğine göre düzeltildi; buluşma noktalarına (RP1, RP2) sabit saatler eklendi.</li><li>Ortak buluşma binası (RP2) depremden sonra kontrol edilmeden toplanma yeri değildir notu.</li><li>Telefon kriz modu, yedek donanım listesi ve yazdırılabilir cep kartı eklendi.</li></ul>"+
 "<h2>Ekibin yapması gereken 15 şey</h2><ol>"+

eke \"yok\" iletişim tatbikatı; bir kış gecesi dışarıda.","<b>Mahremiyet</b>: <u>Buluşma noktalarını, rotaları ve stok listesini internette ve sosyal medyada paylaşma.</u>"].map(function(x){return "<li>"+x+"</li>"}).join("")+"</ol>",

set("kpr",{t:"Kalp masajı (KPR)",d:"Bilinç yok, normal nefes yok",h:
 cd("warn","Kişi bilinçsizse ve normal nefes almıyorsa <b>her dakika önemlidir</b>. Emin değilsen başla: gereksiz KPR'nin zararı, geç başlanan KPR'nin zararından çok küçüktür.")+
 '<a class="btn red full" href="#/tools/kpr" style="margin:8px 0">Sesli KPR koçu (ritim ve sesli komut)</a>'+
 I("i_kpr",[
 [0,"<b>Seslen:</b> Ortam güvenliyse omuzlarına <b>hafifçe dokun</b>, yüksek sesle \"İyi misiniz?\" de."],
 [null,"<b>Yanıt yoksa bağır:</b> \"Yardım! Sen "+CALL+"'yi ara, sen şok cihazı (OED) getir.\" Yalnızsan 112'yi kendin ara; telefonu hoparlöre alıp yanına koy."],
 [1,"<b>Hava yolunu aç, nefese bak:</b> Kişiyi sert bir zemine sırtüstü yatır. Bir elinle alnından bastırıp başını geriye it, öbür elinin iki parmağıyla çenesini kaldır (baş geri–çene yukarı). Ağzında <b>görünen</b> katı bir cisim varsa parmakla al; alabileceğinden emin değilsen <u>cisme dokunma, onu boğaza doğru itme</u>. <b>En fazla 10 saniye</b> göğsüne bak, nefesini dinle. Seyrek, hıçkırık gibi nefes, <b>nefes yok</b> demektir."],
 [2,"<b>30 kez bas:</b> Avuç kökünü göğsün ortasına (göğüs kemiğinin alt yarısına) koy, öbür elini üstüne koy. Kollarını kilitle; omuzların ellerinin tam üstünde olsun. <b>5–6 cm</b> derinliğe, dakikada <b>100–120</b> hızla bas. Her basıdan sonra göğüs tamamen geri gelsin. Basıya verdiğin ara <b>10 saniyeyi</b> geçmesin."],
 [3,"<b>2 nefes ver:</b> Burnunu sık, ağzını kendi ağzınla tamamen kapat, 1 saniye boyunca üfle; göğsü <b>gözle görülür</b> biçimde kalksın. Havanın geri çıkmasını bekle, ikinci nefesi ver. Nefes veremiyorsan ya da vermek istemiyorsan nefesi atla, <b>yalnızca basıya</b> devam et."],
 [null,"<b>30 bası, 2 nefes diye devam et.</b> İki kişiyseniz <b>2 dakikada bir (5 döngüde bir)</b> basan kişi değişsin: yorulan kişi yeterince derin basamaz. Değişirken bir an bak: normal nefes var mı?"],[null,"<b>Şok cihazı (OED) gelince:</b> cihazı aç, sesli komutlara uy. Kişinin göğsünü aç; göğüs ıslaksa kurula, ilaç bandı varsa çıkar; kişi ıslak ya da metal zemindeyse onu kuru zemine al. Pedleri yapıştır: birini <b>sağ köprücük kemiğinin altına</b>, ötekini <b>sol meme başının yanına, alt kaburgaların üstüne</b>. Kalp pili varsa pedi pilden yaklaşık 2,5 cm uzağa koy. İki kişiyseniz biri pedleri yapıştırırken öteki basıya devam etsin. Cihaz analiz ederken ve şok verirken <u><b>kimse kişiye dokunmasın</b></u>: \"Herkes çekilsin!\" de. Şoktan sonra hemen basıya dön. <u>Cihazı kapatma, pedleri çıkarma.</u>"],
 [null,"<b>Ne zaman durursun?</b> Kişi uyanır, hareket eder, gözünü açar ya da normal nefes alırsa dur ve onu <a href='#/g/bilincsiz'>derlenme pozisyonuna</a> al. Sağlık ekibi işi devralırsa, ortam tehlikeli hâle gelirse ya da artık bastıramayacak kadar tükenirsen de durabilirsin."]],true)+
 cd("info","<b>Çocuk (1 yaş–ergenlik):</b> Sıra aynıdır. Tek ya da iki elle, göğüs kemiğinin alt yarısına <b>yaklaşık 5 cm</b> (ergende 5–6 cm) derinliğe, dakikada 100–120 hızla bas. Yalnızsan <b>30 bası, 2 nefes</b>; iki kişiyseniz <b>15 bası, 2 nefes</b> ver. Yalnızsan 112'yi hemen ara, telefonu hoparlöre al.")+cd("info","<b>Bebek (1 yaş altı):</b> Yanıt verip vermediğini ayak tabanına dokunarak, seslenerek ve gözleriyle seni izleyip izlemediğine bakarak kontrol et. Başını hafifçe geriye yatır, fazla bükme. Nefes verirken bebeğin <b>ağzını ve burnunu birlikte</b> kendi ağzınla kapat; göğsü hafifçe kalkacak kadar üfle. Yalnızsan <b>iki parmakla</b> bas; iki kişiyseniz göğsü iki elle sarıp <b>iki başparmakla</b> bas. Göğüs kemiğinin alt yarısına, göğüs kalınlığının üçte biri kadar (<b>yaklaşık 4 cm</b>) bas. Bası-nefes oranı çocuktaki gibidir: yalnızsan 30:2, iki kişiyseniz 15:2.")+cd("tip","<b>Çocukta şok cihazı (OED):</b> 1–8 yaşta çocuk pedi kullan; yoksa yetişkin pedini kullan. Pedler göğse sığmıyorsa birini göğsün ortasına, ötekini sırtına (kürek kemiklerinin arasına) yapıştır. <b>Suda boğulmada ve çocuklarda</b> nefes vermek özellikle önemlidir: yapabiliyorsan basıyı nefesle birlikte yap. <b>Vücudu aşırı soğumuş kişide (hipotermi)</b> KPR'yi uzun süre sürdür: soğuk, beyni bir süre korur. Vücudu ısıtılmadan kimse ölü kabul edilmez; sağlık ekibi gelene kadar devam et."),

set("kanama",{t:"Kanama (ağır, burun, kopan uzuv)",d:"Bastır · doldur · turnike · burun kanaması",h:
 cd("warn","Fışkıran ya da durmayan kanama <b>3–5 dakikada</b> öldürür. Önce kanamayı durdur, gerisi sonra gelir. Eldivenin yoksa eline poşet geçir. Birine bağır: \"112'yi ara!\"")+
 I("i_bld",[
 [0,"<b>Doğrudan bastır:</b> Bezi ya da gazlı bezi yaraya koy; avuç kökünle ve <b>tüm vücut ağırlığınla</b> en az <b>5 dakika kesintisiz</b> bas. <u>Bezi kaldırıp yaraya bakma.</u> Kan bezden geçerse <u>ilk bezi çıkarma</u>, üstüne yenisini ekle."],
 [1,"<b>Derin yarayı doldur</b> (kasık, koltuk altı, boyun, kalça): Bezi parmaklarınla yaranın <b>içine</b> bastıra bastıra doldur. Yara dolunca üstünden en az <b>5 dakika</b> kesintisiz bastır. <u><b>Göğüs ve karın yarasını</b> bezle doldurma</u>; <u>boynu çepeçevre sıkıca sarma</u>."],
 [3,"<b>Bastırmak yetmiyorsa basınçlı sargı yap:</b> Kalın bir pedi yaraya koy, sıkıca ama kan dolaşımını kesmeden sar. Kanama durduysa sargıyı yerinde bırak. Parmak uçlarının rengini ve hissini kontrol et. Kan sargıdan geçiyorsa üstüne bir kat daha sar ve bastırmaya devam et."],
 [2,"<b>Turnike tak:</b> Kol ya da bacaktaki kanama <b>bastırmaya ve sargıya rağmen</b> sürüyorsa, uzuv kopmuşsa, hayatı tehdit eden fışkıran bir kanama varsa ya da çok yaralı olduğu için başında kalamayacaksan turnike tak. Turnikeyi <b>üst kola ya da uyluğa</b>, yaranın üstünde (kalbe yakın tarafta) en yakın sağlam deriye tak; <u>eklemin üstüne takma</u>. Yara ön kolda ya da baldırda olsa bile turnikeyi üst kola ya da uyluğa tak (uzuv kopmuşsa kopan yerin hemen üstüne). Çubuğu kanama <b>durana kadar</b> çevir. Kanama durunca <u>daha fazla sıkma</u>, çubuğu kilitle. <u>Turnikenin üstünü örtme.</u> Turnikeye ya da yaralının alnına saati yaz (ör. <b>\"T 14:25\"</b>). <u><b>Turnikeyi gevşetme, çıkarma</b></u>; bunu sağlık ekibine bırak."],

 [null,"<b>Şoku önle</b> (→ <a href='#/g/sok'>Şok</a>): Yaralıyı sırtüstü yatır, yerden yalıt, üstünü ört. <u>Ağızdan bir şey verme, yaralıyı yalnız bırakma.</u> Turnikeli yaralı en geç <b>2 saat</b> içinde hastaneye ulaşmalı; tahliyede ona öncelik ver."]],true)+
 cd("tip","<b>Turnike yoksa</b> <b>5–10 cm</b> genişliğinde, esnemeyen bir bez (üçgen sargı, eşarp) ve sağlam bir çubukla turnike yap. <u>İp, tel ya da ince kemer kullanma</u>: deriyi keser, damarı kapatmaz. Turnikeyi mümkünse ilk yardım eğitimi almış biri uygulasın. <b>Yarada batmış bir cisim varsa</b> <u>cismi çıkarma</u>; iki yanından bastır, çevresini rulo yapılmış bezle destekle ve üstünden sar.")+
 "<h2>Kopan uzuv</h2>"+H.st(["Önce kanamayı durdur: bastır, gerekirse turnike tak.","<u>Yarı kopmuş uzvun bağlantısını <b>kesme</b></u>; uzvu olduğu gibi destekleyip sar. <u>Tamamen kopan parçayı <b>yıkama</b>.</u> Parçayı kuru, temiz bir bezle sar, poşete koy, poşetin ağzını kapat.","Bu poşeti <b>1 ölçek su ve 2 ölçek buz</b> olan ikinci bir poşete ya da kaba koy; buz parçaya doğrudan değmesin.","Poşetin üstüne yaralının adını ve saati yaz. Parçayı yaralıyla birlikte en geç <b>6 saat</b> içinde hastaneye ulaştır."],true)+"<h2>Burun kanaması</h2>"+H.st(["Kişiyi oturt, başını <b>hafifçe öne</b> eğdir. <u>Başını geriye yatırma</u>: kan mideye kaçar, kusturur. Ağzından nefes alsın, kanı yutmasın.","Burnun yumuşak kısmını (kanatlarını) iki parmakla <b>10–15 dakika kesintisiz</b> sık; <u>arada bırakıp bakma</u>.","Kanama <b>20 dakikada</b> durmazsa, çok fazlaysa ya da kişi kan sulandırıcı ilaç kullanıyorsa 112'yi ara.","Kafa darbesinden sonra burundan ya da kulaktan berrak sıvı veya kan geliyorsa <u>burnu ve kulağı <b>tıkama</b></u> → <a href='#/g/kafa'>Kafa ve omurga</a>.","Kanama durduktan sonra birkaç saat <u>kişi burnunu sümkürmesin, karıştırmasın, ağır bir şey kaldırmasın</u>."],true)+cd("warn","<b>İç kanamadan şüphelen:</b> kişi karnına ya da göğsüne darbe aldıysa, kusmukta veya dışkıda kan varsa ya da dışarıda kanama yokken şok belirtileri görüyorsan. Kişiyi sırtüstü yatır, üstünü ört, <u><b>ağızdan hiçbir şey verme</b></u>, 112'yi ara. Bilincini ve nefesini <b>2–3 dakikada bir</b> kontrol et. Kusarsa ya da ağzından kan gelirse yan çevir. Kan öksürüyorsa ve omurga yaralanması şüphesi yoksa yarı oturt.")+cd("info","<u>Turnike <b>gevşetilmez</b>.</u> Sağlık Bakanlığı'nın güncel ilk yardım rehberi, Avrupa Resüsitasyon Konseyi (ERC) ve askerî sahada yaralı bakımı kılavuzu (TCCC) aynı şeyi söyler. Eski kitaplardaki \"15–20 dakikada bir gevşet\" kuralı kaldırıldı. Kanayan uzvu yukarı kaldırmak ve basınç noktasına bastırmak da artık önerilmiyor."),
 src:"T.C. Sağlık Bakanlığı İlk Yardım Uygulamaları Beceri Rehberi (MEB İSG 2025 eğitim notları); ERC 2021; TCCC; Stop the Bleed"});

 [0,"<b>Konuşamıyor ve nefes alamıyorsa:</b> Yanına geç, bir elinle göğsünden tutup öne eğ. Kürek kemiklerinin arasına avuç kökünle <b>5 kez sertçe vur</b>."],

 '<h2>Bebekte (1 yaş altı)</h2>'+I("i_chk",[[2,"Bebeği ön kolunun üstüne yüzüstü yatır; başı gövdesinden aşağıda olsun, çenesini parmaklarınla destekle. Kürek kemiklerinin arasına <b>5 kez vur</b>. Sonra sırtüstü çevir; iki meme başını birleştiren çizginin <b>bir parmak altına</b> 2 parmakla <b>5 kez bas</b>. Cisim çıkana kadar 5 vuruş ve 5 basıyı tekrarla. Bebek bilincini kaybederse 112'yi ara ve bebek KPR'sine başla (<a href='#/g/kpr'>KPR</a> sayfasında)."]],true)+

 I("i_rec",[
 [null,"<b>En fazla 10 saniye</b> nefesini kontrol et (<a href='#/g/kpr'>KPR</a> 3. adım). Normal nefes alıyorsa derlenme pozisyonuna al; almıyorsa KPR'ye başla."],

set("kirik",{t:"Kırık, çıkık, burkulma",d:"Bulduğun gibi sabitle",h:
 I("i_frx",[
 [null,"<b>112'yi ara.</b> Önce kanamayı durdur. Açık kırıkta <u>kemiği <b>içeri itme</b></u>; yarayı temiz bezle ört."],

 [null,"<b>10 dakikada bir</b> parmak uçlarının rengine, ısısına ve hissine bak. Parmaklar morarmışsa, soğumuşsa ya da uyuşmuşsa bağı gevşet."],
 [null,"Ağrı için sabitledikten sonra bezle sarılı soğuk uygulayabilirsin (en fazla 20 dk; buz deriye değmesin). <u>Ağızdan su dahil hiçbir şey verme</u> (ameliyat gerekebilir)."]])+cd("tip","<b>Yardım saatlerce gelemeyecekse</b> (dağda, büyük afette) ve kişinin bilinci tam açıksa, kusmuyorsa, karın yarası yoksa yudum yudum su ver; kişinin kendi doktorunun önerdiği ağrı kesiciyi kullanmasına izin ver.")+
 cd("info","<b>Çıkıkta</b> <u>eklemi yerine oturtmaya çalışma</u>; <u>buzu doğrudan deriye koyma</u>. Eklemi bulduğun pozisyonda destekle (omuz çıkığında kolla gövde arasına dürülmüş bir mont koy), sonra kolu askıya al. <b>Bacak kırığında</b> <u>bacakları kaldırma</u>; yaralıyı yalnızca sedyeyle taşı.")+
 "<h2>Burkulma</h2>"+H.st(["Eklemi dinlendir, yükünü al. Ağrıyan hareketi yaptırma.","Ayak bileği veya dizse altına destek koyup kalp seviyesinin biraz üstüne kaldır.","Elastik bandajla, parmak uçları pembe kalacak kadar sıkı sar.","<u>Masaj yapma, sıcak uygulama.</u>","Ağrı artıyorsa, basamıyorsa veya kırık olabileceğini düşünüyorsan sağlık kuruluşuna götür. Yürümek zorundaysan botu çıkarma, bağcığını sıkıca bağla."])+
 cd("info","<b>Buz şart mı?</b> Hayır. Sağlık Bakanlığı rehberi buzu bir seçenek olarak bırakır: ağrıyı azaltmak istersen bezle sarılı buzu <b>en fazla 20 dakika</b> uygulayabilirsin; <u>buzu doğrudan deriye koyma</u>. 2020'den beri spor hekimliği (PEACE & LOVE yaklaşımı) buzu iyileşmeyi yavaşlatabileceği için önermiyor; Avrupa Resüsitasyon Konseyi'nin 2025 ilk yardım kılavuzu da konuyu çıkardı. Kısacası buz yalnızca ağrı içindir, tedavi değildir. Birkaç gün sonra ağrı izin verdikçe eklemi yavaş yavaş kullanmaya başla.")+
 cd("warn","Boyun ya da sırt yaralanmasından şüpheleniyorsan <u>kişiyi <b>hareket ettirme</b></u> → <a href='#/g/kafa'>Kafa ve omurga</a>."),src:"T.C. Sağlık Bakanlığı İlk Yardım Uygulamaları Beceri Rehberi (MEB İSG 2025); ERC 2021"});

set("tasima",{t:"Yaralı taşıma ve sedye",d:"Tehlikeden çıkar, sedyeyle taşı",h:
 I("i_car",[
 [0,"<b>Tehlikeden hızla çıkar (koltuk altından sürükleme):</b> Yaralının arkasına geç. Kollarını onun koltuk altlarından geçir; onun kollarını göğsünün önünde çaprazla ve ön kollarını kavra. Başı senin göğsüne yaslı kalsın. Baş, boyun ve gövdesini aynı hizada tutarak geri geri çek."],
 [1,"<b>Doğaçlama sedye yap:</b> Yaralının boyundan yaklaşık 1 m uzun iki sağlam sırık bul. Sırıklara brandayı ya da battaniyeyi üç kat sar; ya da fermuarı kapalı, kolları içe çevrilmiş iki montu sırıklara geçir. Yaralıyı koymadan önce sedyeyi sağlam bir kişiyle dene."],
 [null,"<b>Sedyeye al:</b> Baş tarafındaki kişi başı tutar, komut verir ve sayar. Yaralıyı en az 6 noktadan kavrayın. Komut: \"Üçte çeviriyoruz: bir, iki, üç.\" Yaralıyı sağlam yanına çevirin, sedyeyi altına kaydırın, geri çevirip sedyeye bağlayın."],
 [null,"<b>Taşı:</b> Sedyeyi 4 kişi taşısın. Sedye yatay, yaralının <b>başı gidiş yönünde</b> olsun; komutu baş tarafındaki kişi versin. Sırtınızı dik tutup bacaklarınızın gücüyle, tek komutla kaldırın. 10 dakikada bir el değiştirin."]])+
 cd("warn","<b>Ne zaman taşınır?</b> Yaralıyı yalnızca zorunluysa taşı: yangın, patlama ya da çökme tehlikesi varsa, ortam güvenli hâle getirilemiyorsa veya 112 uzun süre gelemeyecekse. Bilinçsiz, bacak kırığı veya omurga şüphesi olan yaralıyı <b>yalnızca sedyeyle</b> taşı. Bilinci açık ama yürüyemeyen hafif yaralıyı iki kişi el koltuğuyla (aşağıda) ya da biri sırtında taşıyabilir.")+
 "<h2>İki kişilik el koltuğu</h2>"+(H.fig.koltuk||"")+H.st(["İki taşıyıcı yaralının arkasında, yüz yüze durur.","Her biri <b>sol eliyle kendi sağ bileğini</b> tutar.","Boşta kalan <b>sağ eliyle karşısındakinin sol bileğini</b> tutar. Dört el kare bir oturak olur.","Çömelin. Yaralı oturağa otursun, kollarını ikinizin omzuna atsın.","Sırtınızı dik tutup bacaklarınızla birlikte kalkın. Aynı anda, kısa adımlarla yürüyün."])+
 "<h2>Araçtan çıkarma (Rentek manevrası)</h2>"+cd("warn","<b>Yalnızca hayati tehlikede</b> uygula: yangın, patlama riski, nefesin durması ya da araçta ilk yardım yapılamaması. Bu durumlar yoksa yaralıyı araçta bırak, başını iki yandan tutarak sabitle ve 112'yi bekle.")+(H.fig.rentek||"")+H.st(["Kontağı kapat, el frenini çek, mümkünse tekerleğe takoz koy. Yanıtı kontrol et, 112'yi ara.","Yaralının ayaklarını pedallardan kurtar, emniyet kemerini aç.","Yaralının arkasına geç. Bir kolunu koltuk altından geçirip <b>çenesini</b> kavra, yanağını onun yanağına daya; böylece baş ve boyun oynamaz.","Öbür kolunu karşı koltuk altından geçir, yaralının göğsünün önündeki <b>ön kolunu</b> kavra.","Baş, boyun ve gövdeyi <b>aynı düzlemde</b> tutarak geri geri dışarı çek, güvenli yere sırtüstü yatır."],true),src:"T.C. Sağlık Bakanlığı İlk Yardım Uygulamaları Beceri Rehberi: acil taşıma teknikleri (MEB İSG 2025); DK Survival Handbook"});

set("sok",{h:
 "<p><b>Tanı:</b> Soluk, soğuk, terli cilt · hızlı zayıf nabız · hızlı yüzeysel nefes · susuzluk · huzursuzluk, sonra uyuşukluk.</p>"+
 I("i_shk",[[null,"<b>Nedeni ortadan kaldır</b> (önce kanamayı durdur), <b>112'yi ara</b>."],[0,"Kişiyi sırtüstü düz yatır, sıkan giysilerini gevşet. Bacaklarını <b>30–60° kaldır</b> (altına çanta ya da sandalye koy). Kalça, bacak, kafa ya da göğüs yaralanması, felç şüphesi, nefes güçlüğü veya kalp krizi şüphesi varsa ya da kaldırınca ağrı oluyorsa <u>bacakları <b>kaldırma</b></u>. Yerden yalıt, üstünü ört ama <u>kişiyi aşırı ısıtma</u>."],[null,"<u><b>Ağızdan hiçbir şey verme</b></u> (ameliyat gerekebilir); yalnızca dudaklarını ıslatabilirsin. Kusarsa yan çevir."],[null,"Göğüs yaralanması ya da nefes güçlüğü varsa ve omurga yaralanması şüphesi yoksa kişiyi <b>yarı oturur</b> pozisyonda tut."],[null,"Sakin konuş, <u>kişiyi yalnız bırakma</u>. <b>2–3 dakikada bir</b> nefesini ve bilincini kontrol et; durumu kötüleşirse 112'yi yeniden arayıp bildir. Bilincini kaybederse derlenme pozisyonuna al; normal nefes almıyorsa <a href='#/g/kpr'>KPR</a>'ye başla."]],true),src:"T.C. Sağlık Bakanlığı İlk Yardım Uygulamaları Beceri Rehberi (MEB İSG 2025); ERC 2021"});

set("kafa",{h:
 cd("warn","Kişi bilincini bir an bile kaybettiyse, tekrar tekrar kusuyorsa, baş ağrısı kötüleşiyorsa, kafası karışıksa (konfüzyon) ya da tuhaf davranıyorsa, göz bebekleri eşit değilse, burnundan veya kulağından berrak sıvı geliyorsa, nöbet geçiriyorsa ya da vücudunun bir yanında güçsüzlük varsa <b>onu hemen hastaneye ulaştır</b>.")+
 I("i_head",[[null,"Kişi yüksekten düştüyse, enkaz altında kaldıysa, trafik kazası geçirdiyse ya da sırtüstü sert düştüyse <b>omurga yaralanması var kabul et</b>. Ona \"Kıpırdama\" de."],
 [0,"Kişinin başının arkasına diz çök, dirseklerini dizlerine daya, <b>iki elinle başını iki yandan</b> tut; boynu düz kalsın. <u>Kulaklarını kapatma</u>: seni duysun. <u>Yardım gelene kadar başı bırakma.</u>"],
 [null,"Saçlı deri çok kanar. Kalkan deri parçasını yerine koy, pedle <b>hafifçe</b> bastır (altında kırık olabilir) ve sar. <u>Kulaktan ya da burundan gelen kanı veya sıvıyı <b>tıkama</b></u>; üstünü temiz bezle ört."],
 [null,"<b>Bilinci kapalı ama nefes alıyorsa</b> biri başı iki yandan tutsun; baş, boyun ve gövdeyi tek parça hâlinde çevirip derlenme pozisyonuna alın. <b>Bilinci açıksa</b> <u>kişiyi kıpırdatma</u>; yalnızca hayati tehlikede (yangın, çökme) taşı. Tek başınaysan ayak bileklerinden ya da koltuk altlarından tutup <b>düz bir çizgide</b> sürükle. <u>Boyunluk takma, doğaçlama boyunluk da yapma.</u>"],
 [null,"<b>15 dakikada bir</b> bilincini kontrol et: uyanık mı, yalnızca sese mi, yalnızca ağrıya mı yanıt veriyor, yoksa hiç mi yanıt vermiyor? Gece 2 saatte bir uyandır. <u>Alkol ve uyku ilacı verme.</u>"]],true),src:"T.C. Sağlık Bakanlığı İlk Yardım Uygulamaları Beceri Rehberi (MEB İSG 2025); ERC 2021"});

set("yanik",{h:
 I("i_brn",[[null,"<b>Yanmayı durdur:</b> Kişinin giysileri alev aldıysa ona \"Dur, yat, yuvarlan!\" de; üstüne battaniye örterek alevi söndür. Elektrik yanığında önce akımı kes."],
 [0,"Yanığı en az <b>20 dakika akan serin suyla</b> soğut; <u>buz kullanma</u>. Geniş yanığı 15–30 dakika ıslak bezle soğut; <u>kişiyi üşütme</u>. Su kıtsa ıslak bezi sık sık değiştir."],
 [null,"Yüzüğü, saati, kemeri bölge <b>şişmeden</b> çıkar. Yanığa yapışmamış giysiyi soğuttuktan sonra <b>keserek</b> çıkar; <u>yapışmış giysiyi koparma</u>."],
 [null,"Streç filmi yanığın üstüne <b>serer gibi</b> koy, <u>çepeçevre sarma</u>; ya da yanığı temiz bir poşetle ört. <u>Gazlı bez ve sargı bezi sarma</u>: yanığa yapışır."],
 [null,"Yanığı soğut ama kişiyi sıcak tut."]],true)+
 cd("warn","<u><b>Yanığa yoğurt, diş macunu, salça, yağ, merhem ya da buz sürme.</b></u> <u>Kabarcıkları patlatma.</u> Yüz, el, ayak, eklem ya da cinsel bölge yanmışsa, nefes yolu yanmışsa (burun kılları yanık, ağız-burun çevresi isli), yanık kişinin avucundan büyükse ya da derinse kişiyi hastaneye götür.")+
 cd("info","<b>Yanığın büyüklüğü:</b> Kişinin parmaklarıyla birlikte kendi avucu, vücudunun yaklaşık %1'i kadardır. Yanık yetişkinde vücudun %10'undan, çocukta %5'inden büyükse şok riski vardır: kişiyi yatır, sıcak tut, <u>ağızdan bir şey verme</u>. Yardım saatlerce gelemeyecekse ve kişinin bilinci tam açıksa, kusmuyorsa, karın yarası yoksa ORS'yi (ağızdan sıvı-tuz karışımı, → <a href='#/g/susuzluk'>İshal ve sıvı kaybı</a>) yudum yudum ver. <b>Kimyasal yanıkta</b> eldiven giyip kimyasal bulaşmış giysiyi çıkar, kuru tozu fırçalayarak at, sonra en az 15 dakika akan suyla yıka. <b>Elektrik yanığında</b> önce akımı kes (→ <a href='#/g/suda'>Elektrik çarpması</a>), sonra yanığı 10–15 dakika serin suyla soğut; <u>çok soğuk su kullanma</u>. Dışarıdan küçük görünen yaranın altında büyük bir iç hasar olabilir: kişiyi mutlaka hastaneye götür."),src:"T.C. Sağlık Bakanlığı İlk Yardım Uygulamaları Beceri Rehberi (MEB İSG 2025); ERC 2021"});

/* Isırık ve sokmalar: tek sayfa, hayvana göre */
set("yilan",{t:"Isırık ve sokmalar",d:"Yılan, akrep, karakurt, arı, kene, köpek",h:
 cd("info","Hangi hayvan olduğunu ve ondan nasıl uzak durulacağını öğrenmek için → <a href='#/g/hayvan'>Hayvanlar ve tehlikeler</a>. <b>Ulusal Zehir Danışma Merkezi (UZEM): 114</b>")+
 "<h2>Yılan</h2>"+I("i_snk",[[null,"Yılandan <b>2 m</b> uzaklaş. <u>Yılanı yakalamaya, öldürmeye çalışma</u>; fotoğrafını çekmen yeter."],
  [null,"Her ısırığı zehirli kabul et. Kişiyi yatır, sakinleştir; <u>onu <b>hareket ettirme, yürütme</b></u>. Yüzüğünü, saatini, sıkan giysisini çıkar."],
  [0,"Isırılan uzvu <b>kan dolaşımını engellemeyecek gevşeklikte</b> bandajla sar, <b>atelle sabitle</b>, kalp seviyesinde tut. Şişliğin sınırını kalemle çiz, yanına saati yaz; 15 dakikada bir yeni sınırı çiz."],
  [null,"112'yi ara: panzehir yalnızca hastanede var. Kişinin taşınması gerekiyorsa onu sedyeyle taşı."]],true)+
 cd("warn","<b>Yapılmayacaklar:</b> <u>yarayı kesmek, ağızla emmek, turnike ya da sıkı bağ, buz veya soğuk uygulamak, alkol vermek, yarayı ateşle yakmak.</u> Hepsi zarar verir.")+
 "<h2>Akrep</h2><p>Bölgeyi yıka, <b>15 dakika</b> bezle sarılı soğuk uygula, gevşek bandajla sar, uzvu sabitle, <b>112'yi ara</b>. <u>Yarayı kesme, ağızla emme.</u> Sokulan kişi çocuk ya da yaşlıysa veya nefes almada-yutmada güçlük, kas seğirmesi, aşırı terleme, salya akması varsa durum <b>çok acildir</b>.</p>"+
 "<h2>Karakurt</h2><p>Isırılan yeri yıka, soğuk uygula, kişiyi sakin tut ve hastaneye götür. Isırıktan 30–60 dakika sonra karında ve sırtta kramp başlaması beklenir. Isırılan çocuk ya da yaşlıysa 112'yi ara.</p>"+
 "<h2>Arı ve eşek arısı</h2><p>İğneyi kredi kartı gibi düz bir kenarla <b>yana sıyırarak</b> çıkar; <u>iğneyi cımbızla sıkma</u>. Soğuk uygula. Arı ağzın ya da boğazın içini soktuysa veya alerji belirtileri başlarsa 112'yi ara; kişinin reçeteli adrenalin kalemi varsa onu kullan (aşağıya bak).</p>"+
 cd("warn","<b>Ağır alerji (anafilaksi):</b> Boğazda şişme, ses kısıklığı, nefes darlığı, vücuda yayılan kızarıklık ve kaşıntı başlarsa ya da kişi bayılacak gibi olursa veya bayılırsa hemen <b>112'yi ara</b>. Kişinin adrenalin kalemi varsa <b>emniyet kapağını çıkar</b>, iğne ucunu <b>uyluğun dış yüzüne</b> daya (giysinin üstünden de olur), <u>başparmağını kalemin ucuna koyma</u>; sertçe bastır ve kalemin üstünde yazan süre kadar tut (çoğunda 3–10 saniye). Düzelme olmazsa <b>5 dakika sonra</b> ikinci kalemi uygula. Nefes almakta zorlanıyorsa oturt; bayılacak gibiyse yatırıp bacaklarını kaldır.")+
 "<h2>Kene</h2><p><u>Keneye <b>çıplak elle dokunma</b></u>; eldiven giy ya da eline poşet geçir. Keneyi ince uçlu bir cımbız ya da pensle <b>deriye en yakın</b> yerinden (başından) tut; sıkmadan ve çevirmeden düz yukarı çek. <u>Keneyi ezme, yakma; üstüne benzin, aseton, kolonya ya da yağ sürme.</u> Isırılan yeri yıka, tarihi yaz ve <b>en kısa sürede bir sağlık kuruluşuna</b> başvur (Kırım-Kongo kanamalı ateşi, KKKA riski). Sonraki <b>1–14 gün</b> içinde ateş, halsizlik, kas ağrısı ya da kanama başlarsa hemen hastaneye git.</p>"+
 "<h2>Köpek, kedi, yabani hayvan</h2><p>Yarayı en az <b>10–15 dakika sabunla ve akan suyla</b> yıka, povidon iyot sür. <u>Yarayı dikme, sıkıca kapatma.</u> <b>Hemen</b> bir sağlık kuruluşuna git (kuduz ve tetanoz aşısı için); gecikmiş olsan bile mutlaka git. Hayvanın sahibini, aşılı olup olmadığını ve nasıl davrandığını not et.</p>"+"<h2>Denizanası</h2><p>Bölgeyi <b>deniz suyuyla</b> yıka (tatlı su değil); kalan dokunaçları eldivenle veya kartla sıyır. Sonra yakmayacak sıcaklıkta sıcak su uygula. Nefes darlığı ya da vücuda yayılan döküntü başlarsa veya kişi bayılırsa <b>112'yi ara</b>.</p>",
 src:"T.C. Sağlık Bakanlığı İlk Yardım Uygulamaları Beceri Rehberi (MEB İSG 2025); UZEM; ERC 2021"});

/* YENİ: Çok yaralı (triyaj) + tek yaralıda kontrol sırası */
set("triyaj",{cat:"ilk",sos:1,ic:"users",t:"Çok yaralı: triyaj",d:"Kime önce? 30 saniyede renk ver",h:
 cd("warn","<b>Bu sıralamayı yalnızca yaralı sayısı, yardım edebilecek kişi sayısından fazlaysa uygula.</b> Tek yaralı varsa ya da yeterince yardımcı varsa normal ilk yardımı yap, gerekirse KPR uygula. Yaralı çoksa <u><b>kimsenin başında uzun durma</b></u>. Her yaralıya en fazla 30 saniye ayır: ona bir renk ver, yalnızca hayat kurtaran işi yap (kanamaya bastır, hava yolunu aç), sonra sıradakine geç.")+
 H.st(["<b>Bağır:</b> \"Yürüyebilen herkes şu ağacın yanına!\" Gidenlere <b>YEŞİL</b> ver: bekleyebilirler. Aralarından yardımcı al.",
 "<b>Yürüyemeyen biri nefes almıyorsa</b> hava yolunu aç. Nefes başladıysa <b>KIRMIZI</b> ver ve yan yatır. Nefes hâlâ yoksa <b>SİYAH</b> ver ve sıradakine geç: tek kurtarıcıyken birine KPR yapmak, başka birinin hayatına mal olur.",
 "<b>Nefesi dakikada 30'dan hızlıysa</b> KIRMIZI ver.",
 "<b>Dolaşıma bak:</b> Tırnağına bastırıp bırak. Pembe renk 2 saniyede geri gelmiyorsa ya da ağır kanama varsa KIRMIZI ver; kanamaya hemen bastır ya da turnike tak.",
 "<b>\"Elimi sık\" de:</b> Yapamıyorsa KIRMIZI, yapabiliyorsa <b>SARI</b> ver.",
 "<b>Etiketle:</b> Yaralının alnına ya da koluna kalemle rengin harfini ve saati yaz: K (kırmızı), S (sarı), Y (yeşil), X (siyah). Önce kırmızıları, sonra sarıları tahliye et. 15 dakikada bir herkesi yeniden değerlendir: renk değişebilir."],true)+
 "<h2>Tek yaralıda kontrol sırası (MARCH)</h2>"+
 '<p>MARCH, askerî sahada yaralı bakımı kılavuzundaki (TCCC) kontrol sırasının İngilizce baş harfleridir. Yukarıdan aşağıya sırayla ilerle.</p><div class="tw"><table><tr><th></th><th>Ne</th><th>Yap</th></tr><tr><td><b>M</b></td><td>Ağır (masif) kanama</td><td>Yaraya bastır, derin yarayı doldur, gerekirse turnike tak.</td></tr><tr><td><b>A</b></td><td>Hava yolu</td><td>Başı geri it, çeneyi kaldır; bilinçsizse yan yatır.</td></tr><tr><td><b>R</b></td><td>Solunum</td><td>Nefes alıyor mu, hızlı mı, bak; göğüs yarası var mı, kontrol et.</td></tr><tr><td><b>C</b></td><td>Dolaşım</td><td>Öteki kanamaları durdur, şoku önle.</td></tr><tr><td><b>H</b></td><td>Üşüme (hipotermi) ve kafa yaralanması</td><td>Yerden yalıt, üstünü ört; bilincini izle.</td></tr></table></div>'+
 cd("tip","<b>Yaralı notu yaz</b> ve kâğıdı yaralının cebine koy: adı, saat, ne olduğu, ne yaptığın (turnike saatini mutlaka yaz), nabzı, nefesi, bilinci ve bunlara baktığın saatler. Sağlık ekibi gelince bu kâğıdı onlara ver."),
 src:"START triyajı (FEMA CERT); TCCC / ABD Ordusu TC 4-02.1"});

/* YENİ: Enkaz ve hafif arama-kurtarma */
set("arama",{cat:"afet",ic:"city",t:"Enkaz: hafif arama-kurtarma",d:"Ekiplerden önceki ilk saatler",h:
 cd("warn","<b>Kurtarıcı yaralanırsa iki yaralı olur.</b> <u><b>Hasarlı binaya girme</b></u> (AFAD uyarısı). Dışarıdan sesle ara, yeri işaretle, profesyonel ekibi yönlendir. Yalnızca görünen ve binaya girmeden ulaşabildiğin kişiyi çıkar. Depremlerde canlı çıkarılanların çoğunu ilk saatlerde komşular kurtarır.")+
 H.st(["<b>Çevreyi değerlendir:</b> Gaz kokusu, elektrik, su sızıntısı, yangın ya da artçı sarsıntı riski var mı? <u>Binaya, enkaz boşluğuna ya da çökmüş katın altına <b>girme</b></u>; <u>enkazın üstünde yürüme</u> (yük bindirir, toz kaldırır).",
 "<b>Kendini koru:</b> Kask, iş eldiveni, toz maskesi, gözlük ve kalın tabanlı ayakkabı giy. <b>İkili</b> çalışın; dışarıda biri, kimin çalışma alanına ne zaman girdiğini yazsın.",
 "<b>Sesle ara:</b> \"Beni duyan var mı? Duyan varsa üç kez vursun!\" diye bağır. Sonra <b>tamamen sus</b> ve dinle. Herkes sussun, motorlar kapatılsın.",
 "<b>Sistemli tara:</b> Binanın ve enkaz yığınının çevresini dışarıdan, hep aynı yönde tam tur dolaş. Her pencerede, boşlukta, borunun yanında dur, seslen, dinle. Ses gelen yeri ve saati not et.",
 "<b>İşaretle:</b> Binanın girişine ya da enkazın önüne tebeşir veya spreyle kocaman bir <b>X</b> çiz. X'in soluna ekibinin adını, üstüne tarihi ve saati, sağına tehlikeyi (gaz, çökme), altına sesini duyduğun ya da bulduğun kişi sayısını yaz. Profesyonel ekip gelince bu bilgiyi hemen onlara ilet.",
 "<b>Kaldır ve takozla</b> (yalnızca açıkta olan, binaya girmeden ulaşabildiğin kişide): Ağır parçayı kaldıraçla (sağlam bir çubuk ve altına destek takozu) birkaç cm kaldır, <b>hemen altına takoz koy</b>. Kural: bir kaldır, bir takozla. <u>Parçayı tek seferde yükseltme.</u> Yalnızca kişiyi çıkarabilecek kadar kaldır.",
 "<b>Çıkar:</b> Önce ağır kanamayı durdur, hava yolunu aç, sonra başını ve boynunu destekleyerek çıkar. <b>Kişinin bir uzvu saatlerce ağır bir cismin altında kaldıysa</b> kişi çıkarılınca birden kötüleşebilir (ezilme sendromu). Sağlık ekibine hemen haber ver. Ekip saatlerce gelemeyecekse ve kişinin bilinci tam açıksa, kusmuyorsa, karın yarası yoksa yudum yudum su ver ve onu hızla bir sağlık kuruluşuna ulaştır."],true)+
 cd("tip","Ekipte iki düdük işareti kullanın: <b>3 kez düdük</b>, herkes sussun ve dinlesin demektir. <b>Uzun düdük</b>, çalışma alanını hemen boşaltın demektir (artçı ya da çökme sesi).")+
 cd("info","<b>Enkaz altındaysan</b> <u>kıpırdama, toz kaldırma</u>; ağzını bezle ört. <u>Bağırma</u>; boruya ya da duvara <b>üçer kez</b> vur, düdük çal. <u>Kibrit, çakmak yakma</u> (gaz olabilir). Telefonun varsa SMS at, sonra ekranı kapat."),
 src:"FEMA CERT Temel Eğitim (Hafif Arama-Kurtarma); AFAD; AKUT"});
})();

/* İlk yardım — eksik konular: ilk adımlar ve 112, kalp krizi ve inme, bayılma-havale-şeker, astım, suda boğulma ve elektrik.
   Esas: T.C. Sağlık Bakanlığı İlk Yardım Uygulamaları Beceri Rehberi (Kızılay dahil eğitim merkezlerinin müfredatı; MEB İSG 2025 eğitim notları üzerinden).
   Rehberin sustuğu yerde ERC 2021 ilk yardım kılavuzu. */
(function(){
var H=window.HK,cd=H.cd,st=H.st;
var SB="T.C. Sağlık Bakanlığı İlk Yardım Uygulamaları Beceri Rehberi (MEB İSG 2025 eğitim notları)";
function add(o,first){var old=H.guide.filter(function(x){return x.id===o.id})[0];if(old){for(var k in o)old[k]=o[k];return}if(first)H.guide.unshift(o);else H.guide.push(o)}

add({id:"ilkadim",cat:"ilk",ic:"shield",t:"İlk yardımın ilk adımları",d:"Güvenlik · değerlendir · 112'ye ne söylenir",h:
 st(["<b>Olay yerinin güvenliğine bak:</b> Yangın, gaz, elektrik, trafik ya da çökme tehlikesi var mı? Önlem alamıyorsan <u>olay yerine yaklaşma</u>; uzaklaş ve 112'yi ara. Kendini koru: eldivenin yoksa eline poşet geçir.",
 "<b>Trafik kazasında:</b> Kendi aracını güvenli bir yere çek, dörtlüleri yak, yansıtıcı yeleğini giy. Uyarı üçgenini şehir içinde en az <b>30 m</b>, şehirlerarası yolda en az <b>150 m</b> uzağa koy (çift yönlü yolda kazanın hem önüne hem arkasına). Kazalı aracın kontağını kapat, el frenini çek, mümkünse tekerleğe takoz koy. <u>Sigara içme, kimsenin içmesine izin verme.</u>",
 "<b>Değerlendir:</b> Omuzlarına hafifçe dokun, \"İyi misiniz?\" de. <b>Yanıt vermiyorsa</b> birine 112'yi arat ve en fazla 10 saniye nefesine bak: normal nefes almıyorsa <a href='#/g/kpr'>KPR</a>'ye başla, alıyorsa <a href='#/g/bilincsiz'>derlenme pozisyonuna</a> al. <b>Yanıt veriyorsa</b> nefes alıp almadığına ve ağır kanama olup olmadığına bak. Sonra vücudunu baştan ayağa kontrol et, ne olduğunu sor.",
 "<b>112'yi ara</b> ya da birine aratıp \"Aradıktan sonra bana haber ver\" de. Sakin ol ve şunları sırayla söyle: <b>adın ve telefon numaran</b>, <b>ne olduğu</b>, <b>kaç kişinin</b> yaralı olduğu, <b>yaralıların durumu ve yaptığın ilk yardım</b>, <b>tam adres</b> (il, ilçe, mahalle, sokak, numara, yol tarifi). <u>Görevli kapatmadan telefonu kapatma.</u>",
 "<b>İlk yardımı uygula</b>; yardım gelene kadar <u>yaralının yanından ayrılma</u>. <u>Gerekmedikçe yaralıyı yerinden oynatma</u>; başına ya da boynuna darbe aldıysa omurga yaralanması var kabul et."],true)+
 cd("warn","<b>Yapma:</b> <u>Kendini tehlikeye atma.</u> <u>Ağır yaralıya ya da bulantısı, uyku hâli veya bilinç bulanıklığı olan kişiye su dahil hiçbir şey verme.</u> <u>Kolonya ya da soğan koklatma.</u> <u>Kimseye ilaç önerme.</u>")+
 cd("tip","<b>İlaç:</b> Kişinin kendi reçeteli ilacını kullanmasına yardım edebilirsin.")+
 cd("info","<b>Arama geçmiyorsa</b> birkaç dakika sonra yeniden dene; ekibine ve yakınlarına SMS at. Resmî <b>HAYAT 112 Acil</b> uygulaması, internet yokken konumunu SMS ile 112'ye gönderebilir. Bu uygulamayı şimdiden telefonuna kur (→ <a href='#/g/uygulamalar'>Diğer uygulamalar</a>)."),
 src:SB},true);

add({id:"kalp",cat:"ilk",sos:1,ic:"heart",t:"Göğüs ağrısı (kalp krizi) ve inme",d:"112 · yarı oturt · Yüz-Kol-Konuşma-Zaman",h:
 "<h2>Kalp krizi şüphesi</h2>"+
 cd("info","<b>Belirtiler:</b> göğüste baskı, sıkışma, yanma; kola (çoğunlukla sol), çeneye, sırta, mide üstüne yayılan ağrı; nefes darlığı, soğuk terleme, bulantı, baş dönmesi. Kadınlarda, yaşlılarda ve şeker hastalarında ağrı hafif olabilir; yalnızca nefes darlığı veya halsizlik görülebilir.")+
 st(["<b>112'yi ara.</b> <u>\"Geçer\" diye bekleme.</u>",
 "Kişiyi <b>yarı oturur</b> pozisyona al: sırtını duvara ya da bir çantaya yasla, dizleri hafifçe bükük olsun. Sıkan giysisini gevşet. <u>Kişiyi yürütme, merdiven çıkartma.</u>",
 "Kişinin kendi <b>reçeteli kalp ilacı</b> (ör. dil altı hap) varsa kullanmasına yardım et.",
 "<b>Aspirin (yalnızca yetişkine):</b> Ağrının kalpten olduğunu düşünüyorsan ve kişi bilinçliyse <b>aspirin</b> çiğnetip az suyla yutturabilirsin: 300 mg'lık <b>1 tablet</b> ya da 100 mg'lık <b>2–3 tablet</b> (yetişkin dozu 150–300 mg). Aspirin alerjisi, mide kanaması ya da yakın zamanda geçirilmiş bir kanama varsa veya emin değilsen <u><b>aspirin verme</b></u>. Verdiysen 112 ekibine söyle.",
 "<u>Bacaklarını <b>kaldırma</b>, kişiyi yalnız bırakma, başka bir şey yedirip içirme.</u> Bilincini kaybeder ve normal nefes almazsa hemen <a href='#/g/kpr'>KPR</a>'ye başla, şok cihazı (OED) getirt."],true)+
 "<h2>İnme (felç) şüphesi</h2>"+
 st(["<b>Yüz:</b> \"Gülümse\" de. Yüzünün bir yanı düşük mü?",
 "<b>Kol:</b> \"İki kolunu öne kaldır, öyle tut\" de. Kollardan biri aşağı düşüyor mu?",
 "<b>Konuşma:</b> Basit bir cümleyi tekrarlat. Konuşması bozuk mu, anlamsız mı, yoksa hiç konuşamıyor mu?",
 "<b>Zaman:</b> Bu belirtilerden biri bile varsa hemen <b>112'yi ara</b>. Belirtilerin <b>başladığı saati</b> yaz ve ekibe söyle: tedavi bu saate göre seçilir."],true)+
 cd("warn","<u>Ağızdan yiyecek, içecek ya da ilaç <b>verme</b></u> (yutması bozulmuş olabilir); <u>aspirin de verme</u>. Bilinci bulanıklaşır ama nefes alırsa <a href='#/g/bilincsiz'>derlenme pozisyonuna</a> al; normal nefes almıyorsa KPR'ye başla. Ani ve çok şiddetli baş ağrısı, ani görme kaybı ve dengesizlik de inme belirtisi olabilir."),
 src:SB+" (göğüs ağrıları, bilinç bozuklukları); ERC 2021"});

add({id:"nobet",cat:"ilk",sos:1,ic:"brain",t:"Bayılma, havale, şeker düşmesi",d:"Yatır · koru · şeker ver",h:
 "<h2>Bayılma</h2>"+
 cd("tip","<b>Bayılacak gibi olursan</b> (baş dönmesi, göz kararması, terleme, bulantı) hemen otur ya da çömel. Bacaklarını çaprazlayıp kaslarını sık ya da ellerini kenetleyip iki yana çek: bu, bayılmanı önleyebilir.")+
 st(["Bayılan kişiyi düz zeminde <b>sırtüstü</b> yatır, bacaklarını yaklaşık <b>30 cm</b> kaldır (düşerken başını ya da bacağını yaraladıysa <u>bacaklarını kaldırma</u>). Sıkan giysisini gevşet, ortamı havalandır.",
 "<b>En fazla 10 saniye</b> nefesine bak. Normal nefes almıyorsa <a href='#/g/kpr'>KPR</a>'ye başla.",
 "Kendine gelince <u>onu hemen ayağa kaldırma</u>; birkaç dakika yatsın, sonra yavaşça otursun.",
 "Kişi birkaç dakikada kendine gelmiyorsa, yeniden bayılıyorsa, göğüs ağrısı, çarpıntı ya da nefes darlığı varsa, düşerken yaralandıysa veya efor sırasında bayıldıysa <b>112'yi ara</b>."],true)+
 cd("info","<b>Hamileyse (20 hafta ve üstü):</b> sırtüstü değil, <b>sol yanına</b> yatır; sırtüstü yatınca bebeğin ağırlığı büyük damara bastırır.")+cd("warn","<b>Yapılmayacaklar:</b> <u>oturtmaya çalışmak, kolonya ya da soğan koklatmak, yüzüne su dökmek, tokat atmak, bilinci tam açılmadan su içirmek.</u>")+
 "<h2>Havale (epilepsi nöbeti)</h2>"+
 st(["Çevredeki sert, keskin ya da sıcak eşyaları uzaklaştır. Başının altına yumuşak bir şey koy, gözlüğünü çıkar, yakasını gevşet.",
 "<u>Nöbeti <b>durdurmaya çalışma</b>; kollarını, bacaklarını tutma, bağlama.</u> <u>Ağzına parmak, kaşık ya da bez <b>sokma</b></u>: kişi dilini yutmaz, ama seni ısırabilir.",
 "Nöbetin <b>başlama saatini</b> not et.",
 "Kasılmalar bitince onu <a href='#/g/bilincsiz'>derlenme pozisyonuna</a> al, nefesini izle; kendine gelene kadar yanında kal, sakin konuş.",
 "Nöbet 5 dakikadan uzun sürerse, kişinin ilk nöbetiyse, bir nöbet biterken yenisi başlarsa, nöbet bitince bilinci açılmazsa ya da nefesi düzelmezse, kişi yaralandıysa, nöbeti suda geçirdiyse, hamileyse veya şeker hastasıysa <b>112'yi ara</b>. <u>Tam kendine gelene kadar yiyecek, içecek verme.</u>"],true)+
 cd("tip","<b>Çocukta ateşli havale:</b> Fazla giysilerini çıkar, <b>oda sıcaklığındaki</b> suyla ıslatılmış bezle serinlet. <u>Soğuk su, buz, alkol ya da sirke kullanma.</u> Kasılma bitince derlenme pozisyonuna al. <b>Her ateşli havalede 112'yi ara.</b>")+
 "<h2>Şeker düşmesi (hipoglisemi)</h2>"+
 cd("info","İnsülin ya da şeker ilacı kullanan bir kişide titreme, terleme, açlık hissi, sinirlilik, sarhoş gibi davranma ya da kafa karışıklığı (konfüzyon) görürsen önce <b>şeker düşmesinden</b> şüphelen.")+
 st(["<b>Bilinci açık ve yutabiliyorsa</b> şeker ver: 4 küp şeker, yarım su bardağı meyve suyu ya da kola (diyet olmayan), 1 yemek kaşığı reçel ya da bal.",
 "<b>112'yi ara.</b> 10–15 dakika bekle; düzelmediyse bir kez daha şeker ver.",
 "Düzelince ekmek, bisküvi gibi bir şey yesin. <u>Kişiyi yalnız bırakma.</u>",
 "<b>Bilinci kapalıysa ya da yutamıyorsa</b> <u>ağızdan hiçbir şey verme</u>; onu <a href='#/g/bilincsiz'>derlenme pozisyonuna</a> al, 112'yi ara."],true)+
 cd("warn","<u><b>İnsülin iğnesi yapma.</b></u> Şekerin düşük mü yüksek mi olduğundan emin değilsen ve kişinin bilinci açıksa <b>şeker ver</b>: düşük şeker dakikalar içinde tehlikeli olur, biraz şeker ise yüksek şekeri belirgin biçimde kötüleştirmez."),
 src:SB+" (bilinç bozuklukları); ERC 2021"});

add({id:"astim",cat:"ilk",ic:"lung",t:"Nefes darlığı ve astım krizi",d:"Oturt · kendi ilacı · 112",h:
 st(["<b>Kişiyi oturt</b>; hafifçe öne eğilip kollarını masaya ya da dizlerine dayasın. Sıkan giysisini gevşet, onu temiz havaya çıkar. Sakin konuş, yavaş nefes alıp vermesini söyle.",
 "Kişinin kendi <b>astım ilacı</b> (genellikle mavi kurtarıcı sprey) varsa, doktorunun söylediği şekilde kullanmasına yardım et. Spreyin haznesi varsa hazneyle kullansın.",
 "İlaçtan sonra 5 dakikada düzelmiyorsa, cümle kuramıyorsa, dudakları morarıyorsa, çok yoruluyor ya da uyuşuklaşıyorsa veya kriz ilk kez oluyorsa <b>112'yi ara</b>.",
 "Bilincini kaybeder ve normal nefes almazsa <a href='#/g/kpr'>KPR</a>'ye başla."],true)+
 cd("info","Ani nefes darlığının başka nedenleri de olabilir: alerji (<a href='#/g/yilan'>anafilaksi</a>), kalp krizi (<a href='#/g/kalp'>göğüs ağrısı</a>), yabancı cisim (<a href='#/g/bogulma'>boğulma</a>), göğüs yarası (<a href='#/g/gogus'>göğüs</a>), duman veya gaz (<a href='#/g/zehir'>karbonmonoksit</a>). Duman ve toz bulutunda ağzını ıslak bezle kapat, temiz havaya çık."),
 src:"ERC 2021 ilk yardım kılavuzu; "+SB});

add({id:"suda",cat:"ilk",ic:"wave",t:"Suda boğulma ve elektrik çarpması",d:"Önce kendi güvenliğin",h:
 "<h2>Suda boğulma</h2>"+
 cd("warn","Suya atlayan kurtarıcı da boğulabilir. <b>Önce kıyıdan yardım et:</b> Seslen; bir dal, kürek ya da havlu uzat; can simidi, boş bidon ya da ip at; mümkünse tekneyle git. Suya yalnızca yüzmeyi ve kurtarmayı biliyorsan ve yanında yüzen bir şey varsa gir.")+
 st(["Kişiyi sudan çıkarırken başını suyun üstünde tut. Sığ suya atlama ya da dalma kazasından şüpheleniyorsan baş, boyun ve gövdeyi birlikte, aynı hizada tut (omurga yaralanmış olabilir).",
 "<b>En fazla 10 saniye</b> nefesini kontrol et. Normal nefes almıyorsa 112'yi ara ve hemen <a href='#/g/kpr'>KPR</a>'ye başla; suda boğulmada nefes vermek özellikle önemlidir.",
 "<u>Karnına bastırarak ya da baş aşağı tutarak <b>su çıkarmaya çalışma</b></u>: zaman kaybettirir, kusturur. Kusarsa yan çevir, ağzını temizle, KPR'ye devam et.",
 "Nefes alıyorsa ıslak giysilerini çıkar, kurula, battaniyeye sar, <a href='#/g/bilincsiz'>derlenme pozisyonuna</a> al.",
 "Şok cihazı (OED) kullanacaksan kişinin göğsünü kurula, onu sudan ve ıslak zeminden uzaklaştır.","Kişi kendine gelse bile <b>hastaneye</b> gitmeli: akciğer sorunu saatler sonra başlayabilir."],true)+
 "<h2>Elektrik çarpması</h2>"+
 st(["<u><b>Akım kesilmeden kişiye dokunma.</b></u> Sigortayı ya da şalteri kapat, fişi çek.",
 "Akımı kesemiyorsan kuru bir zeminin (kuru tahta, lastik paspas) üstünde dur ve kişiyi kuru tahta ya da plastik bir sopayla kaynaktan uzaklaştır. <u>Bunu ıslak elle, metal ya da ıslak bir cisimle deneme.</u>",
 "<b>Yüksek gerilimde</b> (direk, trafo, kopmuş hat, demiryolu) <u><b>kişiye yaklaşma</b>, kimseyi de yaklaştırma</u>; 112'yi ara. Akımı ancak elektrik şirketi kesebilir.",
 "Tehlike geçince nefesini kontrol et; normal nefes almıyorsa <a href='#/g/kpr'>KPR</a>'ye başla ve şok cihazını (OED) kullan. Ortamda tehlike yoksa <u>kişiyi yerinden oynatma</u> (düşerken omurgası yaralanmış olabilir).",
 "Akımın girdiği ve çıktığı yerlerdeki yanıkları 10–15 dakika serin suyla soğut (<u>çok soğuk su kullanma</u>), temiz bir örtüyle ört. Kişi iyi görünse bile onu <b>hastaneye</b> götür: kalp ritmi bozulabilir."],true)+
 cd("info","Yıldırım çarpması için → <a href='#/g/yildirim'>Yıldırım</a>. Fırtına sürüyorsa önce kendini koru. Yıldırım çarpan kişiye dokunmak güvenlidir; gerekiyorsa hemen KPR'ye başla."),
 src:SB+" (boğulmalar, yanıklar); ERC 2021"});
})();

/* Sadeleştirme: tekrar eden sayfaları birleştirir, kategori sırasını kurar, eksik kalan kuralları tamamlar.
   Eski bağlantılar H.alias ile yeni sayfaya yönlenir. */
(function(){
var H=window.HK,cd=H.cd,st=H.st;
function g(id){return H.guide.filter(function(x){return x.id===id})[0]}

   ek1.js: yeni sayfalar · ek2.js: ilk yardım sayfalarına ekler · ek3.js: afet, hijyen, plan ve liste ekleri. */
(function(){
var H=window.HK;
function bul(id){
 if(id.indexOf("plan/")===0){var p=id.slice(5);return (H.plans||[]).filter(function(x){return x.id===p})[0]}
 return H.guide.filter(function(x){return x.id===id})[0]}
function uyar(m){if(typeof console!=="undefined"&&console.warn)console.warn("HK-EK: "+m)}
/* Sayfaya HTML ekle. once verilirse sayfada bir kez geçen o metnin hemen ÖNÜNE, sonra verilirse hemen ARDINA; ikisi de yoksa sona. */
H.ekle=function(id,html,yer){var a=bul(id);if(!a){uyar("sayfa yok: "+id);return}
 if(yer){var s=yer.once||yer.sonra,i=a.h.indexOf(s);
  if(i>=0&&a.h.indexOf(s,i+1)<0){if(yer.sonra)i+=s.length;a.h=a.h.slice(0,i)+html+a.h.slice(i);return}
  uyar("yer bulunamadı ya da birden çok: "+id+" / "+s)}
 a.h+=html};
/* Sayfadaki metni değiştir (bir kez geçmeli). */
H.degis=function(id,eski,yeni){var a=bul(id);if(!a){uyar("sayfa yok: "+id);return}
 var i=a.h.indexOf(eski);if(i<0||a.h.indexOf(eski,i+1)>=0){uyar("değişecek metin bulunamadı ya da birden çok: "+id+" / "+eski.slice(0,60));return}
 a.h=a.h.slice(0,i)+yeni+a.h.slice(i+eski.length)};
H.kaynakEkle=function(id,s){var a=bul(id);if(a)a.src=(a.src?a.src+"; ":"")+s};
/* Yeni sayfa: sonra verilirse o sayfanın hemen ardına (kategorideki sıra H.guide sırasıdır). */
H.yeniSayfa=function(o,sonra){var i=-1;H.guide.forEach(function(x,k){if(x.id===sonra)i=k});if(i>=0)H.guide.splice(i+1,0,o);else H.guide.push(o)};
/* Listeye madde: grubun SONUNA eklenir. Telefondaki işaretler grup adı + sıra numarasıyla saklandığı için araya ekleme yapılmaz. */
H.listeEkle=function(lid,grup,items){var L=(H.lists||[]).filter(function(x){return x.id===lid})[0];if(!L){uyar("liste yok: "+lid);return}
 var G=L.g.filter(function(x){return x.n===grup})[0];if(!G){uyar("liste grubu yok: "+lid+" / "+grup);return}G.i=G.i.concat(items)};
/* Listeye yeni grup: listenin sonuna */
H.listeGrup=function(lid,grup){var L=(H.lists||[]).filter(function(x){return x.id===lid})[0];if(!L){uyar("liste yok: "+lid);return}L.g.push(grup)};
})();

 cd("warn","<b>Belirtiler:</b> Vücuda yayılan kurdeşen (kabarık, kaşıntılı döküntü) ve kaşıntı; dudakta, dilde, göz kapaklarında şişme; ses kısıklığı; hırıltılı nefes, nefes darlığı; kusma; baş dönmesi, bayılma. Döküntü olmadan da olabilir. Kişinin nefesi, sesi ya da bilinci etkileniyorsa durum <b>hayati tehlikedir</b>.")+

 "<b>Adrenalin kalemi:</b> Kişinin adrenalin kalemi varsa onu <b>hemen</b> kullan ya da kullanmasına yardım et. Emniyet kapağını çıkar, iğne ucunu <b>uyluğun dış yüzüne</b> daya (giysinin üstünden de olur). <u>Başparmağını kalemin ucuna koyma.</u> Sertçe bastır ve kalemin üstünde yazan süre kadar tut (çoğunda 3–10 saniye). Saati not et.",
 "<b>Duruş:</b> Nefes almakta zorlanıyorsa oturt. Başı dönüyorsa, soluksa ya da bayılacak gibiyse sırtüstü yatır, bacaklarını kaldır. Hamileyse sol yanına yatır. <u>Kişiyi aniden ayağa kaldırma, yürümesine izin verme.</u>",

 "<h2>Bayılmayla nasıl ayırt edilir?</h2><p>Basit bayılmada döküntü, şişme ya da hırıltı olmaz ve kişi yatırılınca birkaç dakikada kendine gelir (→ <a href='#/g/nobet'>Bayılma</a>). Arı, yiyecek ya da ilaçla karşılaştıktan sonra fenalaşan birinde bu belirtilerden biri varsa ya da emin değilsen ağır alerji gibi davran.</p>",
 src:"ERC 2021 ilk yardım kılavuzu (anafilaksi); Resuscitation Council UK, Emergency treatment of anaphylaxis (2021) ve SSS (\"emin değilsen adrenalin\", 5 dakikada tekrar); ASCIA (Avustralasya Klinik İmmünoloji ve Alerji Derneği): son kullanma tarihi geçmiş adrenalin kalemi; "+SB+"; Alton, The Survival Medicine Handbook (2013)"},"astim");
