<style>/* Saf siyah zemin: OLED ekranlarda siyah piksel kapalıdır = en az pil. Animasyon yok. */
:root{
  --bg:#000; --s1:#0d0d0b; --s2:#161613; --line:#2a2a24;
  --tx:#d9d5c7; --mut:#8c887a; --dim:#5d5a50;
  --ac:#c9a54b; --ac2:#7f8f4e; --red:#d0453a; --blue:#6e93b8;
  --r:10px; --fs:16px;
  --pbg:#0b0b09; --r1:#d9a441; --r1d:#6e4a14; --r2:#6f9fd0; --r2d:#23405f; --tipc:#fff3d6; --arw:#e8e2cf; --lbl:#cfc9b6;
  --wood:#7a5a3a; --woodd:#3e2c1a; --skin:#c9a083; --pt:#4f77a3; --rs:#6f7f45; --blood:#c0352b; --leaf:#4e5f2c; --leaf2:#6d7d3a; --earth:#3a2f22; --tarp:#5f7a52; --fire:#e8902c; --ash:#555; --ptl:#3b5a7c; --rsl:#4f5c30; --hair:#3a2a1c; --shoe:#222;
}
html.night{ --pbg:#060100; --r1:#c8463a; --r1d:#5a1810; --r2:#8a2c22; --r2d:#3a0c06; --tipc:#ff9a8a; --arw:#ff6a55; --lbl:#c8463a; --wood:#5a2018; --woodd:#2a0a06; --skin:#7a2a20; --pt:#5a1a12; --rs:#3a120c; --blood:#ff4a36; --leaf:#3a100a; --leaf2:#4a160e; --earth:#1a0604; --tarp:#4a140c; --fire:#ff5a3a; --ash:#2a0c08; --ptl:#4a140c; --rsl:#2a0c08; --hair:#1a0402; --shoe:#120302; --tx:#c8463a; --mut:#8a2f27; --dim:#5a1f1a; --ac:#d4503f; --ac2:#a03a2f; --red:#ff5a46; --blue:#b0443a; --line:#2a0f0c; --s1:#0a0302; --s2:#120504; }
html.big{ --fs:19px }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx)}
body{font:var(--fs)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px;min-height:100vh}
a{color:var(--ac)}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:1.25em;letter-spacing:.06em;text-transform:uppercase}
h2{font-size:1.1em;margin:18px 0 8px;color:var(--ac);letter-spacing:.03em}
h3{font-size:1em;margin:14px 0 6px;color:var(--tx)}
p{margin:6px 0}
ul,ol{margin:6px 0 6px 22px}
li{margin:3px 0}
b,strong{color:#f0ead6}
html.night b,html.night strong{color:var(--red)}
small,.mut{color:var(--mut)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 12px}
header.top .t{flex:1;min-width:0}
header.top .t h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .t small{display:block;font-size:.72em;letter-spacing:.08em;text-transform:uppercase}
.ib{background:var(--s2);border:1px solid var(--line);border-radius:8px;min-width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;cursor:pointer}
.ib svg{width:20px;height:20px}
main{padding:12px 14px;max-width:760px;margin:0 auto}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;color:var(--mut);text-decoration:none;font-size:.68em;letter-spacing:.04em;text-transform:uppercase}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--ac)}
nav.tabs a.sos{color:var(--red)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-decoration:none;color:var(--tx);display:flex;flex-direction:column;gap:6px;min-height:92px}
.tile svg{width:28px;height:28px;color:var(--ac)}
.tile b{font-size:.98em}
.tile small{font-size:.78em;line-height:1.3}
.tile.red{border-color:#5a1f1a}
.tile.red svg{color:var(--red)}

.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.card.warn{border-left:4px solid var(--red)}
.card.tip{border-left:4px solid var(--ac2)}
.card.info{border-left:4px solid var(--blue)}
.row{display:flex;align-items:center;gap:10px}
.row>.f{flex:1;min-width:0}
.list a.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--tx)}
.list a.item svg{width:22px;height:22px;color:var(--ac);flex:none}
.list a.item .f small{display:block;font-size:.8em;line-height:1.3}
.chev{color:var(--dim)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;text-decoration:none;color:var(--tx);min-height:44px}
.btn svg{width:20px;height:20px;flex:none}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#000;font-weight:600}
.btn.red{background:#3a0e0a;border-color:var(--red);color:#ffd9d4}
.btn.full{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.82em;background:var(--s1);cursor:pointer;color:var(--mut)}
.chip.on{border-color:var(--ac);color:var(--ac)}
.tag{display:inline-block;font-size:.7em;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--mut);margin-right:4px}
.tag.w{color:var(--blue);border-color:#22384d}.tag.f{color:var(--ac2);border-color:#333d1f}.tag.c{color:var(--ac);border-color:#4a3c19}.tag.v{color:#b9a58a}.tag.t{color:#c98a5a;border-color:#4a2e19}.tag.r{color:var(--red);border-color:#5a1f1a}

.search{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin:4px 0 10px}
input.in,select.in,textarea.in{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:10px;margin:4px 0}
label.lb{display:block;font-size:.8em;color:var(--mut);margin-top:8px}

.ck{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.ck .bx{flex:none;width:24px;height:24px;border:2px solid var(--dim);border-radius:5px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.ck.on .bx{background:var(--ac2);border-color:var(--ac2)}
.ck.on .bx::after{content:"";width:6px;height:12px;border:solid #000;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck.on .tx{color:var(--mut);text-decoration:line-through}
.ck .tx small{display:block;text-decoration:none}
.bar{height:6px;background:var(--s2);border-radius:3px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac2)}

table{width:100%;border-collapse:collapse;font-size:.86em;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:left;vertical-align:top}
th{color:var(--ac);font-weight:600}
.tw{overflow-x:auto}

.step{display:flex;gap:12px;margin:10px 0}
.step .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--s2);border:1px solid var(--ac);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9em}
.step.r .n{border-color:var(--red);color:var(--red)}
.step .f{flex:1}
.fig{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:8px;margin:10px 0;text-align:center}
.fig svg{width:100%;height:auto;max-height:260px}
.fig figcaption,.fig small{display:block;color:var(--mut);font-size:.8em;margin-top:4px}

.big{font-size:2.4em;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92em}
.kv dt{color:var(--mut)}
#flash{position:fixed;inset:0;z-index:50;background:#000;display:none}
#flash.on{display:block}
#flash button{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:#300;color:#fff;border:2px solid #f44;border-radius:10px;padding:14px 26px;font-size:1.1em}
.compass{width:220px;height:220px;margin:8px auto;display:block}
.sosbig{display:block;text-align:center;padding:18px;border-radius:12px;background:#2a0805;border:2px solid var(--red);color:#ffd2cc;font-weight:700;font-size:1.15em;text-decoration:none;margin:8px 0}
.foot{color:var(--dim);font-size:.75em;text-align:center;margin:24px 0 8px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}

.stp{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px;margin:14px 0}
.stp-h{display:flex;align-items:center;gap:8px;margin:0 2px 8px}.stp-h b{flex:1;color:var(--ac)}
.stp-all{background:none;border:1px solid var(--line);border-radius:6px;color:var(--mut);font-size:.75em;padding:4px 8px}
.stp-s{display:none}.stp-s.on{display:block}
.stp.all .stp-s{display:block;margin-bottom:14px}.stp.all .stp-b{display:none}
.stp svg{display:block;width:100%;height:auto;background:var(--pbg);border-radius:8px}
.stp-c{margin:8px 2px 2px;font-size:.95em;line-height:1.45;min-height:3em}
.stp-k{display:inline-block;background:var(--ac);color:#000;font-weight:700;border-radius:5px;padding:0 6px;margin-right:8px;font-size:.85em}
.stp-b{display:flex;align-items:center;gap:8px;margin-top:8px}
.stp-b button{flex:none;min-height:44px;min-width:84px;background:var(--s2);border:1px solid var(--line);border-radius:8px;font-weight:600}
.stp-d{flex:1;display:flex;justify-content:center;gap:6px}.stp-d i{width:8px;height:8px;border-radius:50%;background:var(--dim)}.stp-d i.on{background:var(--ac)}
.stp-note{font-size:.82em;color:var(--mut);margin-top:6px}

/* Fotoğraf galerisi */
.gal{margin:12px 0}
.gal-h{font-size:.85em;color:var(--ac);margin:0 2px 6px;font-weight:600}.gal-h small{color:var(--dim);font-weight:400}
.gal-r{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.gi{flex:none;width:118px;background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden;text-align:left;scroll-snap-align:start;cursor:zoom-in}
.gi img{display:block;width:118px;height:88px;object-fit:cover;background:#111}
.gi span{display:block;font-size:.72em;line-height:1.25;padding:5px 6px 6px;color:var(--tx);height:2.9em;overflow:hidden}
.gal.steps .gi{width:140px}.gal.steps .gi img{width:140px;height:105px}
.gal.steps .gi span{height:auto;text-align:center;font-weight:700;color:var(--ac);font-size:.9em;padding:3px}
#lb{position:fixed;inset:0;z-index:60;background:#000;display:none;flex-direction:column}
#lb.on{display:flex}
.lb-im{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px}
.lb-im img{max-width:100%;max-height:100%;object-fit:contain}
.lb-c{padding:8px 14px 4px;color:#e8e2cf;font-size:.95em}.lb-c small{display:block;color:#8c887a;font-size:.72em;margin-top:4px}
.lb-n{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 16px}
.lb-n button{min-width:64px;min-height:48px;font-size:1.6em;background:#161613;color:#e8e2cf;border:1px solid #2a2a24;border-radius:10px}
.lb-n span{color:#8c887a}
.lb-x{position:absolute;top:10px;right:10px;z-index:2;width:46px;height:46px;border-radius:50%;background:#161613cc;color:#fff;border:1px solid #444;font-size:1.2em}
html.night .gi img,html.night .lb-im img{filter:grayscale(1) sepia(1) hue-rotate(-40deg) saturate(2.5) brightness(.6)}
details.draw{margin:8px 0}details.draw>summary{cursor:pointer;color:var(--mut);font-size:.85em;padding:6px 2px}
#pc b{color:#000!important}
/* ---- v2: açılır menüler, kartlar, roller, kurulum, kasa, KPR ---- */
details.cat{border-bottom:1px solid var(--line)}
details.cat>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 2px;cursor:pointer}
details.cat>summary::-webkit-details-marker,details.sp>summary::-webkit-details-marker{display:none}
details.cat>summary b{flex:1;font-size:1.05em;color:var(--ac)}
details.cat>summary small{background:var(--s2);border-radius:20px;padding:1px 9px}
details.cat .chev,details.sp .chev{transition:none;color:var(--mut);font-size:1.3em}
details.cat[open]>summary .chev,details.sp[open]>summary .chev{transform:rotate(90deg)}
details.cat .list{padding-bottom:8px}
.sp-l{margin:6px 0}
details.sp{border:1px solid var(--line);border-radius:var(--r);margin:6px 0;background:var(--s1)}
details.sp>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:8px;cursor:pointer}
details.sp>summary img,details.sp>summary .noimg{width:64px;height:48px;object-fit:cover;border-radius:6px;flex:none;background:var(--s2)}
details.sp>summary .f{flex:1;min-width:0}
details.sp>summary small{display:block;font-size:.8em}
details.sp[open]{padding-bottom:6px}
details.sp .gal{margin:0 8px}
.sci{font-style:italic;font-size:.82em;margin:2px 10px}
dl.spd{margin:4px 10px 4px}
dl.spd dt{color:var(--ac);font-weight:700;font-size:.82em;text-transform:uppercase;letter-spacing:.05em;margin-top:8px}
dl.spd dd{margin:2px 0 0}
.gi.si{display:block;width:100%;padding:0;border:0;background:none;margin:2px 0 8px;border-radius:8px;overflow:hidden}
.gi.si img{display:block;width:100%;height:auto;border-radius:8px}
.card .gi.si{margin-top:0}
.rchip{display:inline-block;font-size:.75em;font-weight:700;border:1px solid var(--rc);color:var(--rc);border-radius:20px;padding:1px 8px;margin:4px 4px 2px 0}
.rrow{margin:2px 0}
.tile.role{border-color:var(--line)}
.setupbar{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--tx)}
.setupbar svg{width:26px;height:26px;flex:none;color:var(--blue)}
.wz{display:flex;gap:4px;margin:10px 0 4px;overflow:hidden}
.wz span{flex:1;font-size:.62em;text-align:center;padding:4px 0;border-top:3px solid var(--line);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wz span.ok{border-color:var(--ac2);color:var(--mut)}
.wz span.on{border-color:var(--ac);color:var(--ac);font-weight:700}
.wzb{margin-top:18px}
ol.ol{margin-left:20px}
.pbox{margin:10px 0}
.kpr{text-align:center;margin:18px 0}
.kc{font-size:4.2em;font-weight:800;color:var(--red);line-height:1.1;font-variant-numeric:tabular-nums}
.kl{font-size:1.15em;margin:6px 0}
.kt{color:var(--mut)}
.breath{width:150px;height:150px;border-radius:50%;margin:10px auto;border:3px solid var(--blue);transition:transform 4s linear;transform:scale(.55)}
.breath.in{transform:scale(1)}.breath.hold{transform:scale(1)}.breath.out{transform:scale(.55)}.breath.hold2{transform:scale(.55)}
#vview{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
#vview .vbar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
#vview .vbar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vview .vbody{flex:1;overflow:auto;padding:8px;-webkit-overflow-scrolling:touch}
#vview canvas{display:block;margin:0 auto 8px;background:#fff}
.item.vf{display:flex;align-items:center;gap:10px}
.item.vf .f{cursor:pointer}
.sp-im{margin:0 8px;display:flex;gap:6px}.sp-im .gi.si{flex:1;margin:0}
#upd{position:fixed;left:8px;right:8px;bottom:84px;z-index:60;background:var(--s2);border:1px solid var(--ac);border-radius:var(--r);padding:10px;display:flex;gap:8px;align-items:center}#upd span{flex:1}
/* Yapılmaması gerekenler: kırmızı alt çizgi (bağlantılar altın sarısı, karışmaz) */
u{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-skip-ink:none}
h3{font-size:1em;margin:14px 0 4px}
/* İnternetsiz hazır bildirimi */
#cev{position:fixed;left:8px;right:8px;bottom:84px;z-index:59;background:var(--s2);border:1px solid var(--ac2);border-radius:var(--r);padding:10px;font-size:.9em}
</style>
</head>

{id:"hipotermi",cat:"ilk",sos:1,ic:"snow",t:"Hipotermi & donma",d:"Titreme → zihin bulanıklığı → ölüm",h:
 "<p>İç ve Doğu Anadolu'da kış geceleri sıcaklık −10 ile −20 °C'ye iner. Ama <b>hipotermi ölümlerinin çoğu −1 ile +10 °C arasında</b> görülür: kişi ıslanmış, rüzgârda kalmış ve yorulmuştur. Vücudun iç ısısı ~33 °C'ye inince kişi kendini kurtaramaz. Bu yüzden herkes bir arkadaşını izlesin (eşli sistem).</p>"+
 '<div class="tw"><table><tr><th>Evre</th><th>Belirti</th><th>Ne yap</th></tr><tr><td>Hafif<br><small>32–35 °C</small></td><td>Şiddetli titreme. Eller beceriksizleşir; kişi tökezler, mırıldanır, homurdanır, sakarlaşır.</td><td>Rüzgârdan çıkar. Islak giysisini kurusuyla değiştir, başına bere tak, yerden yalıt. Bilinci tam açıksa yudum yudum ılık, şekerli içecek ver. Hafifçe hareket ettir.</td></tr><tr><td>Orta<br><small>28–32 °C</small></td><td>Titreme azalır ya da durur. Zihin bulanıklaşır, uyku hâli ve ilgisizlik başlar.</td><td>Yatırarak taşı, <b>nazikçe</b> hareket ettir. Boynuna, göğsüne, koltuk altlarına ve kasıklarına bezle sarılı ılık su şişesi koy: önce gövdeyi ısıt. <u>Kollarını ve bacaklarını ovma.</u> Hipotermi paketi yap (aşağıda), 112\'yi ara.</td></tr><tr><td>Ağır<br><small>&lt;28 °C</small></td><td>Bilinçsiz; nefes ve nabız zor bulunur.</td><td>En fazla 10 saniye nefese bak (soğukta nefes çok yavaş olabilir). Normal nefes yoksa KPR\'ye başla. <b>Ölü gibi görünse de vazgeçme:</b> donmuş biri ısıtılmadan ölü kabul edilmez. KPR\'yi sağlık ekibi gelene kadar sürdür.</td></tr></table></div>'+
 cd("info","<b>Kendini test et:</b> Serçe parmağını başparmağına rahatça değdiremiyorsan eller işlevini kaybediyor (cilt ~12 °C): dur ve ısın. <b>Soğuk idrar artırır:</b> kışın susamadan iç. Titreme güçlü bir ısıtıcıdır ama yakıt ister: şekerli/yağlı atıştır. <u>Alkol ve sigara kullanma:</u> alkol titremeyi bastırır ve ısı kaybını artırır, sigara el ve ayaklara giden kanı azaltır. Kapalı küçük barınakta ocak veya ateş <b>karbonmonoksit</b> biriktirir (→ <a href='#/g/zehir'>Karbonmonoksit</a>). Risk grubu: 65 yaş üstü, çocuklar, zayıf kişiler.")+cd("tip","<b>Hipotermi paketi:</b> Kişiyi alttan üste katman katman sar. Yere mat, yaprak ya da karton ser; üstüne uyku tulumunu aç. Kuru giysiler giydirdiğin kişiyi tuluma yatır. Bezle sarılı <b>ılık</b> su şişelerini gövdesine koy; şişeler deriye değmesin, 15 dakikada bir cildini kontrol et. Sonra tulumun dışını naylonla ya da brandayla tamamen sar; yalnızca yüzü açık kalsın.")+
 cd("warn","<b>Donma:</b> <u>Donmuş yeri ovma, ateşe ya da sobaya tutma, donmuş ayakla yürütme.</u> Islak giysiyi değiştir. <u>Yeniden donma riski varken ısıtmaya başlama;</u> güvenli, sıcak yerde ılık suda (37–39 °C, elin rahat durduğu ılıklık) veya koltuk altında, avuç içinde <b>en az 30 dk</b> ısıt. Bilinci açıksa sıcak içecek ver. <u>Alkol ve sigara verme.</u>")},
{id:"sicak",cat:"ilk",sos:1,ic:"sun",t:"Sıcak çarpması",d:"Hemen soğut",h:
 '<div class="tw"><table><tr><th></th><th>Sıcak bitkinliği</th><th>Sıcak çarpması (ACİL)</th></tr><tr><td>Cilt</td><td>Terli, soluk</td><td>Sıcak, kırmızı; terleme durabilir</td></tr><tr><td>Bilinç</td><td>Normal; baş ağrısı, bulantı olabilir</td><td>Zihin bulanık (şaşkın), saldırgan davranış, nöbet ya da bayılma</td></tr><tr><td>Ne yap</td><td>Gölgeye al, yatır, bacaklarını kaldır. Tuzlu-şekerli sıvı içir: <b>ORS</b> (ağızdan sıvı-tuz karışımı). Tarifi: 1 L temiz suya 6 silme çay kaşığı şeker ve yarım silme çay kaşığı tuz.</td><td><b>Önce soğut, sonra taşı:</b> Serin yere al, üstünü ıslatıp yelpazele; koltuk altlarına, kasıklarına ve boynuna soğuk koy. Mümkünse boynuna kadar soğuk suya sok (başı suyun dışında kalsın, biri sürekli tutsun). 112\'yi ara. Bilinci yerinde ve yutabiliyorsa su ver.</td></tr></table></div>'+
 cd("warn","<b>Terliyor olması sıcak çarpmasını dışlamaz:</b> efor sırasındaki sıcak çarpmasında kişi bol terlerken çökebilir. Zihni bulanıklaşan (şaşkın, saldırgan, sarhoş gibi davranan) kişide sıcak çarpması var kabul et. Bilinç ve davranış düzelene kadar soğut; ateş ölçebiliyorsan <b>38–39 °C</b>'ye inince soğutmayı bırak (fazla soğutmak da zararlıdır).")+cd("info","<b>Hiponatremi (kanda tuz düşüklüğü):</b> Çok terleyip yalnızca düz su içen kişide görülür. Önce bulantı, kramp, zihin bulanıklığı ve peltek konuşma başlar; sonra nöbet gelebilir. Belirtileri susuzluğa benzer. Korunmak için tuzlu atıştırmalık ye ya da suya bir tutam tuz ekle.")+cd("tip","<b>Korunmak için:</b> Yazın şafakta ve akşamüstü yürü (güneşin yakıcı ışınlarının ~%80'i 09.00–15.00 arasında gelir). Gevşek, açık renkli, uzun kollu giysi ve geniş şapka giy; boynuna ıslak bandana bağla. Saatte 0,5–1 L su iç, tuzlu bir şeyle birlikte. <b>Hedef renksiz idrardır</b>; koyu sarı idrar alarm işaretidir. Güneş yanığı terlemeyi azaltır: güneş kremi sür.")},
{id:"yilan",cat:"ilk",sos:1,ic:"snake",t:"Yılan, akrep, böcek",d:"Sabitle, kesme, emme",h:
 st(["Yılandan uzaklaş (2 boy mesafe). Öldürmeye/yakalamaya çalışma; fotoğrafı yeter.",
 "Kişiyi <b>sakin ve hareketsiz</b> tut; yürümesi gerekiyorsa yavaş.",
 "Yüzük, saat, sıkı giysileri çıkar (şişer).",
 "Isırılan uzvu atel ile sabitle, kalp seviyesinde veya biraz altında tut.",
 "Saati ve şişliğin sınırını kalemle işaretle (ilerlemeyi izlemek için).",
 "Hastaneye ulaştır — panzehir sadece orada. 112 / UZEM Zehir Danışma <b>114</b>."],true)+
 cd("warn","<b>YAPMA:</b> Kesmek, ağızla emmek, turnike/sıkı bağ, buz, alkol, yara üstünde ateş/elektrik. Bunların hepsi zararlıdır.")+
 cd("info","Türkiye'de zehirli yılanlar engerek (Vipera) türleridir: üçgen baş, dik göz bebeği, sırtında zikzak desen. Isırıkların bir kısmı \"kuru\"dur (zehir yok) ama her ısırık hastanelik kabul edilir. Akrep: soğuk uygula, uzvu sabitle; çocuk ve yaşlıda hastaneye. Arı: iğneyi tırnakla kazıyarak çıkar; boğazda şişme/nefes darlığı = anafilaksi → 112, kişinin adrenalin kalemi varsa kapağını aç, uyluğun dış yüzüne giysinin üstünden bastır, 10 sn bekle, bölgeyi ov; düzelme yoksa <b>5 dk sonra</b> ikincisini uygula. Ağız/boğazda sokma: küçük yudumlarla soğuk su. Arı iğnesini sıkmadan, kart veya bıçak sırtıyla <b>yana kazıyarak</b> çıkar."),
 src:"T.C. Sağlık Bakanlığı UZEM; Türk Kızılay"},
{id:"yara",cat:"ilk",ic:"bandage",t:"Yara bakımı & enfeksiyon",d:"Temizle, ört, izle",h:
 st(["Kanamayı durdur.","<b>Yarayı bol temiz suyla yıka:</b> En az 1 litre su kullan; suyu şırıngayla ya da delik açtığın bir poşetle basınçlı akıt. Kiri ve yabancı cisimleri çıkar.","Yaranın çevresini sabunla temizle. <u>Yaranın içine alkol ya da tentürdiyot dökme</u>: dokuyu öldürür. Seyreltilmiş povidon iyot kullanabilirsin.","Yaranın kenarları birbirine yakınsa kelebek bantla ya da steril yara bandıyla (strip) birbirine yaklaştır. <u><b>Kirli yaranın kenarlarını birleştirme</b></u>: yarayı açık bırak, üstünü nemli gazlı bezle ört, bezi her gün değiştir.","Yarayı her gün kontrol et."])+
 cd("warn","<b>Enfeksiyon işaretleri:</b> artan kızarıklık, sıcaklık, şişlik, zonklayan ağrı, irin, kötü koku, yaradan yukarı doğru uzanan <b>kırmızı çizgi</b> ve ateş. Kırmızı çizgi görürsen ya da ateş çıkarsa hemen tıbbi yardım al. Tetanoz aşını (10 yılda bir) şimdiden yaptır.")},
{id:"susuzluk",cat:"ilk",ic:"drop",t:"İshal ve sıvı kaybı",d:"Evde ORS: ağızdan sıvı-tuz karışımı",h:
 cd("tip","<b>Evde ORS (ağızdan sıvı-tuz karışımı), Dünya Sağlık Örgütü (DSÖ) tarifi:</b> 1 litre temiz su + <b>6 silme çay kaşığı şeker</b> + <b>yarım silme çay kaşığı tuz</b>. Tadı gözyaşından tuzlu olmamalı. Her sulu dışkıdan sonra yetişkin 1–2 su bardağı içsin, yudum yudum.")+
 "<p><b>Hastaneye götür:</b> 8 saattir idrara çıkmıyorsa, gözleri çökmüşse, sıkıştırılan deri hemen geri düzelmiyorsa, ishal kanlıysa, ateşi yüksekse ya da kusması durmuyorsa. Hasta bebek ya da yaşlıysa daha erken götür.</p><p>Grupta ishal varsa tuvalet ve el yıkama düzeni bozulmuştur: hijyeni hemen sıkılaştır (→ <a href='#/g/sanitasyon'>Tuvalet ve hijyen</a>).</p>"},
{id:"ayak",cat:"ilk",ic:"steps",t:"Ayak bakımı & su toplanması",d:"Yürüyen ekibin 1 numaralı sorunu",h:
 "<p>3–5 günlük yürüyüşte ekibi en çok durduran şey ayaktır. Ordular bunu iyi bilir.</p>"+
 st(["<b>Ayağında sıcaklık ya da sürtünme hissettiğin anda dur;</b> su toplamasını bekleme. O noktaya bant yapıştır (kâğıt bant, ilk yardım bandı; yoksa koli bandı).","Yün ya da sentetik çorap giy; ıslanınca değiştir. Islak çifti boynuna asarak ya da koynunda kurut.","Her molada ayakkabılarını çıkarıp ayaklarını havalandır. Gece kuru çorap giy.","<b>Su toplandıysa (sürtünme kabarcığı):</b> Küçükse <u>patlatma</u>; üstüne bant yapıştır, kendiliğinden geçer. Büyük, gergin ve yürümeni engelliyorsa boşaltabilirsin: iğneyi alevde kızdır, soğumasını bekle; kabarcığın kenarından küçük bir delik aç, karşı taraftan bastırarak sıvıyı akıt. <u>Üstteki deriyi koparma</u>: o deri doğal bir yara bandıdır. Temiz bezle ya da su toplama bandıyla ört.","Dar ayakkabı ya da iki kat çorap ayağı sıkar; kan dolaşımı azalır, ayak üşür. Ayak günde ~120 ml terler: kuru yedek çorabı kilitli poşette taşı.","Tırnaklarını düz kes. <u>Yeni ayakkabıyla uzun yürüyüşe çıkma</u>: önce kısa yürüyüşlerle alıştır."])+cd("warn","<b>Yanık kabarcığı farklıdır:</b> <u>yanıkta oluşan kabarcığı hiçbir zaman delme, patlatma</u>; mikrop kapar. → <a href='#/g/yanik'>Yanık</a>")},
{id:"co",cat:"ilk",ic:"bio",t:"Karbonmonoksit zehirlenmesi",d:"Kapalı alanda ateş/soba/jeneratör",h:
 cd("warn","Afetten sonraki kış aylarında ölümlerin önemli bir nedeni karbonmonoksittir (CO). Kaynağı kapalı odada yakılan mangal, soba, tüplü ısıtıcı, çalışan araba motoru ya da jeneratördür. <b>Karbonmonoksitin kokusu ve rengi yoktur.</b>")+
 "<p><b>Belirtiler:</b> Baş ağrısı, baş dönmesi, bulantı, uyku hâli. Aynı ortamdaki herkeste birden başlar.</p><p><b>Ne yap:</b> Kişiyi hemen temiz havaya çıkar, kapı ve pencereleri aç, 112'yi ara. İçeri girmen gerekiyorsa kapıyı sonuna kadar aç, ağzını ve burnunu ıslak bezle kapat, dışarıda 2–3 derin nefes al, nefesini tutarak gir ve kişiyi hızla dışarı çek. <u>Elektrik düğmesine dokunma, ateş yakma.</u> Bilinci kapalı ama nefes alıyorsa derlenme pozisyonuna al; nefes yoksa KPR'ye başla.</p><p><b>Korunmak için:</b> Jeneratörü en az 6 m uzakta, açık havada çalıştır. <u>Mangalı ve tüplü ısıtıcıyı hiçbir zaman kapalı alanda yakma.</u> Sobanın bacası iyi çekiyor mu, kontrol et; baca tıkalıysa ya da duman geri tepiyorsa sobayı yakma. <u>Çadırda ve arabada ateş yakma.</u> Uyumadan önce ısıtıcıyı kapat. Mümkünse pilli karbonmonoksit dedektörü kullan.</p>"},

/* ================= TEMELLER ================= */
{id:"oncelik",cat:"temel",ic:"star",t:"Öncelikler: 3'ler kuralı",d:"Neyi önce yapmalı?",h:
 F.rule3+"<p>Wiseman'ın önerdiği sıra (SAS hayatta kalma el kitabı; SAS: İngiliz özel kuvvetleri): önce <b>korun</b>, sonra <b>yerini belli et ve işaret ver</b>, sonra <b>su</b> bul, en son <b>yiyecek</b> ara. Korunmak; ilk yardım, barınak, ısınma ve tehlikeden uzaklaşma demektir.</p>"+
 cd("info","<b>Çantanın çekirdeği, 5 temel parça</b> (Canterbury'nin \"5 C\" kuralı): <b>kesici</b> (bıçak), <b>ateş yakıcı</b> (çakmak, ateş çubuğu), <b>örtü</b> (branda, acil battaniye), <b>kap</b> (su kaynatabileceğin metal şişe ya da kap), <b>ip</b> (paraşüt ipi). Doğada yerine koyması en zor şeyler bunlardır. <small>(İngilizce adları C ile başlar: Cutting, Combustion, Cover, Container, Cordage.)</small>")+
 "<h2>SURVIVAL kuralı (ABD Ordusu el kitabı FM 3-05.70)</h2><p>İngilizce <i>survival</i> (hayatta kalma) sözcüğünün harfleriyle akılda tutulan sekiz kural:</p><ul><li><b>S</b>: Durumu, çevreni, kendini ve ekipmanını değerlendir. <small>(Size up)</small></li><li><b>U</b>: <u>Acele etme</u>; aceleyle yapılan iş hata getirir. <small>(Undue haste makes waste)</small></li><li><b>R</b>: Nerede olduğunu her an bil. <small>(Remember where you are)</small></li><li><b>V</b>: Korkuyu ve paniği yen. <small>(Vanquish fear and panic)</small></li><li><b>I</b>: Elindekiyle doğaçla, çözüm üret. <small>(Improvise)</small></li><li><b>V</b>: Yaşamaya değer ver, <u>pes etme</u>. <small>(Value living)</small></li><li><b>A</b>: Yerel halkın nasıl yaşadığını izle, onlardan öğren. <small>(Act like the natives)</small></li><li><b>L</b>: Aklını kullan, beceri öğren. <small>(Live by your wits)</small></li></ul>",
 src:"FM 3-05.70; Wiseman, SAS Survival Handbook; Canterbury, Bushcraft 101"},
{id:"stop",cat:"temel",ic:"brain",t:"STOP & ilk 15 dakika",d:"Kaybolunca / kriz başlayınca",h:
 F.stop+st(["<b>Dur:</b> Hareket etmeyi bırak. İnsanlar çoğunlukla \"Biraz daha ileri gideyim\" derken kaybolur.","<b>Düşün:</b> Yerini en son nerede kesin olarak biliyordun? Seni kim, ne zaman arayacak?","<b>Gözle:</b> Havaya, kalan gün ışığına, ekibin sağlığına, suya, ekipmana ve tehlikelere bak.","<b>Planla:</b> Seni arayan varsa, yaralı varsa ya da hava kötüyse <b>olduğun yerde kal</b>. Nerede olduğunu biliyorsan ve bulunduğun yerde kalmanı sağlayacak kaynak yoksa <b>git</b>. Kararını yaz, herkese söyle.","<b>Uygula:</b> Uygulanmayan plan işe yaramaz. İlk adımı hemen at."])},
{id:"psiko",cat:"temel",ic:"brain",t:"Hayatta kalma psikolojisi",d:"Afet beyni, panik, liderlik",h:
 "<p><b>Amanda Ripley, \"The Unthinkable\" kitabı:</b> Afette insanlar üç evreden geçer: önce olanı <b>inkâr eder</b>, sonra <b>düşünüp taşınır</b>, en son <b>karar anına</b> gelir. Çoğu insan panik yapmaz; tersine fazla sakin ya da donuk kalır ve normal hayatını sürdürmeye çalışır (eşya toplar, telefon eder). İnsanı kurtaran, önceden prova edilmiş basit bir plandır.</p>"+
 "<p><b>Laurence Gonzales, \"Deep Survival\" kitabı:</b> Hayatta kalanlar durumu hızla kabul eder (\"Bu oldu. Şimdi ne yapıyorum?\"). Küçük hedefler koyar (\"Yalnızca şu tepeye kadar\"), espriyi ve rutini korur, kendinden başka birine yardım eder. Kontrol altındaki öfke yakıt olabilir; inkâr ise öldürür.</p>"+
 cd("tip","<b>Nefesini uzun ver:</b> Burnundan yavaşça, karnına doğru nefes al. Ağzından <b>uzun ve yavaş</b> ver (iç çeker gibi). Nefesi uzun vermek vücudun sakinleşme refleksini çalıştırır; adrenalin tavan yaptıktan sonra sakinleşmenin en hızlı yoludur.")+cd("tip","<b>Kutu nefes (4-4-4-4):</b> 4 saniye nefes al, 4 saniye tut, 4 saniye ver, 4 saniye tut. Bunu 4 kez tekrarla. Özel kuvvetler ve polis, stres altında karar vermek için bu yöntemi kullanır; aikido ve qigong nefes çalışması da aynıdır. Kalp hızını düşürür, parmaklarla yapılan ince işleri yeniden yapabilmeni sağlar.")+
 "<h2>Stres altında beden</h2><ul><li>Adrenalin nabzı saniyeler içinde 70'ten 200'e çıkarabilir. Nabız ~115'i geçince <b>ince el işleri</b> (düğme iliklemek, kibrit yakmak, düğüm atmak), ~145'i geçince karmaşık beceriler bozulur. Büyük kas hareketleri ise çalışmaya devam eder.</li><li>Görüşün daralması (tünel görüş), sesleri duyamamak ve zamanın yavaşlamış gibi gelmesi normaldir.</li><li><b>Hazırlık kuralı:</b> Her kritik işin, titreyen elle de yapılabilecek kaba bir yedeği olsun: kibritin yanında ateş çubuğu, küçük fermuar tutamağına büyük bir çekme ipi.</li><li>Korku dört yoldan öldürür: metabolizmayı yavaşlatır (hipotermi hızlanır), el ve ayaklara giden kanı azaltır, karar verme yeteneğini bozar, el becerisini yok eder.</li><li>Her adrenalin patlamasının ardından derin bir yorgunluk (çöküş) gelir. Büyük bir olaydan (artçı sarsıntı, gece alarmı) sonra dinlenmeyi planla.</li></ul><h2>Kararı bozan tuzaklar</h2><ul><li><b>Eve dönme telaşı:</b> Bir an önce varmak için gerçekçi olmayan bir zaman planına inatla uymak.</li><li><b>Verilmiş sözler:</b> Birine \"Akşama dönerim\" dediysen, sözünü tutmak için kötü bir karar verebilirsin (hava kararırken yola çıkmak gibi). Söz değil, güvenlik önce gelir.</li><li><b>İnatçılık:</b> Yanlış gittiği belli olan planı bırakmamak.</li><li>Can sıkıntısı, yalnızlık, gevşeme ve rahat etme isteği de kararı bozar.</li></ul><h2>Afetin evreleri</h2><p>Afet anında insanların ~%10–20'si sakin kalır, ~%75'e kadarı şaşkın ve donuktur, ~%10–25'i aşırı tepki verir. Akıl genelde ~3 saat içinde (en geç 3 günde) yerine gelir. Psikolojik şoka bağlı ölümlerin çoğu ilk 3 günde olur. Donup kalmış insanlara <b>kısa, net, emir kipinde</b> komut ver: \"Ayakkabını giy. Çantayı al. Benimle gel.\"</p><h2>Uyku</h2><ul><li>Zor koşullarda bile günde en az ~4,5–5,5 saat uyu; normal ihtiyaç 7–8 saattir. 20 dakikalık şekerleme bile toparlar.</li><li>Uyandıktan sonra önemli bir karar vermeden önce <b>5–10 dakika</b> yürü; uyku sersemliğinin geçmesini bekle.</li><li>Uykusuzluk en çok sürekli dikkat gerektiren işi (nöbet) bozar: nöbetçi konuşsun, hareket etsin, su içsin.</li></ul><h2>Grupta</h2><ul><li>Tek lider, net görev dağılımı (su, ateş, nöbet, ilk yardım, navigasyon).</li><li>Her akşam ekiple 5 dakikalık durum toplantısı yap: Bugün ne iyi gitti? Yarın ne yapılacak? Kimin sorunu var?</li><li>Rutin morali korur: her gün aynı saatte kalk, ye, nöbet değiştir.</li><li>Uyku: Nöbetleri 2 saatlik tut; herkes toplam en az 6 saat uyusun. Uykusuzluk, karar hatalarının bir numaralı sebebidir.</li><li>Korku belirtilerini erken fark et (ağız kuruluğu, titrek ses, aşırı konuşma ya da hiç konuşmama, unutkanlık); o kişiye iyi yaptığı bir görev ver.</li><li>Lider korksa bile <b>sakin görünsün</b>; düzeni nazik ama kararlı biçimde korusun.</li><li>Çocuklara ve yaşlılara da görev ver; işe yaradığını hissetmek korkuyu azaltır.</li></ul>",
 src:"Ripley, The Unthinkable; Gonzales, Deep Survival; Lundin, 98.6 Degrees; DK Survival Handbook"},
{id:"zanshin",cat:"temel",ic:"shield",t:"Farkındalık: renk kodları",d:"Cooper kodu & zanshin",h:
 "<p>Jeff Cooper'ın durumsal farkındalık (çevrende olanı fark etme) renk kodları, budodaki (Japon dövüş sanatları) <b>zanshin</b> (sürekli uyanık zihin) ile aynı fikre dayanır:</p>"+
 '<div class="tw"><table><tr><th>Kod</th><th>Hâl</th></tr><tr><td style="color:#ddd">Beyaz</td><td>Çevrenden habersizsin: telefona dalmışsın, kulağında kulaklık var. <u>Kriz anında hiçbir zaman bu hâlde olma.</u></td></tr><tr><td style="color:#d9c34b">Sarı</td><td>Rahatsın ama uyanıksın; çevreyi gözlüyorsun. Kriz boyunca hep bu hâlde ol.</td></tr><tr><td style="color:#e08a2e">Turuncu</td><td>Belirli bir tehdit fark ettin; plan yapıyorsun (\"Şunu yaparsa ben de şunu yaparım\").</td></tr><tr><td style="color:#d0453a">Kırmızı</td><td>Harekete geç: kaç, saklan, gerekirse kendini savun.</td></tr></table></div>'+
 cd("tip","Kalabalık, öfkeli bir grup ya da kontrol noktası görürsen önce <b>mesafeni koru ve yolunu değiştir</b>. Doğru mesafeyi korumak (budoda <i>ma-ai</i>) her zaman kavgadan ucuzdur."),src:"Jeff Cooper; budo zanshin/ma-ai"},

/* ================= SU ================= */
{id:"subul",cat:"su",ic:"drop",t:"Su bulma (İç Anadolu)",d:"Bozkırda nereye bakmalı",h:
 "<p>İç Anadolu yarı kuraktır: yaz sonunda birçok dere kurur. Su bulmak <b>bilgi ve plan</b> ister; şansa bırakma.</p><ul>"+
 "<li><b>Köy çeşmeleri ve pınarlar:</b> Haritada köy görüyorsan orada büyük ihtimalle çeşme vardır. Kaynaktan çıkan su genelde temizdir ama yine de arıt.</li>"+
 "<li><b>Yeşil çizgi:</b> Bozkırda söğüt, kavak, sazlık ya da yeşil ot şeridi görürsen orada yeraltı suyu ya da dere vardır. Bu şerit uzaktan görülür.</li>"+
 "<li><b>Vadi tabanı ve dere yatağı:</b> Kuru dere yatağının dış kıvrımında 50–60 cm kaz (su en son orada kurur). Nem çıkarsa bekle; su yavaş yavaş sızar.</li>"+
 "<li><b>Hayvan izleri, sinekler, kuşlar:</b> Sabah ve akşam kuşların alçaktan uçtuğu yöne bak; yoğun hayvan patikalarının birleştiği yeri ara.</li>"+
 "<li><b>Barajlar ve göller:</b> Çoğu ilde vardır, ama suya yerleşim ya da tarım atığı karışmış olabilir: mutlaka arıt.</li>"+
 "<li><b>Yağmur ve kar:</b> Branda ya da poşetle topla. <u><b>Karı eritmeden yeme</b></u>: vücut ısını çalar. Önce erit: koyu renkli poşette güneşte ya da ateşte; ateşte eritirken kabın dibine biraz su koy.</li>"+
 "<li><b>Şehirde:</b> Termosifonda ya da kombi deposunda 50–100 L su olur: önce elektriği ve gazı kapat, sonra alttan boşalt. Klozetin arkasındaki depodaki (rezervuar) su kullanılabilir; <u>klozet çanağındaki suyu kullanma</u>. Tesisatta kalan suyu binanın en alttaki musluğundan al. Apartmanın su deposuna da bak.</li></ul>"+
 cd("warn","Su durgunsa, yeşilse, köpüklüyse, yağ ya da kimyasal kokuyorsa veya çevresinde ölü hayvan varsa <u>o suyu kullanma</u>. Maden, sanayi ve tarım ilacı kirliliğini ne kaynatmak ne de klor giderir.")},
{id:"suaritma",cat:"su",ic:"drop",t:"Su arıtma",d:"Kaynatma, klor, filtre, güneş",h:
 '<div class="tw"><table><tr><th>Yöntem</th><th>Nasıl</th><th>Not</th></tr>'+
 '<tr><td><b>Kaynatma</b></td><td>Su fokurdamaya başladıktan sonra 1 dakika kaynat (2000 m\'nin üstünde 3 dakika).</td><td>En güvenilir yöntem. Yakıt ister.</td></tr>'+
 '<tr><td><b>Çamaşır suyu</b></td><td>Kokusuz, %4–6\'lık çamaşır suyundan litreye 2 damla koy; su bulanıksa 4 damla. 30 dakika bekle.</td><td>Ucuz ve hafif. Araç › Su arıtma, damla sayısını hesaplar.</td></tr>'+
 '<tr><td><b>İyot (%2 tentür)</b></td><td>Berrak suya litre başına 5 damla, bulanık ya da soğuk suya 10 damla koy. Ilık suda 30 dakika, <b>soğuk suda 2–3 saat</b> bekle.</td><td>Bakterileri, virüsleri ve Giardia parazitini öldürür; <b>Cryptosporidium parazitine etkisizdir</b>. Ayrıntısı aşağıda.</td></tr>'+'<tr><td><b>Klor ya da iyot tableti</b></td><td>Prospektüsteki gibi kullan (genelde litreye 1 tablet, 30 dakika bekleme; soğuk suda iki katı bekle).</td><td>Çantada taşımak için en pratiği. Son kullanma tarihine bak.</td></tr>'+'<tr><td><b>Potasyum permanganat</b></td><td>Su <b>açık pembe</b> olana kadar birkaç kristal at; en az 30 dakika bekle.</td><td>Koyu pembe ya da mor çözelti yalnızca yara yıkamak içindir. Şekerle karışırsa alev alabilir: dikkat et.</td></tr>'+
 '<tr><td><b>Filtre</b> (taşınabilir pipet ya da şişe tipi su filtresi)</td><td>Bakterileri ve tek hücreli parazitleri (protozoa) tutar.</td><td>Virüsleri tutmaz: suya şehir ya da insan atığı karışmış olabilirse filtreden sonra klor da ekle.</td></tr>'+
 '<tr><td><b>Güneş</b> (SODIS: güneşle su arıtma)</td><td>Berrak suyu şeffaf PET şişeye doldur, 6 saat tam güneşte bırak (hava bulutluysa 2 gün).</td><td>Yakıt gerektirmeyen yedek yöntem. Kışın ve bulutlu havada etkisi azdır.</td></tr></table></div>'+
 "<h2>İyot ile arıtma</h2>"+H.steps("iodine","İyot ile su arıtma — adım adım")+cd("warn","<u><b>Şu kişiler iyot kullanmasın:</b></u> hamileler, tiroid hastaları, iyota (ya da kabuklu deniz ürünlerine) alerjisi olanlar. İyotlu suyu sürekli olarak en fazla birkaç hafta (~30 gün) iç. <u>Tentürdiyotu radyasyondan korunmak için potasyum iyodür yerine hiçbir zaman içme.</u>")+cd("info","<b>İki aşama kuralı:</b> Filtren virüsleri öldürmüyorsa önce suyu süz ya da filtrele, sonra kimyasal ekle veya kaynat. Hayvan otlatılan yerlerde (pınar, gölet) iyotun ve klorun yetmediği <b>Cryptosporidium</b> paraziti olabilir: orada filtreyle birlikte iyot kullan ya da suyu kaynat. Bulanık ve organik maddeli suda klor da çabuk tükenir: önce suyu mutlaka berraklaştır.")+F.filter+cd("tip","Önce suyu bezden ya da kahve filtresinden <b>süz</b>, çökelmeye bırak, sonra üstteki berrak kısmı al. Bulanık su bütün yöntemlerin etkisini düşürür. Temiz ve kirli kaplar karışmasın: kirli kabın ağzını kırmızı bantla işaretle."),src:"CDC; DSÖ; FM 3-05.70"},
{id:"sudepo",cat:"su",ic:"drop",t:"Su depolama & ihtiyaç",d:"Kişi başı ne kadar?",h:
 "<ul><li><b>İçme suyu:</b> Dinlenirken günde <b>en az 3 L</b> iç; sıcakta ve yüklü yürüyüşte çok daha fazlası gerekir. Lundin, yazın arazide kişi başı günde <b>10 L'ye</b> kadar planlamayı önerir; yoğun sıcakta saatte 1 L'den fazla ter atılabilir.</li><li>Günde <b>4 L</b> yalnızca <b>evde kalırken</b> en alt sınırdır; yürüyüşte bu yetmez.</li><li><b>Hedef, renksiz ya da açık renkli idrardır.</b> Susadıysan vücudunda zaten 1 L'den fazla su eksiktir. Lider her molada herkesin içip içmediğini kontrol etsin; insanlar su olsa bile az içer.</li><li>Yola çıkmadan önce herkes <b>1 L</b> içsin (hafif dolu hissedene kadar).</li><li>ABD afet kurumu FEMA'nın ve Kızılhaç'ın en alt sınırı: içme ve temel temizlik için <b>kişi başı günde ~4 L</b> (1 galon). Depremden sonra şebeke suyunun normale dönmesi 10–15 gün sürebilir. Örnek: <b>3 kişilik bir aile 14 gün için 168 L</b> su ister; bu da 19 L'lik 9 damacanadır.</li><li>Suyu gıdaya uygun, kapağı sağlam bidon ya da şişelerde, serin ve karanlık bir yerde sakla. Hazır şişe suyu son kullanma tarihine kadar dayanır; musluk suyuyla doldurduğun kapları <b>6 ayda bir</b> tazele.</li><li>Evdeysen kriz başlar başlamaz banyo küvetini doldur; bu suyu yalnızca temizlik ve sifon için kullan.</li></ul>"+
 cd("tip","<u>Suyu kısma</u>, terlemeyi azalt: gölgede dur, gündüz değil sabah ve akşam çalış, az konuş, burnundan nefes al. Su şişede değil vücutta saklanır: su varken iç.")},

/* ================= BARINAK ================= */
{id:"barinak",cat:"bar",ic:"tent",t:"Barınak yeri seçimi",d:"5 R kuralı",h:
 "<p>Barınağın görevi seni <b>sıcak</b> ve kuru tutmak, gerekirse gizlemektir. Barınağın yerini doğru seçmek, barınağın kendisinden daha önemlidir.</p><ul>"+
 "<li><b>Rüzgâr:</b> Barınağı tepenin rüzgâr almayan yamacına, kayalığın ya da ağaç kümesinin arkasına kur. <u>Sırtta ve tepede kamp yapma.</u></li>"+
 "<li><b>Rutubet ve su:</b> <u>Dere yatağında ve vadi tabanında kamp kurma</u>: sel gelebilir; gece soğuk hava vadi dibinde göl gibi birikir, en soğuk yer orasıdır. Sudan 60 m uzakta, biraz yüksekte, düz bir yer seç.</li>"+
 "<li><b>Risk (ölü dallar):</b> <u>Üstüne kuru dal ya da devrilen ağaç düşebilecek yere kurma.</u> Kaya düşebilecek yerlerden ve çığ yolundan da uzak dur.</li>"+
 "<li><b>Rahatsız edecek hayvanlar:</b> <u>Hayvan patikasının, karınca yuvasının ya da arı kovanının üstüne kurma.</u></li>"+
 "<li><b>Malzeme:</b> Odun, yaprak ve su yakında olsun.</li></ul>"+
 cd("info","<b>Gizlenmen gerekiyorsa:</b> yoldan görünmeyen, girişi işlek patikaya bakmayan bir yer seç. Ateşi çukurda yak, ışığını bezle ya da brandayla perdele. <u>Eşyalarını etrafa dağıtma</u>; sabah iz bırakmadan topla.")},
{id:"brandabar",cat:"bar",ic:"tent",t:"Branda barınakları",d:"Tek eğim, A-çatı, yaprak kulübe",h:H.steps("aframe","A-çatı branda")+H.steps("leanto","Tek eğim + yansıtıcı ateş")+H.steps("debris","Yaprak kulübe (brandasız)")+
 cd("tip","Gergi düğümü ve kazık bağı yeterlidir (Düğümler bölümüne bak). Brandanın köşelerine önceden 2'şer metre ip bağla. 3×3 m'lik bir branda 2–3 kişiye barınak olur.")},
{id:"isi",cat:"bar",ic:"thermo",t:"Isı kaybı & giyinme",d:"Pamuk öldürür",h:
 "<p><b>Ana kural: vücudunun iç (çekirdek) ısısını 37 °C'de tut.</b> Doğada ölenlerin çoğu soğuktan ya da sıcaktan, yani iç ısının bozulmasından ölür. İlk savunma hattın <b>giysi ve sudur</b>; ateş ikinci sıradadır.</p>"+'<div class="tw"><table><tr><th>Isı kaybı yolu</th><th>Ne zaman artar</th><th>Önlem</th></tr><tr><td><b>Işınım</b></td><td>Baş, boyun ve yüz açıkken; çıplak vücutta ısı kaybının ~%45\'i bu yoldan olur</td><td>Bere tak, boyunluk giy. Cenin gibi kıvrılmak kaybı ~%35 azaltır.</td></tr><tr><td><b>Taşınım</b></td><td>Rüzgârda; ~14 km/sa rüzgâr giysinin yalıtımını ~%30 düşürür</td><td>Rüzgârlık ya da rüzgâr kesici giy; bir siperin arkasına geç.</td></tr><tr><td><b>Buharlaşma</b></td><td>Terleyince ve giysi ıslakken; ıslak giysiyle yürümek yalıtımı ~%85 düşürür</td><td>Terlemeden önce bir kat çıkar; ıslak giysiyi kurusuyla değiştir.</td></tr><tr><td><b>İletim</b></td><td>Ayaktayken az (~%2); <b>yatarken ve otururken en büyük</b> kayıp budur. Su, ısıyı havadan ~25 kat hızlı çeker.</td><td><u>Çıplak zemine hiçbir zaman yatma, oturma</u>; altına en az 15 cm yalıtım koy.</td></tr><tr><td><b>Solunum</b></td><td>Çok soğuk havada; nefesle günde litrelerce su kaybedilir</td><td>Burnundan nefes al, ağzını atkıyla ört.</td></tr></table></div>'+"<p>Vücut sabaha karşı en soğuk hâlindedir: <b>şafak öncesi</b> en riskli saattir. En uyanık nöbetçiyi ve sıcak içeceği o saate ayır.</p>"+F.layers+
 "<ul><li><b>Zemin:</b> <u>Hiçbir zaman doğrudan toprağa yatma</u>; altına en az 15 cm dal ve yaprak, mat, karton ya da sırt çantası koy.</li><li><b>Baş ve boyun:</b> Bere ve boyunluk ısı kaybını çok azaltır.</li><li><b>Kuru kal:</b> Terlemeden önce bir kat çıkar (\"serin başla\"). Islak giysiyi hemen kurusuyla değiştir.</li><li><b>Giyinmenin dört kuralı</b> (İngilizce baş harfleriyle COLD): Giysini <b>temiz</b> tut, temiz giysi daha iyi yalıtır (Clean). <u><b>Aşırı ısınıp terleme</b></u> (Overheating). <b>Bol ve kat kat</b> giyin (Loose, Layers). <b>Kuru</b> kal (Dry).</li><li><b>Kumaşlar:</b> Pamuk ıslanınca yalıtımının ~%90'ını kaybeder (kuru yaz sıcağında ise iyi bir seçimdir). Yün ıslakken de ısıtır ve ateş yanında erimez. Polipropilen (sentetik iç çamaşırı kumaşı) ateş kıvılcımıyla erir, deriye yapışır. Kaz tüyü ıslanınca işe yaramaz.</li><li><b>Üfleme testi:</b> Kumaşın içinden üfle. Nefesini öbür tarafta hissediyorsan kumaş hava geçirir; hissetmiyorsan teri içeride tutar: sık sık havalandır.</li><li><b>Kendi ısını tut:</b> Dinlenen vücut ~100 watt, yoğun eforda 1000 watt'tan fazla ısı üretir. Bu ısıyı giysiyle tutmak, ateş yakmaktan daha ucuzdur.</li><li><b>Gece:</b> Yatmadan önce yağlı bir şey ye, sıcak su şişesini tulumun içine koy, ekip yan yana yatsın. <u>İdrarını tutma</u>: vücut onu sıcak tutmak için ısı harcar.</li></ul>",src:"Lundin, 98.6 Degrees"},
{id:"evisi",cat:"bar",ic:"home",t:"Evde ısısız kış",d:"Elektrik + doğalgaz kesik",h:
 st(["Evin tek bir odasına çekil: güneye bakan, az pencereli, mümkünse evin iç tarafında kalan bir oda seç. Diğer odaların kapılarını kapat; kapıların altına havlu koy.","Pencereleri battaniye, köpük ya da kartonla kapat; camlara streç film ger (çift cam gibi yalıtır).","Odanın içine çadır kur ya da masanın üstüne battaniye örtüp altında uyu: küçük bir alan vücut ısısıyla çabuk ısınır.","Herkes aynı odada kalsın. Kat kat giyin, bereyle uyu.","Günde en az 2 kez sıcak yemek ye, sıcak bir şey iç. Tüp ocağı yalnızca havalandırılan yerde ve kısa süre yak.","Su boruları donmasın diye musluğu ince ince akıt ya da tesisatı boşalt."])+
 cd("warn","<u>Kapalı odada mangal, tüplü ısıtıcı ya da jeneratör çalıştırma</u>: karbonmonoksit (CO) zehirlenmesi öldürür. Ayrıntısı: Rehber › İlk yardım › Zehirlenme ve karbonmonoksit.")},

/* ================= ATEŞ ================= */
{id:"ates",cat:"ates",ic:"fire",t:"Ateş yakma",d:"Hazırlık %90, çakmak %10",h:
 H.steps("firebuild","Ateş yakma — adım adım")+st(["<b>Yeri hazırla:</b> Rüzgârdan korunan bir yer seç. 3 m çapındaki alanı kuru ottan ve daldan temizle. <u>Ocak taşlarını dereden alma</u>: ısınınca patlayabilir.","<b>Kav topla</b> (ilk alevi alan ince, kuru malzeme): kuru ot, çam iğnesi, çam reçinesi, kuşburnu çalısının içi, vazelinli pamuk (çantada taşınacak en iyi kav), kuru mantar, huş kabuğu.","<b>Çıra topla:</b> kurşun kalem kalınlığında kuru dallar. Ağaçta asılı kalmış ölü dallar yerdekilerden daha kurudur. Kuru dal kırılırken \"çıt\" diye ses çıkarır.","<b>Yakıt topla:</b> Başparmak kalınlığından başlayıp bilek ve kol kalınlığına kadar odun topla. Hepsini ateşi yakmadan önce hazır et.","Kavı tutuştur, çırayı çadır gibi üstüne diz. Alçaktan hafifçe üfle, ateşi yavaş yavaş büyüt.","Ateş <b>5 dakika kendi başına</b> yanabiliyorsa tutmuştur; kalın ve yaş odunu ancak o zaman ekle. Kışın, gece için gerekeceğini düşündüğün odunun <b>3 katını</b> topla."])+cd("info","<b>Kural:</b> Tutuşturmak için gerektiğini düşündüğün kav ve çıranın <b>10 katını</b> hazırla; kötü havada yalnızca 1–2 deneme şansın olur. Bütün odunlar ıslaksa kabuğunu soy ve odunu yar: içi genelde kurudur. Ateşi ıslak toprağın üstünde değil, yan yana dizdiğin yaş dallardan yaptığın bir zeminin üstünde yak. <u>Ağaç köklerinin üstünde ateş yakma</u>: ateş toprak altında ilerleyip günler sonra başka bir yerden çıkabilir.")+H.steps("firelays","Ateş düzenleri")+H.steps("ferro","Ateş çubuğu (ferro çubuk) kullanımı")+
 cd("tip","<b>Ateş çubuğu</b> (ferro çubuk) ıslakta da çalışır, binlerce kez kıvılcım verir: nasıl kullanılacağı <a href='#/g/atesalt'>Kibritsiz ve çakmaksız ateş</a> sayfasında. Çakmağı koynunda taşı: soğukta gazı çalışmaz. Mumlu kibrit yalnızca <b>nemden</b> korunur, su geçirmez değildir: su geçirmez kutuda sakla. <b>Üç ayrı ateş aracını üstünün üç ayrı yerinde</b> taşı (cep, çanta, boyun ipi). Islak havada kalın dalın kuru iç kısmını bıçakla ince ince yontarak \"tüy çubuk\" yap.")+
 cd("warn","Yazın ve sonbaharda bozkırda ve ormanda yangın riski çok yüksektir. <u>Ateşin başından hiçbir zaman ayrılma.</u> Söndürürken su dök, karıştır, yine su dök; elini üstüne tutarak sıcaklık kalmadığından emin ol. Ormanda ateş yakmak yasak olabilir; gerçek bir kriz yoksa kurallara uy."),src:"Kochanski, Bushcraft; Canterbury"},

/* ================= NAVİGASYON ================= */
{id:"pusula",cat:"nav",ic:"compass",t:"Harita & pusula",d:"Telefon ölünce kâğıt yaşar",h:
 st(["<b>Haritayı yönlendir:</b> Pusulayı haritaya koy. Haritanın kuzeyi ile iğne aynı yönü gösterene kadar haritayı çevir. Artık harita araziyle aynı yöne bakar.","<b>Kendini bul:</b> İki belirgin noktanın (tepe, kule, cami minaresi) kerterizini al, yani pusulayla yönünü derece olarak ölç. Bu iki yönü haritada çizgi olarak çiz; çizgilerin kesiştiği yer senin yerindir.","<b>Yön tut:</b> Hedefin kerterizini (derece olarak) al. O yönde ileride bir nesne (ağaç, kaya) seç ve ona kadar yürü. Sonra yeniden kerteriz alıp tekrarla.","<b>Engelin etrafından dolaş:</b> 90° sağa dön ve adımlarını sayarak yürü. Sonra eski yönüne dönüp engeli geçene kadar ilerle. Ardından 90° sola dön, saydığın kadar adım at ve yeniden eski yönünde yürü (dörtgen çizerek dolaşma).","<b>Bilerek sap:</b> Hedefin bir yolun ya da derenin üstündeyse, bilerek hedefin bir yanına doğru yürü. Yola ya da dereye varınca hangi yöne döneceğini bilirsin."])+"<h2>Teknikler</h2><ul><li><b>Korkuluk yöntemi:</b> Yol, dere ya da elektrik hattı gibi uzayıp giden bir çizgiyi izle.</li><li><b>Saldırı (yaklaşma) noktası:</b> Hedefin yakınındaki belirgin bir noktaya git. Oradan kerteriz alıp adımlarını sayarak hedefe yürü. Hedefi bulamazsan o noktaya geri dön ve yeniden dene.</li><li><b>Eş yükselti:</b> Tepeyi aşmak yerine aynı yükseklikte kalarak etrafından dolaş.</li><li><b>Geri kerteriz:</b> Geldiğin yönü bulmak için kerterize 180° ekle ya da 180° çıkar.</li><li><b>Konum bulma:</b> En az 1 km uzakta ve aralarında en az 40° açı olan iki noktanın kerterizini al. Üçüncü bir noktanın kerterizini de alırsan çizgiler küçük bir üçgen (hata üçgeni) oluşturur; sen o üçgenin içindesin.</li><li><u>Kerterizi arabanın, metal eşyanın, binanın ya da yüksek gerilim hattının yanında alma.</u></li></ul><h2>Süre ve mesafe</h2><ul><li><b>Naismith kuralı:</b> Düzde saatte 5 km yürünür. Her 300 m tırmanış için 30 dakika, dik inişte her 300 m için 10 dakika ekle. Yüklü grupta ve gece süreleri uzat.</li><li><b>Adım sayma:</b> Çoğu insan 100 m'de ~60 çift adım atar (çift adım: aynı ayağın her yere basışı). Kendi sayını 100 m'lik bir mesafede, çantalı ve çantasız ölç (Araç › Adım sayacı).</li><li>Şu 3 şeyi her zaman bil: nereden çıktın, hangi kerterizde yürüdün, ne kadar yürüdün. Bunları bilen kaybolmaz.</li></ul>"+
 cd("info","<b>Manyetik sapma:</b> Pusula iğnesi haritadaki kuzeyi değil, manyetik kuzeyi gösterir. Türkiye'nin her yerinde bu fark <b>5,5–7° doğu</b>dur ve yılda çok az değişir.⟦il: <b>{IL}</b> için yaklaşık <b>{SAPMA}°</b>.⟧ Pusuladan haritaya geçerken <b>{SAPMA}° ekle</b>; haritadan pusulaya geçerken <b>{SAPMA}° çıkar</b>. 10 km'de ~1 km fark eder; ters uygularsan hata iki katına çıkar.⟦!il: İlini seçersen burada iline göre değeri görürsün.⟧")+
 cd("tip","Telefona internetsiz çalışan bir harita uygulaması (ör. Organic Maps, OsmAnd) ve Türkiye haritasını önceden indirirsen harita internetsiz açılır; GPS uydudan çalışır, internete ihtiyaç duymaz. Yine de 1:100.000 ölçekli kâğıt harita ve sıvılı pusula ekip çantasında bulunsun.")},
{id:"gunes",cat:"nav",ic:"sun",t:"Güneş ve saatle yön",d:"Gölge çubuğu, saat yöntemi",h:
 F.shadow+F.watch+"<p>Güneş kabaca doğudan doğar, batıdan batar: kışın güneydoğudan doğup güneybatıdan, yazın kuzeydoğudan doğup kuzeybatıdan batar. Türkiye bütün yıl aynı saat dilimini (UTC+3) kullanır. Bu yüzden güneşin tam güneyde olduğu saat ülkenin batısında daha geç, doğusunda daha erkendir: Edirne'de yaklaşık <b>13.00–13.30</b>, Van'da <b>11.50–12.20</b>.⟦il: <b>{IL}</b> için yaklaşık <b>{OGLE}</b>.⟧ Bu saatte gölgen kuzeyi gösterir. Araç › Gün ışığı, doğuş ve batışı senin konumuna göre hesaplar.</p>"},
{id:"yildiz",cat:"nav",ic:"star",t:"Yıldız ve Ay ile yön",d:"Kutup Yıldızı, Avcı, Ay",h:
 F.stars+"<ul><li><b>Avcı (Orion) takımyıldızının kemeri:</b> Kemerin ortasındaki yıldız neredeyse tam doğudan doğar, tam batıdan batar. Avcı'nın kılıcı güneyi gösterir.</li><li><b>Ay:</b> Ay hilalken hilalin iki ucunu birleştiren bir çizgi düşün ve bu çizgiyi ufka kadar uzat. Çizginin ufka değdiği yer kabaca güneydir (kuzey yarımkürede).</li><li><b>Yıldız hareketi:</b> İki sabit noktanın (ör. iki çubuk) arasından bir yıldıza 15 dakika bak. Yıldız yükseliyorsa doğuya, alçalıyorsa batıya, sağa kayıyorsa güneye, sola kayıyorsa kuzeye bakıyorsun.</li></ul>"+
 cd("warn","\"Yosun ağacın kuzeyinde biter\", \"Karıncalar yuvayı güneye yapar\" gibi doğa işaretleri güvenilir değildir. <u>Yönü yalnızca bunlara bakarak belirleme</u>; bunları başka yöntemleri doğrulamak için kullan.")},
{id:"kayip",cat:"nav",ic:"map",t:"Kaybolursan",d:"Kal, işaret ver, akıllı ara",h:
 st(["STOP adımlarını uygula: dur, düşün, gözle, planla. Bulunduğun yeri bir bezle ya da taş yığınıyla işaretle.","<b>Ses ver:</b> Düdüğü bir dakika içinde <b>6 kez öttür, sonra 1 dakika sus</b> ve tekrarla (Alp imdat işareti). <b>3 öttürmeyle</b> cevap gelirse \"Duyduk, geliyoruz\" demektir. Bağırmak sesini çabuk tüketir; düdük sesi 1 km uzağa gider.","Daha uzağı görmek için güvenle çıkabileceğin bir tepe ya da yükselti varsa çık; oradan yerleşim yeri, yol ya da elektrik hattı ara.","Yol, elektrik hattı ya da dere bulursan onu izle. Dereyi aşağı doğru izlersen genelde bir yerleşime varırsın; ama kanyona ve şelaleye dikkat et.","<u>Gece hareket etme.</u> Hava kararmadan <b>3 saat önce</b> kamp kurmaya başla (kışın daha erken)."])},

/* ================= DÜĞÜMLER ================= */
{id:"dugum",cat:"dug",ic:"knot",t:"Temel düğümler — adım adım",d:"8 düğüm, her adım çizimli",h:
 "<p>Her düğümü <b>gözü kapalı ve eldivenle</b> en az 20 kez bağlayana kadar çalış. Kriz anında ellerin titrer, hava karanlıktır. Çizimlerde açık renkli bant <b>halatın ucunu</b>, kesik çizgili ok bir sonraki hareketi gösterir.</p>"+
 H.steps("bowline","1. Kazık düğümü (bowline): kaymayan ilmek")+
 H.steps("clove","2. Kazık bağı (clove hitch): direğe hızlı bağlama")+
 H.steps("roundturn","3. Volta + iki yarım bağ: yük altında bağlama")+
 H.steps("taut","4. Gergi düğümü: ayarlanabilir gergi")+
 H.steps("sheet","5. Ağ düğümü: iki halatı ekleme")+
 H.steps("reef","6. Camadan: sargı ve paket")+
 H.steps("prusik","7. Prusik: halat üstünde kayan tutamak")+
 H.steps("eight","8. Sekiz düğümü: uç kaçmasın")+
 cd("tip","<b>İp yönetimi:</b> 550 tipi paraşüt ipini (etikette \"550 paracord\" yazar) 10 m\'lik çilelere ayır: uzun tek parça dolanır, sonunda kesmek zorunda kalırsın. İpi iki yerde taşı: çantanda ve üstünde. Kırmızı ya da turuncu ip kolay kaybolmaz, işaret için de kullanılır. Kestiğin uçları alevle erit. Islanıp kuruyan yarım bağlar çözülmeyebilir: sonradan çözeceğin bağlarda son turu <b>fiyonk</b> (ilmekli bitiş) yap."),src:"DK Survival Handbook; standart düğüm teknikleri"}
];
})();

/* Rehber içeriği — bölüm 2: afetler, sinyal, kent/grup, yiyecek, hijyen */
(function(){
var H=window.HK,F=H.fig,st=H.st,cd=H.cd;
H.guide=H.guide.concat([
/* ================= AFETLER ================= */
{id:"deprem",cat:"afet",sos:1,ic:"quake",t:"Deprem anı",d:"Çök · Kapan · Tutun",h:
 st(["<b>ÇÖK:</b> Pencerelerden ve sabitlenmemiş ağır eşyalardan uzakta, sağlam bir eşyanın yanına ya da altına diz çök.","<b>KAPAN:</b> Sırtını pencereye dön, başını ve enseni kollarınla koru.","<b>TUTUN:</b> Sağlam eşyanın ayağını tut; <u>sarsıntı bitene kadar bırakma</u>. Tutacak bir şey yoksa bir elinle yere destek ol.","<u>Asansöre binme, merdivene ve balkona çıkma. Pencereden atlama. Kapı kasasının seni koruyacağına güvenme. Sarsıntı sırasında koşma.</u>","Dışarıdaysan binalardan, direklerden, camlardan ve tabelalardan uzak, açık bir alana git. Arabadaysan yolu kapatmadan kenara çek ve araçta kal. Köprü, üst geçit, direk ya da elektrik hattının yanındaysan araçtan in ve açık alana git. Tüneldeysen araçtan inip aracın yanına çök, başını koru."],true)+
 "<h2>Sonra</h2><ul><li>Ayakkabını giy, çantanı al. <u>Işık düğmesine dokunma, kibrit ya da çakmak yakma.</u></li><li>Gaz kokusu alırsan vanayı kapat, pencereleri aç ve dışarı çık. Ana vanadan kapatılan gazı <u>kendin açma</u>; bir yetkili açmalı.</li><li>Hasarlı binadan çıkarken elektriği, gazı ve suyu kapat. <u>Hasarlı binaya <b>geri girme</b>.</u></li><li>Telefonla yalnızca acil durumda ara; haber vermek için SMS gönder.</li><li>e-Devlet'ten önceden öğrendiğin toplanma alanına git.</li></ul>"+
 cd("info","Plan › Deprem senaryosu bölümünde enkaz altı ve ekip adımları var."),src:"AFAD Eğitim Dairesi; AFAD (AA, 2020); FEMA"},
{id:"sel",cat:"afet",ic:"wave",t:"Sel & taşkın",d:"Yüksek yere, suya girme",h:
 "<p>Ani sel çoğunlukla yaz sağanaklarından sonra, en çok dere yataklarında ve alt geçitlerde olur. Kuru dere yatağı en tehlikeli kamp yeridir.</p>"+
 st(["Uyarı varsa hemen yüksek bir yere çık; <u>eşya için geri dönme</u>.","<u><b>Akan suya girme.</b></u> 15 cm derinlikte akan su insanı, 30 cm derinlikte akan su arabayı sürükler.","Araç suda kaldıysa emniyet kemerini çöz, camı aç ya da kır, araçtan çık ve aracın tavanına çık.","Bodrumdan ve alt geçitlerden uzak dur. Elektrik kesilmediyse <u>suya dokunma</u>.","Sel suyu lağım suyu ve kimyasal madde taşır: yaralarını ört; sel suyuna değdikten sonra elini ve yüzünü temiz suyla yıka; sel suyuna değen yiyecekleri at."],true)},
{id:"yangin",cat:"afet",ic:"fire",t:"Orman & bina yangını",d:"Rüzgârın tersine, aşağıya",h:
 "<h2>Bina yangını</h2>"+st(["Kapıyı açmadan önce elinin tersiyle yokla; kapı sıcaksa <u>açma</u>.","Duman varsa eğilerek ya da sürünerek ilerle; ağzını ıslak bezle kapat.","<u>Asansöre binme.</u> Çıkamıyorsan kapının altını ıslak havluyla tıka, pencereden işaret ver."],true)+
 "<h2>Orman ve bozkır yangını</h2>"+st(["Rüzgârın yönüne bak: yangın rüzgârla ve <b>yokuş yukarı</b> çok hızlı ilerler. <u>Yangının üstündeki yamaca hiçbir zaman kaçma.</u>","Yanmış alana, yola, dereye, tarlaya ya da kayalığa yönel.","Kaçamıyorsan bitkisi az bir çukur ya da kayalık bul, yüzüstü yat, üstünü toprakla ya da yün, pamuk gibi doğal kumaşla ört (sentetik kumaş erir, deriye yapışır).","<u>Dumanı ve yangının uğultusunu görmezden gelme</u>; erkenden uzaklaş."],true)},
{id:"kbrn",cat:"afet",ic:"bio",t:"Kimyasal / nükleer / endüstriyel",d:"İçeri gir, içeride kal, dinle",h:
 cd("warn","Kimyasal, biyolojik, radyolojik ya da nükleer (KBRN) bir olayda ilk kural: <b>İÇERİ GİR · İÇERİDE KAL · DİNLE.</b> Yetkililer başka bir şey söylemedikçe dışarıda koşup kaçmaya çalışmak yapabileceğin en kötü şeydir.")+
 st(["En yakın sağlam binaya gir. Radyasyon tehlikesinde binanın ortasına ya da bodruma geç: beton ve toprak radyasyona karşı korur. Kimyasal gazda ise üst katlarda, penceresi az bir iç odaya çık: gazların çoğu havadan ağırdır, aşağıda toplanır.","Kapıları ve pencereleri kapat, klimayı ve havalandırmayı kapat, aralıkları naylon ve koli bandıyla kapat.","Dışarıdan geldiysen dış giysini kapıda çıkar, poşete koyup ağzını bağla ve dışarıda bırak: kirliliğin büyük kısmı böyle gider. Sonra sabun ve suyla yıkan. <u>Deriyi sertçe ovma, krem sürme.</u>","Radyoyu aç. Yetkililerden duyuru gelene kadar en az 24 saat içeride kal.","<b>Potasyum iyodür (iyot tableti)</b> yalnızca yetkililer söylerse alınır. Bu tablet yalnızca tiroid bezini radyoaktif iyottan korur; vücudun geri kalanını korumaz. <u>Kendi kendine iyot hapı alma, tentürdiyot içme.</u>"],true)+
 "<p><b>Kimyasal sızıntıda</b> (tren, tır, fabrika) rüzgârın geldiği yöne ya da yana doğru uzaklaş ve yüksek bir yere çık: zehirli gazların çoğu havadan ağırdır, çukurlarda toplanır. Koku alıyorsan, öksürük ya da gözlerinde yanma başladıysa oradan hemen uzaklaş.</p>",src:"FEMA; AFAD KBRN"},
{id:"kisfirtina",cat:"afet",ic:"snow",t:"Kar fırtınası & yolda kalma",d:"Araçta kal, egzozu aç",h:
 st(["Yolda kalırsan <b>araçta kal</b>: araç hem barınaktır hem de uzaktan görülen bir işarettir. Görüş yokken yürürsen kaybolursun.","Motoru saatte yalnızca 10 dakika çalıştır. Çalışırken pencereyi 1 cm arala ve <b>egzoz borusunun karla tıkanmadığını</b> kontrol et: tıkalı egzoz aracı karbonmonoksitle (kokusuz, zehirli gaz) doldurur.","Antene ya da kapıya renkli bir bez bağla; gece iç lambayı yak.","Herkes kat kat giyinsin, yan yana otursun, battaniyeye sarınsın. Kollarını ve bacaklarını hareket ettir.","<u>Kar yeme</u>; önce erit. Yakıtın yarısını dönüş için sakla."],true)},
{id:"sicakdalga",cat:"afet",ic:"sun",t:"Sıcak hava dalgası",d:"Su, gölge, zaman",h:"<ul><li>11.00–17.00 arası dışarıda ağır iş yapma. Açık renkli, bol, uzun kollu giysi ve geniş şapka giy.</li><li>Susamayı bekleme: saatte 0,5–1 L su iç, tuzlu bir şey de ye.</li><li>Yaşlılar, bebekler, kronik hastalar ve düzenli ilaç kullananlar risk altındadır: günde 2 kez yoklayıp hâllerini sor.</li><li>Evde gündüz perde ve kepenkleri kapalı tut; gece karşılıklı pencereleri açıp evi havalandır, ıslak çarşaf as.</li></ul>"},
{id:"salgin",cat:"afet",ic:"bio",t:"Salgın",d:"Mesafe, maske, el",h:"<ul><li>FFP2 (N95) maske tak, ellerini sabunla en az 20 saniye yıka, ortak yüzeylere elini sürme.</li><li>Ekipte hastalanan kişiyi ayrı bir yerde tut; ona tek kişi baksın, o da maske ve eldivenle.</li><li>Ateş, öksürük, ishal kaydı tut: kim, ne zaman, kaç derece.</li><li><u>Bardak, havlu ve yemek kabını kimseyle ortak kullanma</u>; herkesin kendi kabı olsun.</li></ul>"},

/* ================= SİNYAL & İLETİŞİM ================= */
{id:"isaret",cat:"sin",ic:"flash",t:"İşaret verme",d:"3'lü kural, ayna, yer işaretleri",h:
 "<p>İmdat işaretleri genelde <b>3'lüdür</b>: 3 ateş (üçgen ya da düz çizgi biçiminde, aralarında en az 20 m), 3 ışık, 3 el sallama. <b>Düdükle Alp imdat işareti:</b> bir dakika içinde 6 kez öttür, 1 dakika sus, sonra yeniden başla. <b>3 öttürme cevaptır</b> (\"duyduk\" demektir). Öttürmeleri yaklaşık 10 saniye arayla yap: art arda hızlı öttürme uzaktan tek ses gibi duyulur.</p><p><b>Çek · Tut · Yönlendir:</b> Açık ve yüksek bir yerde dikkat çek. Kurtarıcılar seni gördüklerini belli edene kadar işarete devam et. Sonra onları sesle ya da telsizle yönlendir. Arama helikopteri yalnızca bir kez geçebilir: işaret araçlarını yürürken <b>üstünde</b> taşı, her akşam <b>kur</b>. Bir yerden ayrılırken tarihli bir not ve yön işareti bırak.</p>"+F.g2a+
 "<ul><li><b>Sinyal aynası:</b> Güneşli havada 15 km'den de uzaktan görülür. Kolunu hedefe doğru uzat, parmaklarınla V yap, hedefi V'nin içine al. Aynadaki ışığı önce parmaklarına düşür, sonra hedefe kaydır. <u>Pilotun gözüne sürekli ışık tutma</u>: <b>aralıklı</b> yansıt. Hedef görünmese de aynayla ufku tara. Ayna yoksa diş macunuyla parlatılmış bir içecek kutusunun tabanı da iş görür.</li><li><b>Gece:</b> Fenerin ışığını yerde gezdir: gece görüş cihazı kullanan helikopter bunu görür. Ateş çubuğunun kıvılcımı da görünür. Işık çubuğunu 1 m'lik bir ipe bağlayıp daire çizerek çevir (yaklaşık 3 km'den görülür).</li><li><b>Sinyal ateşi:</b> Ateşi önceden hazırla: yerden yükseltilmiş bir platforma kur, üstünü yeşil dallarla ört (kuru kalsın), yanına yeşil yaprak yığ. Gündüz koyu duman, gece alev ver. <u><b>Kuru otlu bozkırda ve yazın sinyal ateşi yakma</b></u>: kaybolan birinin işaret ateşinin büyük bir orman yangınına dönüştüğü olmuştur.</li><li><b>Duman:</b> Duman zeminden ayrılmalı. Koyu zeminde (orman, çalılık) <b>beyaz duman</b> yap: ateşe yeşil yaprak, nemli ot ya da yosun at. Açık zeminde (kar, kum, kuru bozkır) <b>koyu duman</b> yap: ateşe lastik ya da yağlı bez at.</li><li><b>Renk:</b> Turuncu, kırmızı ya da en azından yeşil olmayan, zeminden belirgin biçimde ayrılan bir bez as.</li><li><b>Gece:</b> Fenerle, ateşle ya da telefon ekranıyla işaret ver (Araç › SOS ışık).</li><li><b>Helikoptere:</b> İki kolunu Y biçiminde yukarı kaldırırsan \"Evet, yardım lazım\" demektir. Bir kolun yukarıda, öbürü aşağıdaysa \"Hayır, iyiyiz\" demektir.</li><li><b>Yere işaret</b> (taş, dal, kazılmış toprak ya da renkli branda; her harf <b>en az 3 m</b> boyunda, 1 m kalınlıkta ve zeminden farklı renkte olsun): <b>V</b>: yardım lazım · <b>X</b>: tıbbi yardım lazım · <b>→</b>: bu yöne gittik · <b>Y</b>: evet · <b>N</b>: hayır. Karda ayakla çiğneyerek derin iz aç; gölge yapsın diye kenarlarını yükselt. Ayrılırken oku mutlaka bırak.</li></ul>"},
{id:"telefon",cat:"sin",ic:"sms",t:"Telefon & SMS stratejisi",d:"Şebeke tıkalıyken",h:
 st(["<b>SMS kullan:</b> Sesli aramalar hatları tıkar; SMS çok az kapasite kullanır ve gidene kadar sırada bekler. Operatörler 2023'te de bunu önerdi.","<b>Kısa yaz, gereken bilgiyi ver:</b> Kim olduğunu, durumunu, nerede olduğunu ve sonra ne yapacağını yaz. Ekip ekranındaki hazır mesajlar bunu yapar.","<b>Telefonu sabit saatlerde aç:</b> Örn. 08-12-18-21. Arada telefonu uçak moduna al; pil günlerce dayanır.","<b>Wi‑Fi arama</b> (VoWiFi): İnternete bağlı bir Wi‑Fi ağındaysan, mobil şebeke çalışmasa da arama yapabilirsin.","Durumunu <b>şehir dışındaki irtibat kişine</b> bildir: yerel hatlar tıkalıyken şehirlerarası arama geçebilir.","<b>112:</b> Kendi operatörün çekmese bile telefon acil arama için genellikle başka operatörün şebekesini kullanır; ekranda \"Sadece acil aramalar\" yazıyorsa 112'yi dene."])+
 cd("info","AFAD Acil Çağrı uygulaması için mobil veri gerekir (112'ye sesli ya da yazılı ulaşma, konum gönderme, toplanma alanı haritası). AKUT'un Güvendeyim uygulaması, önceden girdiğin kişilere SMS ile konumunu yollar. Hazırkal'daki Ekip ekranı aynı işi internetsiz yapar."),src:"AFAD; AKUT; operatör duyuruları 2023"},
{id:"telsiz",cat:"sin",ic:"radio",t:"Telsiz & frekanslar",d:"PMR446, amatör, radyo",h:

 '<tr><td>Amatör UHF acil</td><td>433.550 MHz</td><td>Kural aynı: yayın için belge gerekir, dinlemek serbesttir.</td></tr>'+

 '<tr><td>Havacılık acil</td><td>121.5 MHz (AM)</td><td>Yalnızca dinle.</td></tr>'+
 '<tr><td>TRT Radyo 1</td><td>FM frekansı ile göre değişir: ilinin frekansını önceden öğrenip not et · orta dalga (OD): 927 kHz</td><td>Resmî duyurular burada yapılır.</td></tr></table></div>'+
 cd("tip","<b>Ekip için:</b> en az 4 PMR446 el telsizi edinin; hepsi AA pille çalışsın (aynı pil tipi, yedeklemesi kolay). Telsizde kanalın yanında bir de CTCSS (kanal içi gizlilik kodu) seçilir. Kanal ve CTCSS kodunu önceden seç, Ekip › Buluşma noktalarına yaz.")+cd("warn","<b>Lisans:</b> Lisanssız konuşabileceğin el telsizi <b>PMR446</b> uyumlu olandır: en fazla 0,5 W, anteni sökülmeyen. Amatör frekanslarda (ör. 145 ve 433 MHz) yayın yapmak için BTK'dan alınan <b>amatör telsizcilik belgesi</b> gerekir. <u>Belgen yoksa bu frekanslarda yayın yapma</u>: cihaza el konabilir, para cezası verilir. İnternette satılan ucuz çift bantlı el telsizleri PMR446 kanallarında kullanılsa bile bu kurallara uymaz. Amatör frekansları dinlemek serbesttir.")+
 cd("info","<b>Uzun vadeli seçenek:</b> LoRa mesajlaşma cihazları (868 MHz; LoRa: az pil harcayan, uzun menzilli telsiz veri bağlantısı). Herkese küçük bir cihaz düşer; cihazlar şebeke olmadan şifreli kısa mesaj gönderir. Menzil şehirde 1–3 km, açık alanda 10 km'den fazladır. Ekip içinde en dayanıklı mesajlaşma yolu budur."),src:"BTK 2018; IARU R1; ARRL; TRT"},

{id:"griadam",cat:"kent",ic:"city",t:"Kaos ortamında şehirde hareket",d:"Dikkat çekme, kalabalıktan uzak dur",h:
 "<ul><li><b>Göze batma (\"gri insan\" ol):</b> Sıradan giyin. Askerî ya da kamuflaj giysi, pahalı ekipman, görünür silah ya da bıçak dikkat çeker. Sırt çantan sade ve eski olsun.</li><li><b>Kalabalıktan uzak dur:</b> Market, benzinlik, ATM, yardım dağıtım noktası ve gösteri alanları en riskli yerlerdir. İhtiyacını erken (Sarı seviyede) al; kargaşa başlayınca bu yerlere <u>gitme</u>.</li><li><b>Rota:</b> Ana cadde ve otoyol yerine paralel ara sokakları, parkları, dere kenarlarını kullan. Köprüler ve tüneller darboğazdır.</li><li><b>Zaman:</b> Sabahın erken saatleri en sakin zamandır. Gece yalnızca zorunluysa hareket et.</li><li><b>Kontrol noktaları:</b> Resmî kontrol noktasında sakin ol, kimliğini hazır tut, ellerini görünür tut, talimatlara uy.</li><li><b>Çatışma değil, kaçış:</b> Bir tehdit görürsen önce aranı aç ya da yolunu değiştir. Hiçbir eşya canından değerli değildir.</li></ul>"},
{id:"grupyuruyus",cat:"kent",ic:"users",t:"Grup yürüyüş düzeni",d:"≤10 kişi, 3–5 gün",h:
 "<ul><li><b>Sıra:</b> Önde rota bilen (navigatör), ortada çocuklar, yaşlılar ve en yavaş kişi, sonda deneyimli \"süpürgeci\" yürür; böylece kimse geride kalmaz. Hızı en yavaş kişiye göre ayarla.</li><li><b>Tempo:</b> Konuşabileceğin hızda yürü (en yüksek gücünün %60'ından az): bu hızda vücut yağ yakar ve birden tükenmezsin. Kışın terliyorsan fazla hızlısın. 50 dakika yürü, 10 dakika mola ver. Ayağında sıcaklık ya da sürtünme hissedersen molayı bekleme: hemen durup ayakkabını aç. Yükle yürürken günde 18–25 km gerçekçi bir hedeftir (yolsuz arazide 10–15 km).</li><li><b>Yük:</b> Yükün vücut ağırlığının %20'sini geçmesin. Su en ağır yüktür (1 litresi 1 kg): rotayı su noktalarına göre planla.</li><li><b>Sayım:</b> Her moladan kalkarken herkes sırayla numarasını söyler (\"bir, iki, …, on\").</li><li><b>İşaretler:</b> El kaldırmak \"dur\", avucu aşağı bastırmak \"eğil, sessiz ol\", parmakla göstermek \"tehlike var\" ya da \"bu yöne\" demektir.</li><li><b>Ayrılma kuralı:</b> Kimse yalnız kalmaz; herkesin bir eşi olsun, en az ikişer kişi hareket edin. Gruptan ayrı düşersen son ortak noktada bekle.</li><li><b>Gece kampı:</b> Kampı kurmaya kararmadan <b>3 saat önce</b> başla (Kamp düzeni sayfası). 2'şer saatlik nöbet tutun; nöbetçi ateşi ve ekipmanı korur.</li><li><b>Su:</b> Yola çıkmadan herkes 1 L su içsin; lider her molada herkesin içtiğini kontrol etsin. Yazın iki su noktası arasını 3–4 saatlik yürüyüşten uzun <u>planlama</u>.</li><li><b>Yürüyüş sopası:</b> Dengeni korur; suyun derinliğini ölçmeye, karı ve buzu yoklamaya, köpekleri uzak tutmaya yarar. Yanında yoksa ilk yapacağın alet budur.</li></ul>"},

/* ================= YİYECEK ================= */
{id:"yiyecek",cat:"yiy",ic:"food",t:"Yiyecek öncelikleri",d:"3 hafta var, önce kaloriyi koru",h:
 "<p>Sağlıklı bir yetişkin yemek yemeden 3 haftadan uzun yaşayabilir. İlk 2 gün açlık zor gelir ama vücut gücünü uzun süre korur. Soğukta ise şeker ve yağ şarttır: vücut ısıyı bunlardan üretir.</p>"+
 cd("info","<b>Kısa bir krizde (3–5 gün) yiyecek aramaya değmez:</b> aramak için harcayacağın enerji, bulacağın yiyecekten fazladır. Önce barınak ve su; çantandaki yiyecekle idare et.")+
 "<h2>Türkiye'de yiyecek nereden bulunur? (kolaydan zora)</h2>"+st([
 "<b>Taşıdığın yiyecek:</b> hafif ve kalorisi yüksek olanlar: kuruyemiş (~600 kcal/100 g), helva, fıstık ezmesi, zeytinyağı (~880 kcal/100 g), çikolata, kuru meyve, leblebi.",
 "<b>Köy ve kasaba:</b> Türkiye'nin çoğu yerinde birkaç saatlik yürüyüşle bir köye varılır. Para, takas ya da iş karşılığı ekmek, peynir, yumurta iste. Doğadan toplamaktan çok daha güvenli ve kolaydır.",
 "<b>Kesin tanıdığın yabani ot ve meyveler:</b> ilkbaharda ebegümeci, ısırgan, kuzukulağı, karahindiba; yaz sonu ve sonbaharda böğürtlen, alıç, kuşburnu, ahlat, kızılcık; sonbaharda ceviz, fındık, kestane, meşe palamudu. → <a href='#/g/bitkiyen'>Yenilebilir bitkiler</a>",
 "<b>Balık:</b> baraj, göl ve derelerde. → <a href='#/g/balik'>Balık, salyangoz, tuzak</a>",
 "<b>Salyangoz:</b> yağmurdan sonra çıkan iri bahçe salyangozu Türkiye'nin çoğu yerinde bulunur ve yenir. Nasıl pişirileceği aynı sayfada.",
 "<b>Böcek ve solucan:</b> en son çare; az kalori verir."])+
 "<ul><li>Az suyun varsa ton balığı gibi proteinli yiyecekleri azalt: sindirmek için su gerekir.</li><li>Şişmiş, sızdıran, açınca köpüren ya da kötü kokan konserveyi at: botulizm (ölümcül besin zehirlenmesi) yapabilir.</li></ul>"},
{id:"toplayici",cat:"yiy",ic:"leaf",t:"Doğadan yiyecek: güvenlik",d:"Bilmediğini yeme",h:
 cd("info","Soğukta az ama sık, şekerli ve yağlı bir şeyler ye. <b>Suyun yoksa yemek yeme:</b> sindirim vücuttaki suyu harcar.")+cd("warn","<u>Krizde mantar toplama, yeme.</u> Türkiye'de her yıl mantar zehirlenmesinden ölümler olur; ölümcül türler yenenlere çok benzer. <u>Maydanozgilleri (beyaz, şemsiye gibi çiçekli otları) yeme</u>: baldıran maydanoza ve havuca benzer, öldürür.")+
 "<p><b>Kurallar:</b> Yalnızca <b>kesin tanıdığın</b> bitkiyi ye: önce <a href='#/g/bitkizehir'>Zehirli bitkiler</a>, sonra <a href='#/g/bitkiyen'>Yenilebilir bitkiler</a> sayfasına bak. <u>Yol kenarından ve ilaçlanmış tarla kenarından toplama.</u> Kesin tanıdığın bir bitkiyi ilk kez yiyorsan az ye ve birkaç saat bekle (alerji, mide bozulması).</p><p><u>Tadarak deneme yapma.</u> Askerî kitaplardaki “evrensel yenebilirlik testi” güvenilir değildir: baldıran gibi bitkiler tek lokmada öldürebilir ve belirtiler saatler sonra başlar. Tanımıyorsan yeme.</p>"},
{id:"balik",cat:"yiy",ic:"food",t:"Balık & küçük av",d:"Sadece gerçek zorunlulukta",h:
 cd("info","Normal zamanda avcılık ve balıkçılık izin/ruhsat ve av dönemi kurallarına tabidir. Bu bilgiler yalnızca hayati zorunluluk içindir.")+
 "<ul><li><b>Balık:</b> Baraj ve göllerin çoğunda sazan, kadife, tatlı su kefali bulunur. Olta: iğne + misina + solucan/çekirge, sığ ve yosunlu kenarlarda sabah-akşam. Pasif (bırakıp bekleyen) oltalar kalori harcamaz: geceye birkaç olta kur.</li><li><b>Temizlik:</b> Solungaç kırmızı, göz parlak, kötü koku yok. İç organları temizle, iyice pişir.</li><li><b>Küçük av:</b> Tuzaklar enerji tasarrufludur ama beceri ister ve çoğu zaman boş çıkar. Önce bitki, balık ve böcek.</li></ul>"},

/* ================= HİJYEN & SAĞLIK ================= */
{id:"sanitasyon",cat:"hij",ic:"drop",t:"Tuvalet & sanitasyon",d:"Salgını önlemenin yolu",h:
 "<p>Afetten sonraki salgınların en sık nedeni bulaşıcı ishallerdir; bu yüzden tuvalet ve atık düzeni (sanitasyon) su kadar önemlidir. Lundin'in aktardığı bir çalışmaya göre arazide olan yaralanmaların yaklaşık %80'i burkulma, incinme ve yumuşak doku yaralanmasıdır; hastalıkların yaklaşık %60'ı viral hastalık ya da ishaldir. Hijyen ve küçük yara bakımı, ilk yardımın en çok kullanılan kısmıdır.</p>"+
 st(["<b>Arazide:</b> Sudan, kamptan ve patikadan en az 60 m uzakta (pınar ya da kuyu yakınında ve suyu çabuk geçiren toprakta <b>90 m'den fazla</b>) 15–20 cm derinliğinde küçük bir çukur (kedi çukuru) kaz; kullandıktan sonra toprakla ört.","<b>Grup kampında:</b> Kampın rüzgâr altında ve eğimin aşağısında kalan tarafına tek bir tuvalet hendeği kaz; her kullanımdan sonra üstüne toprak at.","<b>Evde, sifon çalışmıyorsa:</b> Klozete iç içe iki kalın poşet geçir; her kullanımdan sonra bir avuç talaş, kedi kumu ya da kireç at. Poşet dolunca ağzını bağla, kapaklı bir kovada dışarıda biriktir.","<b>El yıkama yeri:</b> Tuvaletin yanına musluklu, kapaklı bir bidon (ya da kapağı delikli bir şişe) ve sabun koy. Su az olsa bile <u>el yıkamayı bırakma</u>.","<b>Yemeği hazırlayan</b> kişi <u>tuvalet işlerine karışmasın</u>; varsa ayrı eldiven kullansın."])},
{id:"hijyen",cat:"hij",ic:"heart",t:"Kişisel hijyen & sağlık",d:"Diş, ayak, kadın sağlığı, ilaç",h:
 "<ul><li><b>Bezle banyo:</b> Günde bir kez 1 L suyla ıslattığın bezle koltuk altlarını, kasığını ve ayaklarını sil. Bu, mantarı ve sürtünme yarasını önler.</li><li><b>Diş:</b> Fırça yoksa dişlerini temiz bir bezle sil; uzun krizlerde diş ağrısı ciddi bir sorundur.</li><li><b>Kadın sağlığı:</b> Ped ya da adet kabı (menstrual kap) stoku yap. İdrar yolu enfeksiyonunu önlemek için bol su iç ve önden arkaya doğru temizlen.</li><li><b>Saç ve vücut:</b> Günde 2 kez saç derisinde kene olup olmadığına bak; gözlerini günde 2 kez temiz suyla çalkala. Sabun yoksa çöven kökünü ya da taze huş yaprağını sıcak suda çalkalayıp o suyla yıkan; az miktarda odun külü de işe yarar.</li><li><b>Sürekli kullanılan ilaç:</b> En az 2 haftalık yedek bulundur (doktorunla konuşarak 3 aylık). İnsülin gibi serin saklanması gereken ilaçlar için bir plan yap (serin su dolu kap, toprağa gömme).</li><li><b>Gözlük ve lens:</b> Yedek gözlük bulundur. Kirli ortamda lens takarsan göz enfeksiyonu riski artar.</li><li><b>Kayıt:</b> Ekip kartına alerjilerini, kan grubunu ve kronik hastalıklarını yaz (bilgiler yalnızca bu telefonda saklanır).</li></ul>"}
]);
})();
