---
# GoDaddy cPanel › Git Version Control › "Deploy HEAD Commit" bu adımları çalıştırır.
# site/ → hazirkal.com, yayin/uygulama/ → uygulama.hazirkal.com (ikisi de public_html dışında)
deployment:
  tasks:
    - export SITE=$HOME/hazirkal.com/
    - export APP=$HOME/uygulama.hazirkal.com/
    - /bin/mkdir -p $SITE $APP
    # Depoda sembolik bağ varsa dağıtım durur (bağ, belge kökü dışındaki bir dosyayı yayınlayabilir)
    - test -z "$(/usr/bin/find site yayin/uygulama -type l)" && /bin/cp -R site/. $SITE
    - test -z "$(/usr/bin/find site yayin/uygulama -type l)" && /bin/cp -R yayin/uygulama/. $APP
